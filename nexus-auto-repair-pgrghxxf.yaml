defaults:
  require_completion_gate: true
  max_parallel: 1
tasks:
- id: auto.repair.route.x
  description: 'AUTO-REPAIR: route:insufficient_signals'
  run: nexus:runner --task repair_phase_X
  priority: MEDIUM
  depends_on: []
  completion_gate:
    task_level: small_fix
    verify_commands:
    - /Users/jameschen/Workspace/nexus/.venv/bin/python scripts/nexus_cli.py nexus:benchmark
      --tasks 1 --output ci_benchmark_autorepair.csv
    artifact_paths:
    - ci_benchmark_autorepair.csv
    output_dir: /Users/jameschen/Workspace/nexus/logs/delivery
- id: auto.repair.route.d
  description: 'AUTO-REPAIR: route:insufficient_signals'
  run: nexus:runner --task repair_phase_D
  priority: HIGH
  depends_on:
  - auto.repair.route.x
  completion_gate:
    task_level: small_fix
    verify_commands:
    - /Users/jameschen/Workspace/nexus/.venv/bin/python scripts/nexus_cli.py nexus:benchmark
      --tasks 1 --output ci_benchmark_autorepair.csv
    artifact_paths:
    - ci_benchmark_autorepair.csv
    output_dir: /Users/jameschen/Workspace/nexus/logs/delivery
