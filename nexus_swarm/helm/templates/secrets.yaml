# 🛡️ Nexus Swarm mTLS Secrets
apiVersion: v1
kind: Secret
metadata:
  name: nexus-swarm-manager-tls
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Files.Get "certs/manager.crt" | b64enc | quote }}
  tls.key: {{ .Files.Get "certs/manager.key" | b64enc | quote }}
  ca.crt: {{ .Files.Get "certs/ca.crt" | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: nexus-swarm-node-tls
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Files.Get "certs/node.crt" | b64enc | quote }}
  tls.key: {{ .Files.Get "certs/node.key" | b64enc | quote }}
  ca.crt: {{ .Files.Get "certs/ca.crt" | b64enc | quote }}
