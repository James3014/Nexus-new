# Nexus Skeleton Model v1.1 Training Config (Ultra-Safe Smoke Run)
model: "Qwen/Qwen2.5-Coder-7B-Instruct"
data: "training/mlx_data"
train: true
iters: 2
batch_size: 1
max_seq_length: 1024
steps_per_report: 1
steps_per_eval: 2
learning_rate: 1e-5
save_every: 100
adapter_path: "training/adapters"
num_layers: 4
grad_checkpoint: true
lora_parameters:
  rank: 8
  alpha: 16
  scale: 2.0
  dropout: 0.05
