[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = benchmarks worktrees scripts .venv .git
addopts = -v --import-mode=importlib --ignore=benchmarks --ignore=worktrees --ignore=scripts --ignore=tests/unit/search/test_retry_controller.py --ignore=tests/unit/committee --ignore=tests/test_pact.py --ignore=tests/unit/test_local_resolver.py

asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning:lancedb.*
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:anyio.*
    ignore::DeprecationWarning:sentence_transformers.*
    ignore::ResourceWarning:asyncio.*
