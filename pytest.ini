[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = benchmarks worktrees scripts .venv .git
addopts = -v --ignore=benchmarks --ignore=worktrees --ignore=scripts -W ignore:.*RequestsDependencyWarning.*
asyncio_mode = auto
filterwarnings =
    ignore:.*RequestsDependencyWarning.*
    ignore:.*doesn't match a supported version.*
