[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = benchmarks worktrees scripts .venv .git
addopts = -v --import-mode=importlib --ignore=benchmarks --ignore=worktrees --ignore=scripts
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning:lancedb.*
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:anyio.*
    ignore::DeprecationWarning:sentence_transformers.*
    ignore::ResourceWarning:asyncio.*

