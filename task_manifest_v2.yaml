version: v0-longrun
defaults:
  ask_policy: no_ask
  max_retry: 2
  timeout_sec: 1800

tasks:
  - id: preflight.read_index
    depends_on: []
    run: "test -f docs/INDEX.md"
    done_when:
      type: command_rc_zero
    on_fail: escalate
    max_retry: 0

  - id: wp4.optimize.loop
    depends_on: [preflight.read_index]
    run: "uv run python3 scripts/ops/calc_learning_velocity.py || true"
    done_when:
      type: command_rc_zero
    on_fail: retry

  - id: bench.replay.hourly
    depends_on: [wp4.optimize.loop]
    run: "uv run scripts/nexus_cli.py nexus:benchmark --tasks 1 --output ci_benchmark.csv --framework health-audit"
    done_when:
      type: command_rc_zero
    on_fail: retry

  - id: gate.ci.hourly
    depends_on: [bench.replay.hourly]
    run: "uv run scripts/ops/ci_gate.py || true"
    done_when:
      type: command_rc_zero
    on_fail: continue

  - id: docs.sync.hourly
    depends_on: [gate.ci.hourly]
    run: "uv run scripts/nexus_cli.py nexus:runner --task docs.index.sync"
    done_when:
      type: command_rc_zero
    on_fail: continue

  - id: verify.phase_health.v1
    description: "Orchestrator delegate: Verify Phase Health v1 via Nexus Engine"
    run: "uv run scripts/nexus_cli.py nexus:benchmark --tasks 1 --framework health-audit --output verify_report.csv"
    depends_on: [docs.sync.hourly]
    priority: HIGH
