[[materials]]
id = "canonical-learning"
observe_command = ["bash", "-lc", "PY=\"$(bash scripts/ci/nexus_core_material_env.sh)\" && exec \"$PY\" scripts/ci/nexus_core_observe_dependency.py nexus-learning"]
