classification_rules:
  current:
    description: >
      Page reflects the present state of the system. Frontmatter lifecycle
      is 'current' and content is verified against the latest commit.

  superseded:
    description: >
      Page contains information that has been replaced by a canonical
      page. The page remains available for historical reference but
      should not be used as the primary source.

  historical:
    description: >
      Page documents a past state, decision, or implementation that
      is no longer active. Preserved for audit trail.

  draft:
    description: >
      Page is incomplete or under development. Should not be cited
      as authoritative.

  mixed_needs_review:
    description: >
      Page contains a mix of current and outdated content and requires
      manual review before classification.

