name: Nexus Smoke Benchmark

on:
  push:
    branches: [main, master]
  schedule:
    # Runs every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  smoke-benchmark:
    name: Run Nexus Smoke Benchmark
    runs-on: ubuntu-latest

    env:
      NEXUS_SANDBOX_MODE: smoke-ci
      NEXUS_MODEL: ${{ vars.NEXUS_MODEL || 'gemini-2.5-pro' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install Nexus dependencies
        run: uv pip install --system -e .

      - name: Run Smoke Benchmark
        run: |
          export NEXUS_MODEL="${{ env.NEXUS_MODEL }}"
          python scripts/ci/run_smoke_benchmark.py
        env:
          NEXUS_SANDBOX_MODE: smoke-ci

      - name: Upload Benchmark Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-benchmark-report-${{ github.sha }}
          path: |
            .nexus/reports/NEXUS_BENCHMARK_REPORT.md
            .nexus/reports/smoke_*.json
          retention-days: 90

      - name: Output Benchmark Summary to Job Notes
        if: always()
        run: |
          if [ -f ".nexus/reports/NEXUS_BENCHMARK_REPORT.md" ]; then
            echo "## Nexus Smoke Benchmark Results" >> $GITHUB_STEP_SUMMARY
            cat .nexus/reports/NEXUS_BENCHMARK_REPORT.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ Benchmark report not generated" >> $GITHUB_STEP_SUMMARY
          fi
