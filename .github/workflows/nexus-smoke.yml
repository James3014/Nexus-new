name: Nexus Smoke Benchmark

# ARCHIVED 2026-10-13 legacy-engine (ARCHIVED_2026-10-13-legacy-engine.md).
# This workflow ran scripts/ci/run_smoke_benchmark.py on every push to main and nightly. That
# script built the retired legacy NexusEngine and published NexusEngine.run_benchmark's
# hard-coded result ({"health": 100.0, "status": "PASS"}), which ignores the smoke cases: a
# manifest naming a case that does not exist also reported pass_rate 1.0. No workflow, script
# or repository consumed the uploaded artifact. Push and schedule triggers are removed; a manual
# dispatch only prints this notice and fails. Physical deletion waits for the deletion PR.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-benchmark:
    name: Run Nexus Smoke Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Archived (legacy NexusEngine smoke benchmark)
        run: |
          echo "ARCHIVED 2026-10-13 legacy-engine: the smoke benchmark reported a hard-coded PASS from the retired legacy NexusEngine; see ARCHIVED_2026-10-13-legacy-engine.md" >&2
          exit 1
