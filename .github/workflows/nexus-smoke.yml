name: Nexus Smoke Benchmark

on:
  push:
    branches: [main, master]
  schedule:
    # Runs every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-benchmark:
    name: Run Nexus Smoke Benchmark
    runs-on: ubuntu-latest

    env:
      NEXUS_SANDBOX_MODE: smoke-ci
      NEXUS_MODEL: ${{ vars.NEXUS_MODEL || 'gemini-2.5-pro' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.9.2

      - name: Install Nexus dependencies
        run: uv pip install --system -e .

      - name: Run Smoke Benchmark
        run: python scripts/ci/run_smoke_benchmark.py
        env:
          NEXUS_SANDBOX_MODE: smoke-ci

      - name: Upload Benchmark Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nexus-benchmark-report-${{ github.sha }}
          path: |
            .nexus/reports/NEXUS_BENCHMARK_REPORT.md
            .nexus/reports/smoke_*.json
          retention-days: 90

      - name: Output Benchmark Summary to Job Notes
        if: always()
        run: |
          if [ -f ".nexus/reports/NEXUS_BENCHMARK_REPORT.md" ]; then
            echo "## Nexus Smoke Benchmark Results" >> $GITHUB_STEP_SUMMARY
            cat .nexus/reports/NEXUS_BENCHMARK_REPORT.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ Benchmark report not generated" >> $GITHUB_STEP_SUMMARY
          fi
