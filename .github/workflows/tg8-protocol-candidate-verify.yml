name: TG8 Protocol Candidate Physical Verify

on:
  push:
    branches:
      - ops/tg8-mechanical-repair-20260905

permissions:
  contents: read

env:
  BASE_SHA: a5d7d032fe80838a84ed596ca36ea5bd923ae7a1
  TARGET_SHA: d1fbe1f1f399351b1fac2591db00a6f150179753
  EXPECTED_PROTOCOL: 1.0.0-rc.1
  GENERATION: rc

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: true
          submodules: false

      - name: Remove checkout credentials and install inert-gitlink metadata
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r entry; do
            key="${entry%% *}"
            credential_file="${entry#* }"
            case "$credential_file" in
              "$RUNNER_TEMP"/git-credentials-*.config) rm -f -- "$credential_file" ;;
              /github/runner_temp/git-credentials-*.config) ;;
              *) echo "unexpected checkout credential path: $credential_file" >&2; exit 1 ;;
            esac
            git config --local --unset-all "$key"
          done < <(git config --local --get-regexp '^includeif\.gitdir:.*\.path$' || true)
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          git config --local --unset-all core.sshCommand || true
          if git config --local --get-regexp '^includeif\.gitdir:.*\.path$' >/dev/null; then
            echo 'checkout credentials remain configured' >&2
            exit 1
          fi
          while IFS= read -r -d '' index_entry; do
            mode="${index_entry%% *}"
            if [ "$mode" != "160000" ]; then continue; fi
            gitlink_path="${index_entry#*$'\t'}"
            if ! git config --file .gitmodules --get "submodule.${gitlink_path}.path" >/dev/null 2>&1; then
              git config --file .gitmodules "submodule.${gitlink_path}.path" "$gitlink_path"
              git config --file .gitmodules "submodule.${gitlink_path}.url" .
            fi
          done < <(git ls-files --stage -z)

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.9.2'
          enable-cache: false

      - name: Verify exact subject and one-line Product mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = "product/protocol/__init__.py"
          python3 -c 'import os,re,pathlib; p=pathlib.Path("product/protocol/__init__.py").read_text(); m=re.search(r"^PUBLIC_PROTOCOL_VERSION = \"([^\"]+)\"$",p,re.M); assert m and m.group(1)==os.environ["EXPECTED_PROTOCOL"]; assert "IMPLEMENTATION_SCHEMA = \"nexus.changeset_certification.v2\"" in p'
          git diff --check HEAD^ HEAD

      - name: Materialize exact base and dependencies
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          BASE_WORKTREE="$RUNNER_TEMP/tg8-base"
          rm -rf "$BASE_WORKTREE"
          git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          echo "BASE_WORKTREE=$BASE_WORKTREE" >> "$GITHUB_ENV"
          uv sync --frozen --all-groups --all-extras
          UV_PROJECT_ENVIRONMENT="$BASE_WORKTREE/.venv" uv sync --directory "$BASE_WORKTREE" --frozen --all-groups --all-extras

      - name: Exact-base classify Product regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tg8-candidate-evidence"
          set +e
          "$BASE_WORKTREE/.venv/bin/python" -m pytest -q "$BASE_WORKTREE/tests/product" -m 'not live' --tb=short > "$RUNNER_TEMP/tg8-candidate-evidence/base-pytest.log" 2>&1
          base_status=$?
          .venv/bin/python -m pytest -q tests/product -m 'not live' --tb=short > "$RUNNER_TEMP/tg8-candidate-evidence/head-pytest.log" 2>&1
          head_status=$?
          set -e
          export base_status head_status
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "tg8-candidate-evidence"

          def failures(path: Path) -> set[str]:
              found: set[str] = set()
              for line in path.read_text(encoding="utf-8", errors="replace").splitlines():
                  match = re.match(r"^(?:FAILED|ERROR) ([^ ]+)", line)
                  if not match:
                      continue
                  node = match.group(1)
                  marker = "tests/"
                  if marker in node:
                      node = node[node.index(marker):]
                  found.add(node)
              return found

          base = failures(root / "base-pytest.log")
          head = failures(root / "head-pytest.log")
          new = head - base
          resolved = base - head
          generation = os.environ["GENERATION"]
          allowed = {
              "tests/product/test_changeset_certification_adapter.py::test_legacy_wire_shape_and_product_receipt_identity",
              "tests/product/test_kernel.py::test_protocol_versions_are_distinct",
          } if generation == "rc" else set()
          if generation == "rc" and new != allowed:
              raise SystemExit(f"unexpected RC Product deltas: {sorted(new)}")
          if generation != "rc" and new:
              raise SystemExit(f"unexpected Product deltas: {sorted(new)}")
          report = {
              "schema": "nexus.core-v1.tg8-exact-base-product-classification.v1",
              "generation": generation,
              "base_sha": os.environ["BASE_SHA"],
              "target_sha": os.environ["TARGET_SHA"],
              "base_exit": int(os.environ["base_status"]),
              "head_exit": int(os.environ["head_status"]),
              "base_failure_count": len(base),
              "head_failure_count": len(head),
              "new_failures": sorted(new),
              "allowed_version_snapshot_deltas": sorted(allowed),
              "resolved_failures": sorted(resolved),
              "classification": "EXACT_BASELINE_DEBT_NO_UNEXPECTED_NEW_FAILURES",
          }
          (root / "product-classification.json").write_text(
              json.dumps(report, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build and clean-install candidate wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/tg8-wheel" "$RUNNER_TEMP/tg8-venv"
          mkdir -p "$RUNNER_TEMP/tg8-wheel"
          uv build --wheel --out-dir "$RUNNER_TEMP/tg8-wheel"
          python3 -m venv "$RUNNER_TEMP/tg8-venv"
          "$RUNNER_TEMP/tg8-venv/bin/pip" install --no-deps "$RUNNER_TEMP"/tg8-wheel/*.whl
          "$RUNNER_TEMP/tg8-venv/bin/python" -c 'import os; from product.protocol import PUBLIC_PROTOCOL_VERSION; assert PUBLIC_PROTOCOL_VERSION == os.environ["EXPECTED_PROTOCOL"]'
          sha256sum "$RUNNER_TEMP"/tg8-wheel/*.whl > "$RUNNER_TEMP/tg8-candidate-evidence/wheel.sha256"

      - name: Emit immutable candidate receipt
        shell: bash
        run: |
          set -euo pipefail
          SUBJECT_TREE="$(git rev-parse HEAD^{tree})"
          PROTOCOL_BLOB="$(git rev-parse HEAD:product/protocol/__init__.py)"
          export SUBJECT_TREE PROTOCOL_BLOB
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "tg8-candidate-evidence"
          classification = json.loads((root / "product-classification.json").read_text())
          payload = {
              "schema": "nexus.core-v1.tg8-protocol-candidate-receipt.v1",
              "generation": os.environ["GENERATION"],
              "base_commit": os.environ["BASE_SHA"],
              "subject_commit": os.environ["TARGET_SHA"],
              "subject_tree": os.environ["SUBJECT_TREE"],
              "protocol_blob": os.environ["PROTOCOL_BLOB"],
              "public_protocol_version": os.environ["EXPECTED_PROTOCOL"],
              "product_regression_classification": classification["classification"],
              "base_failure_count": classification["base_failure_count"],
              "head_failure_count": classification["head_failure_count"],
              "new_failures": classification["new_failures"],
              "wheel_build": "PASS",
              "clean_install_readback": "PASS",
              "claim_ceiling": "EVIDENCE_CANDIDATE_ONLY_NO_PROMOTION",
          }
          (root / "receipt.json").write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Remove base worktree
        if: always()
        shell: bash
        run: |
          if [ -n "${BASE_WORKTREE:-}" ] && [ -d "$BASE_WORKTREE" ]; then
            git worktree remove --force "$BASE_WORKTREE"
          fi

      - name: Upload candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tg8-protocol-${{ env.GENERATION }}-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/tg8-candidate-evidence/
          if-no-files-found: error
          retention-days: 30
