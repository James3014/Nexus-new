name: Wiki Exact-Base Governance CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  wiki-governance:
    name: Exact-base Wiki governance regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Initialize evidence
        run: |
          mkdir -p "$RUNNER_TEMP/nexus-ci-wiki/base" "$RUNNER_TEMP/nexus-ci-wiki/head"
          printf '%s\n' '{"classification":"CI_BOOTSTRAP_DEFECT","blocking":true,"reason":"Wiki gate did not reach classification"}' > "$RUNNER_TEMP/nexus-ci-wiki/classification.json"
      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Remove checkout credentials
        run: |
          set -euo pipefail
          credential_count=0
          host_credential_count=0
          while IFS= read -r entry; do
            credential_count=$((credential_count + 1))
            key="${entry%% *}"
            credential_file="${entry#* }"
            case "$credential_file" in
              "$RUNNER_TEMP"/git-credentials-*.config)
                host_credential_count=$((host_credential_count + 1))
                rm -f -- "$credential_file"
                ;;
              /github/runner_temp/git-credentials-*.config) ;;
              *)
                echo "unexpected checkout credential path: $credential_file" >&2
                exit 1
                ;;
            esac
            git config --local --unset-all "$key"
          done < <(git config --local --get-regexp '^includeif\.gitdir:.*\.path$' || true)
          if [ "$credential_count" -eq 0 ] || [ "$host_credential_count" -eq 0 ]; then
            echo "checkout credential includeIf entries are missing" >&2
            exit 1
          fi
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          git config --local --unset-all core.sshCommand || true
          if git config --local --get-regexp '^includeif\.gitdir:.*\.path$' >/dev/null; then
            echo "checkout credentials remain configured" >&2
            exit 1
          fi
      - name: Link persistent evidence directory
        run: ln -s "$RUNNER_TEMP/nexus-ci-wiki" .ci-wiki
      - name: Decide cheap exact-base impact
        id: impact
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Exact revisions must be full 40-character lowercase SHAs" >&2
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            echo "Exact base or head commit is not present in this repository" >&2
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]]; then
            echo "Checked out HEAD does not match the bound HEAD_SHA" >&2
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REQUIRED="false"
          prefixes=('openwiki/' 'nexus_wiki_vault/' 'scripts/ops/wiki_' 'tests/ops/test_wiki_')
          while IFS= read -r path; do
            if [[ "$path" == ".github/workflows/wiki-governance.yml" ]]; then
              REQUIRED="true"
            fi
            for prefix in "${prefixes[@]}"; do
              if [[ "$path" == "$prefix"* ]]; then
                REQUIRED="true"
              fi
            done
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- pyproject.toml uv.lock; then
            REQUIRED="true"
          fi
          if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- scripts/ops/exact_base_tool_gate.py scripts/ops/wiki_ci_release_gate.py; then
            REQUIRED="true"
          fi
          echo "required=$REQUIRED" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and dependencies
        if: steps.impact.outputs.required == 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen --all-groups --all-extras
      - name: Resolve exact revisions and worktree
        if: steps.impact.outputs.required == 'true'
        id: revisions
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Exact revisions must be full 40-character lowercase SHAs" >&2
            exit 1
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          BASE_WORKTREE=$(mktemp -d /tmp/nexus-wiki-base.XXXXXX)
          git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          echo "base_worktree=$BASE_WORKTREE" >> "$GITHUB_OUTPUT"
      - name: Run Wiki gate on exact base and head
        if: steps.impact.outputs.required == 'true'
        id: wiki
        env:
          BASE_WORKTREE: ${{ steps.revisions.outputs.base_worktree }}
        run: |
          set +e
          .venv/bin/python "$BASE_WORKTREE/scripts/ops/wiki_ci_release_gate.py" \
            --check --repo-root "$BASE_WORKTREE" --output-dir "$GITHUB_WORKSPACE/.ci-wiki/base"
          echo "base_exit=$?" >> "$GITHUB_OUTPUT"
          .venv/bin/python scripts/ops/wiki_ci_release_gate.py \
            --check --repo-root "$GITHUB_WORKSPACE" --output-dir "$GITHUB_WORKSPACE/.ci-wiki/head"
          echo "head_exit=$?" >> "$GITHUB_OUTPUT"
      - name: Classify Wiki governance regression
        if: steps.impact.outputs.required == 'true'
        run: |
          set +e
          .venv/bin/python scripts/ops/exact_base_tool_gate.py \
            --tool wiki-governance \
            --base .ci-wiki/base/wiki-ci-release-governance-receipt.json \
            --head .ci-wiki/head/wiki-ci-release-governance-receipt.json \
            --base-root "${{ steps.revisions.outputs.base_worktree }}" \
            --head-root "$GITHUB_WORKSPACE" \
            --base-exit-code "${{ steps.wiki.outputs.base_exit }}" \
            --head-exit-code "${{ steps.wiki.outputs.head_exit }}" \
            --output .ci-wiki/classification.json
          STATUS=$?
          echo '## Exact-base Wiki governance classification' >> "$GITHUB_STEP_SUMMARY"
          cat .ci-wiki/classification.json >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"
      - name: Record non-Wiki impact
        if: steps.impact.outputs.required != 'true'
        run: |
          printf '%s\n' '{"classification":"PASS","blocking":false,"reason":"no Wiki-governed paths changed"}' > .ci-wiki/classification.json
      - name: Remove exact base worktree
        if: always() && steps.revisions.outputs.base_worktree != ''
        run: git worktree remove --force "${{ steps.revisions.outputs.base_worktree }}"
      - name: Install gitlink metadata for checkout post-cleanup
        if: always()
        run: |
          set -euo pipefail
          while IFS= read -r -d '' index_entry; do
            mode="${index_entry%% *}"
            if [ "$mode" != "160000" ]; then
              continue
            fi
            gitlink_path="${index_entry#*$'\t'}"
            if ! git config --file .gitmodules --get "submodule.${gitlink_path}.path" >/dev/null 2>&1; then
              git config --file .gitmodules "submodule.${gitlink_path}.path" "$gitlink_path"
              git config --file .gitmodules "submodule.${gitlink_path}.url" .
            fi
          done < <(git ls-files --stage -z)
          git submodule foreach --recursive ':'
      - name: Upload Wiki evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-base-wiki-${{ github.sha }}
          path: ${{ runner.temp }}/nexus-ci-wiki/
          if-no-files-found: error
          retention-days: 14
