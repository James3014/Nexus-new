name: Wiki Exact-Base Governance CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  wiki-governance:
    name: Exact-base Wiki governance regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Initialize evidence
        run: |
          mkdir -p .ci-wiki/base .ci-wiki/head
          printf '%s\n' '{"classification":"CI_BOOTSTRAP_DEFECT","blocking":true,"reason":"Wiki gate did not reach classification"}' > .ci-wiki/classification.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen --all-groups --all-extras
      - name: Resolve exact revisions, impact, and worktree
        id: revisions
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Exact revisions must be full 40-character lowercase SHAs" >&2
            exit 1
          fi
          git fetch --no-tags origin "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          BASE_WORKTREE=$(mktemp -d /tmp/nexus-wiki-base.XXXXXX)
          git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          .venv/bin/python - "$BASE_SHA" "$HEAD_SHA" "$GITHUB_OUTPUT" <<'PY'
          import subprocess
          import sys
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', sys.argv[1], sys.argv[2]], text=True
          ).splitlines()
          prefixes = ('openwiki/', 'nexus_wiki_vault/', 'scripts/ops/wiki_', 'tests/ops/test_wiki_')
          exact = {'.github/workflows/wiki-governance.yml'}
          required = any(path in exact or path.startswith(prefixes) for path in changed)
          with open(sys.argv[3], 'a', encoding='utf-8') as stream:
              stream.write(f'required={str(required).lower()}\n')
          PY
          echo "base_worktree=$BASE_WORKTREE" >> "$GITHUB_OUTPUT"
      - name: Run Wiki gate on exact base and head
        if: steps.revisions.outputs.required == 'true'
        id: wiki
        env:
          BASE_WORKTREE: ${{ steps.revisions.outputs.base_worktree }}
        run: |
          set +e
          .venv/bin/python "$BASE_WORKTREE/scripts/ops/wiki_ci_release_gate.py" \
            --check --repo-root "$BASE_WORKTREE" --output-dir "$GITHUB_WORKSPACE/.ci-wiki/base"
          echo "base_exit=$?" >> "$GITHUB_OUTPUT"
          .venv/bin/python scripts/ops/wiki_ci_release_gate.py \
            --check --repo-root "$GITHUB_WORKSPACE" --output-dir "$GITHUB_WORKSPACE/.ci-wiki/head"
          echo "head_exit=$?" >> "$GITHUB_OUTPUT"
      - name: Classify Wiki governance regression
        if: steps.revisions.outputs.required == 'true'
        run: |
          set +e
          .venv/bin/python scripts/ops/exact_base_tool_gate.py \
            --tool wiki-governance \
            --base .ci-wiki/base/wiki-ci-release-governance-receipt.json \
            --head .ci-wiki/head/wiki-ci-release-governance-receipt.json \
            --base-root "${{ steps.revisions.outputs.base_worktree }}" \
            --head-root "$GITHUB_WORKSPACE" \
            --base-exit-code "${{ steps.wiki.outputs.base_exit }}" \
            --head-exit-code "${{ steps.wiki.outputs.head_exit }}" \
            --output .ci-wiki/classification.json
          STATUS=$?
          echo '## Exact-base Wiki governance classification' >> "$GITHUB_STEP_SUMMARY"
          cat .ci-wiki/classification.json >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"
      - name: Record non-Wiki impact
        if: steps.revisions.outputs.required != 'true'
        run: |
          printf '%s\n' '{"classification":"PASS","blocking":false,"reason":"no Wiki-governed paths changed"}' > .ci-wiki/classification.json
      - name: Remove exact base worktree
        if: always() && steps.revisions.outputs.base_worktree != ''
        run: git worktree remove --force "${{ steps.revisions.outputs.base_worktree }}"
      - name: Upload Wiki evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-base-wiki-${{ github.sha }}
          path: .ci-wiki/
          retention-days: 14
