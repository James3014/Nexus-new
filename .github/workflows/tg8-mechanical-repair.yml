name: TG8 Mechanical Repair

on:
  push:
    branches:
      - ops/tg8-mechanical-repair-20260905

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TG8 Candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/issue-772-tg8-protocol-maturity
          fetch-depth: 0
          persist-credentials: true

      - name: Repair layer DAG seam
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode | python3

      - name: Format only authorized TG8 files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'ruff==0.15.17'
          ruff format --isolated product/protocol/compatibility_gate.py tests/benchmark/test_core_v1_tg8_protocol_gate.py
          ruff format --isolated --check product/protocol/compatibility_gate.py tests/benchmark/test_core_v1_tg8_protocol_gate.py

      - name: Static repair assertions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R '^from product\.benchmark' product/protocol/compatibility_gate.py
          python3 -m py_compile product/protocol/compatibility_gate.py tests/benchmark/test_core_v1_tg8_protocol_gate.py
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' product/protocol/compatibility_gate.py tests/benchmark/test_core_v1_tg8_protocol_gate.py | sort)"
          test "$changed" = "$expected"

      - name: Publish repaired commit to isolated output ref
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nexus TG8 Mechanical Repair'
          git config user.email 'nexus-tg8-repair@example.invalid'
          git add product/protocol/compatibility_gate.py tests/benchmark/test_core_v1_tg8_protocol_gate.py
          git commit -m 'fix(core-v1): repair TG8 layer boundary and format (#772)'
          git push --force-with-lease origin HEAD:refs/heads/ops/tg8-mechanical-repaired-output
