name: TG8 Mechanical Repair

on:
  push:
    branches:
      - ops/tg8-mechanical-repair-20260905

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TG8 Candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/issue-772-tg8-protocol-maturity
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize layer DAG seam
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode | python3

      - name: Install exact repository toolchain
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.9.2"
          enable-cache: false

      - name: Sync frozen dependencies
        shell: bash
        run: uv sync --frozen --all-groups --all-extras

      - name: Apply exact CI formatter
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/ruff format --preview product/protocol/compatibility_gate.py tests/benchmark/test_core_v1_tg8_protocol_gate.py
          .venv/bin/ruff format --check --preview product/protocol/compatibility_gate.py tests/benchmark/test_core_v1_tg8_protocol_gate.py

      - name: Static repair assertions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R '^from product\.benchmark' product/protocol/compatibility_gate.py
          python3 -m py_compile product/protocol/compatibility_gate.py tests/benchmark/test_core_v1_tg8_protocol_gate.py
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' product/protocol/compatibility_gate.py tests/benchmark/test_core_v1_tg8_protocol_gate.py | sort)"
          test "$changed" = "$expected"

      - name: Publish repaired commit to isolated output ref
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nexus TG8 Mechanical Repair'
          git config user.email 'nexus-tg8-repair@example.invalid'
          git add product/protocol/compatibility_gate.py tests/benchmark/test_core_v1_tg8_protocol_gate.py
          git commit -m 'fix(core-v1): align TG8 with exact CI formatter (#772)'
          git push --force origin HEAD:refs/heads/ops/tg8-mechanical-repaired-output
