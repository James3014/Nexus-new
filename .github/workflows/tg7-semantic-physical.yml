name: TG7 Semantic Physical Controller

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tg7-semantic-physical.yml
      - scripts/ops/tg7_github_physical.py
      - scripts/ops/tg7_github_physical_v2.py
      - scripts/ops/tg7_github_physical_v3.py

permissions:
  contents: read
  actions: read

env:
  TG7_SUBJECT: 3067b379a17e3848e6ee416bb1e5dca6b1b2938b
  TG5_SUBJECT: 10b4cf7cd0b9b9624795ac5001671190c750326b

jobs:
  collect:
    name: Semantic physical evidence collector
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Materialize exact support/TG7/TG5 sources
        env:
          SUPPORT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for spec in "ops:$SUPPORT_HEAD" "tg7-subject:$TG7_SUBJECT" "tg5-subject:$TG5_SUBJECT"; do
            dir="${spec%%:*}"
            sha="${spec#*:}"
            git init -q "$dir"
            git -C "$dir" remote add origin https://github.com/James3014/Nexus-new.git
            git -C "$dir" fetch -q --depth=1 origin "$sha"
            git -C "$dir" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
            test -z "$(git -C "$dir" status --porcelain)"
          done

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.2"
          enable-cache: false

      - name: Verify Docker
        run: docker info

      - name: Install frozen TG5/TG7 dependencies
        run: |
          set -euo pipefail
          uv sync --directory tg5-subject --frozen --all-groups --all-extras
          uv sync --directory tg7-subject --frozen --all-groups --all-extras

      - name: Run TG5 deterministic regression
        working-directory: tg5-subject
        run: uv run pytest -qq tests/product/test_http_runtime.py tests/product/test_http_e2e.py -m "not live"

      - name: Run TG5 live controller probe
        working-directory: tg5-subject
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXUS_CORE_HTTP_PORT: "8767"
        run: uv run pytest -p tests.product.test_http_e2e -qq tests/product/test_http_e2e.py -m live --run-live

      - name: Capture fresh TG5 receipt and provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p physical
          tg5-subject/.venv/bin/python ops/scripts/ops/tg7_github_physical.py tg5-capture \
            --subject tg5-subject \
            --output physical/tg5-receipt.json \
            --provenance physical/tg5-reverification.json

      - name: Collect 56 semantic cases x 2 fresh OCI executions
        run: |
          set -euo pipefail
          tg7-subject/.venv/bin/python ops/scripts/ops/tg7_github_physical_v3.py collect \
            --subject tg7-subject \
            --tg5-subject tg5-subject \
            --tg5-receipt physical/tg5-receipt.json \
            --tg5-provenance physical/tg5-reverification.json \
            --root physical/tg7 \
            --tar physical/tg7-semantic-physical.tar.gz
          sha256sum physical/tg7-semantic-physical.tar.gz | awk '{print $1}' > physical/tg7-semantic-physical.sha256

      - name: Upload immutable semantic collector artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tg7-semantic-collector-${{ env.TG7_SUBJECT }}
          path: |
            physical/tg7-semantic-physical.tar.gz
            physical/tg7-semantic-physical.sha256
          if-no-files-found: error
          retention-days: 30

  audit:
    name: Fresh semantic physical acceptance audit
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Materialize exact support/TG7/TG5 sources
        env:
          SUPPORT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for spec in "ops:$SUPPORT_HEAD" "tg7-subject:$TG7_SUBJECT" "tg5-subject:$TG5_SUBJECT"; do
            dir="${spec%%:*}"
            sha="${spec#*:}"
            git init -q "$dir"
            git -C "$dir" remote add origin https://github.com/James3014/Nexus-new.git
            git -C "$dir" fetch -q --depth=1 origin "$sha"
            git -C "$dir" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
            test -z "$(git -C "$dir" status --porcelain)"
          done

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.2"
          enable-cache: false

      - name: Install frozen exact-subject dependencies
        run: |
          set -euo pipefail
          uv sync --directory tg5-subject --frozen --all-groups --all-extras
          uv sync --directory tg7-subject --frozen --all-groups --all-extras

      - name: Download semantic collector artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tg7-semantic-collector-${{ env.TG7_SUBJECT }}
          path: received

      - name: Verify artifact digest and materialize fixed evidence root
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < received/tg7-semantic-physical.sha256)"
          actual="$(sha256sum received/tg7-semantic-physical.tar.gz | awk '{print $1}')"
          test "$actual" = "$expected"
          sudo mkdir -p /private/tmp/nexus-core-v1-evidence
          sudo chown -R "$(id -u):$(id -g)" /private
          tar -xzf received/tg7-semantic-physical.tar.gz -C /private/tmp/nexus-core-v1-evidence
          test "$(find /private/tmp/nexus-core-v1-evidence/tg7/attempts -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 56
          test "$(find /private/tmp/nexus-core-v1-evidence/tg7/observations -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 112

      - name: Run exact TG7-03 physical CLI readback
        working-directory: tg7-subject
        run: |
          set -euo pipefail
          chmod u+w /private/tmp/nexus-core-v1-evidence/tg7
          rm -f /private/tmp/nexus-core-v1-evidence/tg7/shadow-receipt.json /private/tmp/nexus-core-v1-evidence/tg7/report.json
          uv run python -m product.benchmark.tg7_shadow \
            --selection /private/tmp/nexus-core-v1-evidence/tg7/selection.json \
            --repository /private/tmp/nexus-core-v1-evidence/tg7/repository \
            --manifest /private/tmp/nexus-core-v1-evidence/tg7/corpus.json \
            --tg5-receipt /private/tmp/nexus-core-v1-evidence/tg7/tg5-receipt.json \
            --shadow-receipt /private/tmp/nexus-core-v1-evidence/tg7/shadow-receipt.json \
            --report /private/tmp/nexus-core-v1-evidence/tg7/report.json
          chmod 0444 /private/tmp/nexus-core-v1-evidence/tg7/shadow-receipt.json /private/tmp/nexus-core-v1-evidence/tg7/report.json

      - name: Run explicit physical acceptance tests
        working-directory: tg7-subject
        env:
          NEXUS_TG7_PHYSICAL_ACCEPTANCE: "1"
        run: |
          set -euo pipefail
          uv run pytest -qq tests/product/test_false_completion_benchmark.py tests/benchmark/test_core_v1_tg7_manifest.py \
            --junitxml="$RUNNER_TEMP/tg7-physical-pytest.xml"

      - name: Independently verify 112 observations and 56 observation-derived attempts
        run: |
          set -euo pipefail
          tg7-subject/.venv/bin/python ops/scripts/ops/tg7_github_physical_v3.py audit \
            --subject tg7-subject \
            --tg5-subject tg5-subject \
            --root /private/tmp/nexus-core-v1-evidence/tg7 \
            --junit "$RUNNER_TEMP/tg7-physical-pytest.xml" \
            --output "$RUNNER_TEMP/tg7-independent-acceptance.json"

      - name: Upload semantic independent acceptance receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tg7-semantic-independent-acceptance-${{ env.TG7_SUBJECT }}
          path: |
            ${{ runner.temp }}/tg7-independent-acceptance.json
            ${{ runner.temp }}/tg7-physical-pytest.xml
          if-no-files-found: error
          retention-days: 30
