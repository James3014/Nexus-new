name: TG7 trusted runtime repair bootstrap

on:
  push:
    branches:
      - infra/tg7-trusted-verifier-conftest

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: infra/tg7-trusted-verifier-conftest
          fetch-depth: 0
      - name: Bind existing locked legacy extra into trusted runtime
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d3b3652e7c7391aa075fc7d6fd4c5e0f076d886a HEAD
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/ops/trusted_deletion_anchor.py")
          text = path.read_text(encoding="utf-8")
          old = '''                "--group",\n                "dev",\n                "--no-emit-project",'''
          new = '''                "--group",\n                "dev",\n                "--extra",\n                "legacy",\n                "--no-emit-project",'''
          if text.count(old) != 1:
              raise SystemExit("trusted runtime export patch target drifted")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          git diff -- scripts/ops/trusted_deletion_anchor.py
          git rm .github/workflows/tg7-trusted-runtime-repair-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ops/trusted_deletion_anchor.py
          git commit -m "fix(ci): bind locked runtime deps into trusted verifier"
          git push origin HEAD:infra/tg7-trusted-verifier-conftest
