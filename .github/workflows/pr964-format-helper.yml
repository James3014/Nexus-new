name: PR964 format helper
on:
  push:
    branches: [codex/pr960-trusted-admission-20260914]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/pr960-trusted-admission-20260914
          fetch-depth: 0
      - run: python -m pip install ruff==0.15.17 pytest pytest-asyncio pytest-timeout
      - name: Format only new test delta and self-remove
        run: |
          set -euo pipefail
          ruff format tests/ops/test_trusted_deletion_anchor.py
          python -m pytest tests/ops/test_trusted_deletion_anchor.py -q
          git diff --check
          rm .github/workflows/pr964-format-helper.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/ops/test_trusted_deletion_anchor.py .github/workflows/pr964-format-helper.yml
          git commit -m 'style(ci): format PR960 trusted admission tests'
          git push origin HEAD:codex/pr960-trusted-admission-20260914
