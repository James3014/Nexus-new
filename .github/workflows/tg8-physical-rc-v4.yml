name: TG8 Physical RC Controller v4

on:
  push:
    branches: [ops/tg8-physical-rc-a5d7]

permissions:
  contents: read
  actions: read
  issues: read

env:
  CANDIDATE_SHA: a5d7d032fe80838a84ed596ca36ea5bd923ae7a1
  CANDIDATE_TREE: bb8739812a5beb13e5897c40014cf69b4d49389a
  RC1_SHA: d1fbe1f1f399351b1fac2591db00a6f150179753
  RC2_SHA: 968e88f2e8df7444ee2758d25182111830cd03e8
  STABLE_SHA: 4fd27ee64a0b4ad8e3f3326fd8c32014c9a391de

jobs:
  collect:
    name: TG8 physical observation collector v4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: ops/tg8-physical-rc-a5d7, path: support, persist-credentials: true, submodules: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ env.CANDIDATE_SHA }}', path: candidate, fetch-depth: 0, persist-credentials: true, submodules: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ env.RC1_SHA }}', path: rc1, fetch-depth: 2, persist-credentials: true, submodules: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ env.RC2_SHA }}', path: rc2, fetch-depth: 2, persist-credentials: true, submodules: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ env.STABLE_SHA }}', path: stable, fetch-depth: 2, persist-credentials: true, submodules: false}
      - name: Strip checkout credentials and verify subjects
        shell: bash
        run: |
          set -euo pipefail
          for d in support candidate rc1 rc2 stable; do git -C "$d" config --local --unset-all 'http.https://github.com/.extraheader' || true; done
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git -C rc1 rev-parse HEAD)" = "$RC1_SHA"
          test "$(git -C rc2 rev-parse HEAD)" = "$RC2_SHA"
          test "$(git -C stable rev-parse HEAD)" = "$STABLE_SHA"
          test "$(git -C rc1 rev-parse HEAD^)" = "$CANDIDATE_SHA"
          test "$(git -C rc2 rev-parse HEAD^)" = "$RC1_SHA"
          test "$(git -C stable rev-parse HEAD^)" = "$RC2_SHA"
          test "$(git -C rc1 diff --name-only HEAD^ HEAD)" = product/protocol/__init__.py
          test "$(git -C rc2 diff --name-only HEAD^ HEAD)" = product/protocol/__init__.py
          test "$(git -C stable diff --name-only HEAD^ HEAD)" = product/protocol/__init__.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12', check-latest: false}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with: {version: '0.9.2', enable-cache: false}
      - name: Sync exact adjudicator
        run: cd candidate && uv sync --frozen --all-groups --all-extras
      - name: Download accepted TG6/TG7 physical inputs
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upstream/tg6" "$RUNNER_TEMP/upstream/tg7zip" "$RUNNER_TEMP/upstream/tg7"
          gh api /repos/James3014/Nexus-new/actions/artifacts/9960033003/zip > "$RUNNER_TEMP/upstream/tg6.zip"
          gh api /repos/James3014/Nexus-new/actions/artifacts/9962254836/zip > "$RUNNER_TEMP/upstream/tg7.zip"
          echo '67c68ee594face7097770eb95aa58b9d75afc02a26c33ae68476c9c3a34e9d84  '"$RUNNER_TEMP/upstream/tg6.zip" | sha256sum -c -
          echo 'c0d49da97640610498b1cddf455c4eebdd93bb62ce93f80d5ea813f4cd543a08  '"$RUNNER_TEMP/upstream/tg7.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/upstream/tg6.zip" -d "$RUNNER_TEMP/upstream/tg6"
          unzip -q "$RUNNER_TEMP/upstream/tg7.zip" -d "$RUNNER_TEMP/upstream/tg7zip"
          cd "$RUNNER_TEMP/upstream/tg7zip"
          expected="$(tr -d '\r\n' < tg7-semantic-physical.sha256)"
          test "$(sha256sum tg7-semantic-physical.tar.gz | awk '{print $1}')" = "$expected"
          tar -xzf tg7-semantic-physical.tar.gz -C "$RUNNER_TEMP/upstream/tg7"
      - name: Stage upstream receipts only with existing controller
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/tg8-v4"; mkdir -p "$ROOT"
          cp support/scripts/ops/tg8_physical_rc_controller.py "$RUNNER_TEMP/stager.py"
          sed -i 's/d005c6e013d9f2a5315092b3aaf375b9ae322d7c/a5d7d032fe80838a84ed596ca36ea5bd923ae7a1/g' "$RUNNER_TEMP/stager.py"
          candidate/.venv/bin/python "$RUNNER_TEMP/stager.py" prepare --candidate candidate --tg6 "$RUNNER_TEMP/upstream/tg6" --tg7 "$RUNNER_TEMP/upstream/tg7/tg7" --out "$ROOT"
      - name: Build current RC1 RC2 Stable wheels
        shell: bash
        run: |
          set -euo pipefail
          for x in current rc1 rc2 stable; do mkdir -p "$RUNNER_TEMP/wheels/$x"; done
          (cd candidate && uv build --wheel --out-dir "$RUNNER_TEMP/wheels/current")
          (cd rc1 && uv build --wheel --out-dir "$RUNNER_TEMP/wheels/rc1")
          (cd rc2 && uv build --wheel --out-dir "$RUNNER_TEMP/wheels/rc2")
          (cd stable && uv build --wheel --out-dir "$RUNNER_TEMP/wheels/stable")
          echo "CURRENT_WHEEL=$(find "$RUNNER_TEMP/wheels/current" -name '*.whl' -print -quit)" >> "$GITHUB_ENV"
          echo "RC1_WHEEL=$(find "$RUNNER_TEMP/wheels/rc1" -name '*.whl' -print -quit)" >> "$GITHUB_ENV"
          echo "RC2_WHEEL=$(find "$RUNNER_TEMP/wheels/rc2" -name '*.whl' -print -quit)" >> "$GITHUB_ENV"
          echo "STABLE_WHEEL=$(find "$RUNNER_TEMP/wheels/stable" -name '*.whl' -print -quit)" >> "$GITHUB_ENV"
      - name: Replace synthetic matrices with physical v4 observations
        shell: bash
        run: |
          set -euo pipefail
          candidate/.venv/bin/python support/scripts/ops/tg8_physical_v4_overlay.py collect \
            --candidate candidate --rc1 rc1 --current-wheel "$CURRENT_WHEEL" --rc1-wheel "$RC1_WHEEL" --rc2-wheel "$RC2_WHEEL" --stable-wheel "$STABLE_WHEEL" \
            --evidence "$RUNNER_TEMP/tg8-v4" --raw "$RUNNER_TEMP/tg8-v4/raw-v4"
      - name: Run exact TG8 guards and adjudicator
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/tg8-v4"
          cd candidate
          uv run pytest -qq tests/benchmark/test_core_v1_tg8_protocol_gate.py | tee "$ROOT/tg8-pytest-v4.log"
          uv run pytest --collect-only -q tests/benchmark/test_core_v1_tg8_protocol_gate.py > "$ROOT/tg8-collect-v4.txt"
          uv run python -m product.protocol.compatibility_gate \
            --thresholds "$ROOT/thresholds.json" --expected-thresholds-sha256-file "$ROOT/thresholds.sha256" \
            --compatibility "$ROOT/protocol-compatibility.json" --conformance "$ROOT/client-conformance.json" --upgrade-rollback "$ROOT/upgrade-rollback.json" --open-issues "$ROOT/open-issues.json" \
            --tg4-receipt "$ROOT/tg4-receipt.json" --tg5-receipt "$ROOT/tg5-receipt.json" --tg6-receipt "$ROOT/tg6-receipt.json" \
            --tg7-selection "$ROOT/tg7-selection.json" --tg7-corpus "$ROOT/tg7-corpus.json" --tg7-shadow "$ROOT/tg7-shadow-receipt.json" --tg7-report "$ROOT/tg7-report.json" \
            --stable-run-1 "$ROOT/stable-run-1.json" --stable-run-2 "$ROOT/stable-run-2.json" --stable-run-3 "$ROOT/stable-run-3.json" --report "$ROOT/gate-report-v4.json" > "$ROOT/gate-stdout-v4.json"
          python3 - "$ROOT" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          r=Path(sys.argv[1]); g=json.load(open(r/'gate-report-v4.json')); fp=json.load(open(r/'physical-fingerprint-v4.json'))
          assert g['classification']=='PROTOCOL_RC_EVIDENCE_READY',g
          assert g['compatibility_counts']=={'failed':0,'refused':12,'supported':12,'total':24}
          assert g['conformance_summary']['parity'] is True and g['upgrade_summary']['failed']==0
          assert g['false_certification_count']==0 and g['stable_run_count']==0
          assert all([fp['client_parity'],fp['current_to_rc'],fp['rc_patch'],fp['rc_to_stable'],fp['bad_protocol'],fp['bad_schema'],fp['bad_receipt'],fp['ledger_valid'],not fp['foreign_ledger_valid'],fp['failed_restore']])
          b={'schema':'nexus.core-v1.tg8-physical-acceptance-v4.v1','status':'ACCEPT','classification':g['classification'],'subject_commit':g['subject_commit'],'subject_tree':g['subject_tree'],'report_hash':g['report_hash'],'stable_candidate_materialized':True,'stable_promotion_performed':False}; b['acceptance_hash']='sha256:'+hashlib.sha256(json.dumps(b,sort_keys=True,separators=(',',':')).encode()).hexdigest(); (r/'physical-acceptance-v4.json').write_text(json.dumps(b,sort_keys=True,separators=(',',':'))+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'tg8-physical-rc-v4-${{ env.CANDIDATE_SHA }}', path: '${{ runner.temp }}/tg8-v4/', if-no-files-found: error, retention-days: 30}

  audit:
    name: TG8 fresh independent physical audit v4
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: ops/tg8-physical-rc-a5d7, path: support, persist-credentials: true, submodules: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ env.CANDIDATE_SHA }}', path: candidate, fetch-depth: 0, persist-credentials: true, submodules: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ env.RC1_SHA }}', path: rc1, persist-credentials: true, submodules: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ env.RC2_SHA }}', path: rc2, persist-credentials: true, submodules: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ env.STABLE_SHA }}', path: stable, persist-credentials: true, submodules: false}
      - name: Strip credentials
        run: for d in support candidate rc1 rc2 stable; do git -C "$d" config --local --unset-all 'http.https://github.com/.extraheader' || true; done
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12', check-latest: false}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with: {version: '0.9.2', enable-cache: false}
      - run: cd candidate && uv sync --frozen --all-groups --all-extras
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with: {name: 'tg8-physical-rc-v4-${{ env.CANDIDATE_SHA }}', path: '${{ runner.temp }}/collector'}
      - name: Rebuild wheels independently
        shell: bash
        run: |
          set -euo pipefail
          for x in current rc1 rc2 stable; do mkdir -p "$RUNNER_TEMP/audit-wheels/$x"; done
          (cd candidate && uv build --wheel --out-dir "$RUNNER_TEMP/audit-wheels/current")
          (cd rc1 && uv build --wheel --out-dir "$RUNNER_TEMP/audit-wheels/rc1")
          (cd rc2 && uv build --wheel --out-dir "$RUNNER_TEMP/audit-wheels/rc2")
          (cd stable && uv build --wheel --out-dir "$RUNNER_TEMP/audit-wheels/stable")
          echo "CURRENT_WHEEL=$(find "$RUNNER_TEMP/audit-wheels/current" -name '*.whl' -print -quit)" >> "$GITHUB_ENV"
          echo "RC1_WHEEL=$(find "$RUNNER_TEMP/audit-wheels/rc1" -name '*.whl' -print -quit)" >> "$GITHUB_ENV"
          echo "RC2_WHEEL=$(find "$RUNNER_TEMP/audit-wheels/rc2" -name '*.whl' -print -quit)" >> "$GITHUB_ENV"
          echo "STABLE_WHEEL=$(find "$RUNNER_TEMP/audit-wheels/stable" -name '*.whl' -print -quit)" >> "$GITHUB_ENV"
      - name: Independently rerun physical probes
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/audit"
          candidate/.venv/bin/python support/scripts/ops/tg8_physical_v4_overlay.py audit \
            --candidate candidate --rc1 rc1 --current-wheel "$CURRENT_WHEEL" --rc1-wheel "$RC1_WHEEL" --rc2-wheel "$RC2_WHEEL" --stable-wheel "$STABLE_WHEEL" \
            --evidence "$RUNNER_TEMP/collector" --raw "$RUNNER_TEMP/audit"
      - name: Independently rerun exact adjudicator
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/collector"; cd candidate
          uv run python -m product.protocol.compatibility_gate --thresholds "$ROOT/thresholds.json" --expected-thresholds-sha256-file "$ROOT/thresholds.sha256" --compatibility "$ROOT/protocol-compatibility.json" --conformance "$ROOT/client-conformance.json" --upgrade-rollback "$ROOT/upgrade-rollback.json" --open-issues "$ROOT/open-issues.json" --tg4-receipt "$ROOT/tg4-receipt.json" --tg5-receipt "$ROOT/tg5-receipt.json" --tg6-receipt "$ROOT/tg6-receipt.json" --tg7-selection "$ROOT/tg7-selection.json" --tg7-corpus "$ROOT/tg7-corpus.json" --tg7-shadow "$ROOT/tg7-shadow-receipt.json" --tg7-report "$ROOT/tg7-report.json" --stable-run-1 "$ROOT/stable-run-1.json" --stable-run-2 "$ROOT/stable-run-2.json" --stable-run-3 "$ROOT/stable-run-3.json" --report "$RUNNER_TEMP/audit/audit-gate-report-v4.json" > "$RUNNER_TEMP/audit/audit-gate-stdout-v4.json"
          python3 - "$RUNNER_TEMP/audit/audit-gate-report-v4.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1])); assert r['classification']=='PROTOCOL_RC_EVIDENCE_READY'; assert r['false_certification_count']==0; assert r['conformance_summary']['parity'] is True; assert r['upgrade_summary']['failed']==0
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'tg8-independent-physical-audit-v4-${{ env.CANDIDATE_SHA }}', path: '${{ runner.temp }}/audit/', if-no-files-found: error, retention-days: 30}
