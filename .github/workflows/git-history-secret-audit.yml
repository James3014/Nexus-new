name: Git History Secret Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/git-history-secret-audit.yml'
      - 'scripts/ops/git_history_secret_scan.py'
      - 'tests/ops/test_git_history_secret_scan.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-secret-audit:
    name: Full published Git history secret audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Fetch every published branch and tag
        run: |
          set -euo pipefail
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Verify published-ref coverage
        run: |
          set -euo pipefail
          remote_heads="$(git ls-remote --heads origin | wc -l | tr -d ' ')"
          local_heads="$(git for-each-ref --format='%(refname)' refs/remotes/origin | grep -v '^refs/remotes/origin/HEAD$' | wc -l | tr -d ' ')"
          remote_tags="$(git ls-remote --tags origin | grep -v '\^{}$' | wc -l | tr -d ' ')"
          local_tags="$(git for-each-ref --format='%(refname)' refs/tags | wc -l | tr -d ' ')"
          test "$remote_heads" -gt 0
          test "$remote_heads" = "$local_heads"
          test "$remote_tags" = "$local_tags"
          printf 'published branches=%s tags=%s\n' "$local_heads" "$local_tags"

      - name: Run full-history secret scan
        run: |
          set -euo pipefail
          python3 scripts/ops/git_history_secret_scan.py \
            --repo . \
            --output git-history-secret-scan.json
          python3 -c 'import json; p=json.load(open("git-history-secret-scan.json", encoding="utf-8")); assert p["status"] == "PASS" and p["blocking_finding_count"] == 0 and p["secret_values_emitted"] is False; print("FULL_GIT_HISTORY_SECRET_SCAN_G2_VERIFIED")'

      - name: Upload scan receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: git-history-secret-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: git-history-secret-scan.json
          if-no-files-found: error
          retention-days: 14
