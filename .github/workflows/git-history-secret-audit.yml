name: Git History Secret Audit

on:
  # pull_request_target runs the default-branch copy of this workflow, so a PR
  # cannot edit this required check to report success (#1754). PR content is
  # fetched and scanned strictly as data; nothing from it is ever executed.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-secret-audit:
    name: Full published Git history secret audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No repository checkout step: the workspace never receives PR-controlled files.
      # Published refs and the PR head are fetched into a bare repository that is
      # only read by git plumbing and by the base-sourced scanner.
      - name: Fetch every published branch, tag and the PR head as data
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
          GIT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bare_repo="$RUNNER_TEMP/audit-data.git"
          remote_snapshot="$RUNNER_TEMP/g2-remote-refs.txt"
          local_snapshot="$RUNNER_TEMP/g2-local-refs.txt"
          if [ "$EVENT_NAME" = pull_request_target ]; then
            expected_head="$PR_HEAD_SHA"
          else
            expected_head="$PUSH_SHA"
          fi
          printf '%s' "$expected_head" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$expected_head" > "$RUNNER_TEMP/g2-expected-head.txt"
          basic_auth="$(printf '%s' "x-access-token:$GIT_TOKEN" | base64 | tr -d '\n')"
          # Credentials are passed per command through the environment and are
          # never written into repository configuration.
          gfetch() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
              GIT_CONFIG_VALUE_0="Authorization: basic $basic_auth" \
              git -C "$bare_repo" "$@"
          }
          git init --bare "$bare_repo"
          git -C "$bare_repo" remote add origin "https://github.com/$REPOSITORY.git"
          converged=false
          for attempt in 1 2 3; do
            gfetch fetch --force --prune --no-recurse-submodules origin \
              '+refs/heads/*:refs/remotes/origin/*' \
              '+refs/tags/*:refs/tags/*'
            {
              gfetch ls-remote --heads origin \
                | awk '{ref=$2; sub("^refs/heads/", "refs/remotes/origin/", ref); print ref " " $1}'
              gfetch ls-remote --tags origin \
                | awk '$2 !~ /\^\{\}$/ {print $2 " " $1}'
            } | LC_ALL=C sort > "$remote_snapshot"
            {
              git -C "$bare_repo" for-each-ref --format='%(refname) %(objectname)' refs/remotes/origin \
                | grep -v '^refs/remotes/origin/HEAD '
              git -C "$bare_repo" for-each-ref --format='%(refname) %(objectname)' refs/tags
            } | LC_ALL=C sort > "$local_snapshot"
            remote_refs="$(wc -l < "$remote_snapshot" | tr -d ' ')"
            local_refs="$(wc -l < "$local_snapshot" | tr -d ' ')"
            printf 'coverage attempt=%s remote_refs=%s local_refs=%s\n' \
              "$attempt" "$remote_refs" "$local_refs"
            if [ "$remote_refs" -gt 0 ] && cmp -s "$remote_snapshot" "$local_snapshot"; then
              converged=true
              break
            fi
            sleep 1
          done
          test "$converged" = true
          if [ "$EVENT_NAME" = pull_request_target ]; then
            # Fork PR heads are not on any origin branch; fetch them as a data ref
            # that the scanner treats like any other published ref.
            printf '%s' "$PR_NUMBER" | grep -Eq '^[0-9]+$'
            gfetch fetch --force --no-tags --no-recurse-submodules origin \
              "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr-head-$PR_NUMBER"
            test "$(git -C "$bare_repo" rev-parse "refs/remotes/origin/pr-head-$PR_NUMBER^{commit}")" = "$expected_head"
          else
            test "$(git -C "$bare_repo" rev-parse "$expected_head^{commit}")" = "$expected_head"
          fi
          git -C "$bare_repo" update-ref --no-deref HEAD "$expected_head"
          {
            git -C "$bare_repo" for-each-ref --format='%(refname) %(objectname)' refs/remotes/origin \
              | grep -v '^refs/remotes/origin/HEAD '
            git -C "$bare_repo" for-each-ref --format='%(refname) %(objectname)' refs/tags
          } | LC_ALL=C sort > "$local_snapshot"
          sha256sum "$local_snapshot" | awk '{print $1}' > "$RUNNER_TEMP/g2-ref-snapshot.sha256"
          printf 'published refs=%s snapshot_sha256=%s\n' \
            "$(wc -l < "$local_snapshot" | tr -d ' ')" "$(cat "$RUNNER_TEMP/g2-ref-snapshot.sha256")"

      - name: Run full-history secret scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bare_repo="$RUNNER_TEMP/audit-data.git"
          expected_head="$(cat "$RUNNER_TEMP/g2-expected-head.txt")"
          expected_snapshot="$(cat "$RUNNER_TEMP/g2-ref-snapshot.sha256")"
          # Run the scanner from the exact base (or the pushed main commit), never
          # the candidate's own copy, so a PR cannot weaken the gate it is judged by.
          if [ "$EVENT_NAME" = pull_request_target ]; then
            scanner_rev="$BASE_SHA"
          else
            scanner_rev="$PUSH_SHA"
          fi
          trusted_scanner="$RUNNER_TEMP/trusted_git_history_secret_scan.py"
          git -C "$bare_repo" show "$scanner_rev:scripts/ops/git_history_secret_scan.py" > "$trusted_scanner"
          python3 "$trusted_scanner" \
            --repo "$bare_repo" \
            --output git-history-secret-scan.json
          python3 -c 'import json,sys; p=json.load(open("git-history-secret-scan.json", encoding="utf-8")); assert p["status"] == "PASS" and p["blocking_finding_count"] == 0 and p["secret_values_emitted"] is False and p["source_revision"] == sys.argv[1] and p["published_ref_snapshot_sha256"] == sys.argv[2]; print("FULL_GIT_HISTORY_SECRET_SCAN_G2_VERIFIED")' \
            "$expected_head" "$expected_snapshot"

      - name: Upload scan receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: git-history-secret-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: git-history-secret-scan.json
          if-no-files-found: error
          retention-days: 14
