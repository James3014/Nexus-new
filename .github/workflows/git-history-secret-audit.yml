name: Git History Secret Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/git-history-secret-audit.yml'
      - 'scripts/ops/git_history_secret_scan.py'
      - 'tests/ops/test_git_history_secret_scan.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-secret-audit:
    name: Full published Git history secret audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Fetch every published branch and tag
        run: |
          set -euo pipefail
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Converge and verify published-ref coverage
        run: |
          set -euo pipefail
          remote_snapshot="$RUNNER_TEMP/g2-remote-refs.txt"
          local_snapshot="$RUNNER_TEMP/g2-local-refs.txt"
          converged=false
          for attempt in 1 2 3; do
            git fetch --force --prune origin \
              '+refs/heads/*:refs/remotes/origin/*' \
              '+refs/tags/*:refs/tags/*'
            {
              git ls-remote --heads origin \
                | awk '{ref=$2; sub("^refs/heads/", "refs/remotes/origin/", ref); print ref " " $1}'
              git ls-remote --tags origin \
                | awk '$2 !~ /\^\{\}$/ {print $2 " " $1}'
            } | LC_ALL=C sort > "$remote_snapshot"
            {
              git for-each-ref --format='%(refname) %(objectname)' refs/remotes/origin \
                | grep -v '^refs/remotes/origin/HEAD '
              git for-each-ref --format='%(refname) %(objectname)' refs/tags
            } | LC_ALL=C sort > "$local_snapshot"
            remote_refs="$(wc -l < "$remote_snapshot" | tr -d ' ')"
            local_refs="$(wc -l < "$local_snapshot" | tr -d ' ')"
            printf 'coverage attempt=%s remote_refs=%s local_refs=%s\n' \
              "$attempt" "$remote_refs" "$local_refs"
            if [ "$remote_refs" -gt 0 ] && cmp -s "$remote_snapshot" "$local_snapshot"; then
              converged=true
              break
            fi
            sleep 1
          done
          test "$converged" = true
          sha256sum "$local_snapshot" | awk '{print $1}' > "$RUNNER_TEMP/g2-ref-snapshot.sha256"
          printf 'published refs=%s snapshot_sha256=%s\n' \
            "$local_refs" "$(cat "$RUNNER_TEMP/g2-ref-snapshot.sha256")"

      - name: Remove checkout credentials before repository code
        run: |
          set -euo pipefail
          credential_count=0
          host_credential_count=0
          while IFS= read -r entry; do
            credential_count=$((credential_count + 1))
            key="${entry%% *}"
            credential_file="${entry#* }"
            case "$credential_file" in
              "$RUNNER_TEMP"/git-credentials-*.config)
                host_credential_count=$((host_credential_count + 1))
                rm -f -- "$credential_file"
                ;;
              /github/runner_temp/git-credentials-*.config) ;;
              *)
                echo "unexpected checkout credential path" >&2
                exit 1
                ;;
            esac
            git config --local --unset-all "$key"
          done < <(git config --local --get-regexp '^includeif\.gitdir:.*\.path$' || true)
          if [ "$credential_count" -eq 0 ] || [ "$host_credential_count" -eq 0 ]; then
            echo "checkout credential includeIf entries are missing" >&2
            exit 1
          fi
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          git config --local --unset-all core.sshCommand || true
          if git config --local --get-regexp '^includeif\.gitdir:.*\.path$' >/dev/null; then
            echo "checkout credentials remain configured" >&2
            exit 1
          fi

      - name: Run full-history secret scan
        run: |
          set -euo pipefail
          expected_head="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          expected_snapshot="$(cat "$RUNNER_TEMP/g2-ref-snapshot.sha256")"
          python3 scripts/ops/git_history_secret_scan.py \
            --repo . \
            --output git-history-secret-scan.json
          python3 -c 'import json,sys; p=json.load(open("git-history-secret-scan.json", encoding="utf-8")); assert p["status"] == "PASS" and p["blocking_finding_count"] == 0 and p["secret_values_emitted"] is False and p["source_revision"] == sys.argv[1] and p["published_ref_snapshot_sha256"] == sys.argv[2]; print("FULL_GIT_HISTORY_SECRET_SCAN_G2_VERIFIED")' \
            "$expected_head" "$expected_snapshot"

      - name: Upload scan receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: git-history-secret-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: git-history-secret-scan.json
          if-no-files-found: error
          retention-days: 14
