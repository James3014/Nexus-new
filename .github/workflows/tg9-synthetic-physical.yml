name: TG9 Synthetic Physical Acceptance

on:
  push:
    branches: [ops/tg9-synthetic-physical-20260905]

permissions:
  contents: read
  actions: read

env:
  TARGET_SHA: e2ea79f05e95fbbfeb107053e8e3db2daff59bb2
  TARGET_TREE: 78da10b2402f8c25f4d04ae5b470e7c10bd984f7

jobs:
  collect:
    name: TG9 synthetic physical collector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ops/tg9-synthetic-physical-20260905
          fetch-depth: 0
          persist-credentials: true
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.9.2'
          enable-cache: false
      - name: Strip checkout credential
        run: git config --local --unset-all 'http.https://github.com/.extraheader' || true
      - name: Collect exact-head synthetic physical evidence
        run: bash scripts/ops/tg9_synthetic_physical_runner.sh collect
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tg9-synthetic-physical-${{ env.TARGET_SHA }}
          path: ${{ env.TG9_COLLECT_ROOT }}/
          if-no-files-found: error
          retention-days: 30

  audit:
    name: TG9 fresh independent synthetic audit
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ops/tg9-synthetic-physical-20260905
          fetch-depth: 0
          persist-credentials: true
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.9.2'
          enable-cache: false
      - name: Strip checkout credential
        run: git config --local --unset-all 'http.https://github.com/.extraheader' || true
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: tg9-synthetic-physical-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/collector
      - name: Independently rerun exact-head synthetic physical evidence
        env:
          COLLECTOR_ROOT: ${{ runner.temp }}/collector
        run: bash scripts/ops/tg9_synthetic_physical_runner.sh audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tg9-independent-synthetic-audit-${{ env.TARGET_SHA }}
          path: ${{ env.TG9_AUDIT_ROOT }}/
          if-no-files-found: error
          retention-days: 30
