name: Nexus Lint CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    name: Run Ruff Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch origin/main
        run: git fetch origin main:main || true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv sync --frozen --all-groups --all-extras
        env:
          UV_SYSTEM_PYTHON: 0

      - name: Run Ruff Check (Changed Files Only)
        run: |
          # Get list of changed python files
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.py')
          if [ -n "$CHANGED_FILES" ]; then
            echo "Linting: $CHANGED_FILES"
            uv run ruff check $CHANGED_FILES
          else
            echo "No changed python files to lint."
          fi
      
      - name: Run Ruff Format (Check Only, Changed Files)
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.py')
          if [ -n "$CHANGED_FILES" ]; then
            uv run ruff format --check $CHANGED_FILES
          else
            echo "No changed python files to format check."
          fi
