name: Nexus Lint CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    name: Run Ruff Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch origin/main
        run: git fetch origin main:main || true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv sync --frozen --all-groups --all-extras
        env:
          UV_SYSTEM_PYTHON: 0

      - name: Detect Changed Files (Commit-safe vs PR-safe)
        id: files
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "Mode: PR-safe (diff against origin/main)"
            FILES=$(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.py')
          else
            echo "Mode: Commit-safe (diff against HEAD~1)"
            # Handle cases where HEAD~1 might not exist (e.g. initial commit)
            FILES=$(git diff --name-only --diff-filter=ACMR HEAD~1...HEAD -- '*.py' || git ls-files -- '*.py')
          fi
          
          # Clean up whitespace and newlines for GitHub output
          FILES_CLEAN=$(echo $FILES | tr '\n' ' ')
          echo "changed_files=$FILES_CLEAN" >> $GITHUB_OUTPUT
          echo "Detected files: $FILES_CLEAN"

      - name: Run Ruff Check
        if: steps.files.outputs.changed_files != ''
        run: |
          uv run ruff check ${{ steps.files.outputs.changed_files }}
      
      - name: Run Ruff Format (Check Only)
        if: steps.files.outputs.changed_files != ''
        run: |
          uv run ruff format --check ${{ steps.files.outputs.changed_files }}

      - name: No Python Changes
        if: steps.files.outputs.changed_files == ''
        run: echo "No changed python files to lint."
