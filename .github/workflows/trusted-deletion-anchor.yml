name: Trusted deletion-evidence bootstrap anchor

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  trusted-controller:
    name: Trusted controller (default branch)
    outputs:
      manifest_sha256: ${{ steps.external-anchor.outputs.manifest_sha256 }}
      external_anchor_sha256: ${{ steps.external-anchor.outputs.external_anchor_sha256 }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Assert immutable workflow checkout
        env:
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_WORKFLOW_SHA"
      - name: Build immutable controller bundle
        id: build-bundle
        env:
          EVENT_JSON: ${{ toJSON(github.event) }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python -c 'import json, os; event=json.loads(os.environ["EVENT_JSON"]); event.update(event_name=os.environ["EVENT_NAME"], workflow_ref=os.environ["WORKFLOW_REF"], workflow_sha=os.environ["WORKFLOW_SHA"], run_id=int(os.environ["RUN_ID"])); json.dump(event, open(os.environ["RUNNER_TEMP"] + "/anchor-event.json", "w"))'
          python scripts/ops/trusted_deletion_anchor.py controller \
            --event-json "$RUNNER_TEMP/anchor-event.json" \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP/trusted-anchor"
      - name: Publish fixed external anchor
        id: external-anchor
        run: |
          set -euo pipefail
          echo "manifest_sha256=$(sha256sum "$RUNNER_TEMP/trusted-anchor/manifest.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "external_anchor_sha256=$(sha256sum "$RUNNER_TEMP/trusted-anchor/external-anchor.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload controller bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trusted-anchor-controller-${{ github.run_id }}
          path: ${{ runner.temp }}/trusted-anchor/
          if-no-files-found: error
          retention-days: 7
      - name: Install gitlink metadata for checkout post-cleanup
        if: always()
        run: |
          set -euo pipefail
          while IFS= read -r -d '' index_entry; do
            mode="${index_entry%% *}"
            if [ "$mode" != "160000" ]; then
              continue
            fi
            gitlink_path="${index_entry#*$'\t'}"
            path_value="$(git config --file .gitmodules --get "submodule.${gitlink_path}.path" 2>/dev/null || true)"
            url_value="$(git config --file .gitmodules --get "submodule.${gitlink_path}.url" 2>/dev/null || true)"
            if [ -z "$path_value" ] || [ -z "$url_value" ]; then
              git config --file .gitmodules "submodule.${gitlink_path}.path" "$gitlink_path"
              git config --file .gitmodules "submodule.${gitlink_path}.url" .
            fi
          done < <(git ls-files --stage -z)

  unprivileged-executor:
    name: Unprivileged executor (bundle only)
    needs: trusted-controller
    if: needs.trusted-controller.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download controller bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: trusted-anchor-controller-${{ github.run_id }}
          path: ${{ runner.temp }}/trusted-anchor
      - name: Execute only the hash-bound bundle
        run: |
          set -euo pipefail
          python "${RUNNER_TEMP}/trusted-anchor/trusted_deletion_anchor.py" executor \
            --bundle-dir "$RUNNER_TEMP/trusted-anchor"
      - name: Upload fixed-schema raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trusted-anchor-executor-${{ github.run_id }}
          path: ${{ runner.temp }}/trusted-anchor/raw-evidence.json
          if-no-files-found: error
          retention-days: 7

  trusted-verifier:
    name: Trusted verifier (default branch)
    needs: [trusted-controller, unprivileged-executor]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Assert immutable workflow checkout
        env:
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_WORKFLOW_SHA"
      - name: Download controller bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: trusted-anchor-controller-${{ github.run_id }}
          path: ${{ runner.temp }}/trusted-anchor
      - name: Download executor evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: trusted-anchor-executor-${{ github.run_id }}
          path: ${{ runner.temp }}/trusted-anchor/evidence
      - name: Verify fixed schema and recomputed digests
        env:
          EXPECTED_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_EVENT_NAME: ${{ github.event_name }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.trusted-controller.outputs.manifest_sha256 }}
          EXPECTED_EXTERNAL_ANCHOR_SHA256: ${{ needs.trusted-controller.outputs.external_anchor_sha256 }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/trusted-anchor/evidence/raw-evidence.json"
          cp "$RUNNER_TEMP/trusted-anchor/evidence/raw-evidence.json" "$RUNNER_TEMP/trusted-anchor/raw-evidence.json"
          python scripts/ops/trusted_deletion_anchor.py verifier \
            --bundle-dir "$RUNNER_TEMP/trusted-anchor" \
            --expected-workflow-ref "$EXPECTED_WORKFLOW_REF" \
            --expected-workflow-sha "$EXPECTED_WORKFLOW_SHA" \
            --expected-run-id "$EXPECTED_RUN_ID" \
            --verify-evidence "$RUNNER_TEMP/trusted-anchor/raw-evidence.json" \
            --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256" \
            --expected-external-anchor-sha256 "$EXPECTED_EXTERNAL_ANCHOR_SHA256" \
            --expected-event-name "$EXPECTED_EVENT_NAME" \
            --expected-repository "$EXPECTED_REPOSITORY" \
            --expected-default-branch "$EXPECTED_DEFAULT_BRANCH" \
            --expected-pull-request-number "$EXPECTED_PULL_REQUEST_NUMBER" \
            --expected-base-sha "$EXPECTED_BASE_SHA" \
            --expected-head-sha "$EXPECTED_HEAD_SHA"
      - name: Install gitlink metadata for checkout post-cleanup
        if: always()
        run: |
          set -euo pipefail
          while IFS= read -r -d '' index_entry; do
            mode="${index_entry%% *}"
            if [ "$mode" != "160000" ]; then
              continue
            fi
            gitlink_path="${index_entry#*$'\t'}"
            path_value="$(git config --file .gitmodules --get "submodule.${gitlink_path}.path" 2>/dev/null || true)"
            url_value="$(git config --file .gitmodules --get "submodule.${gitlink_path}.url" 2>/dev/null || true)"
            if [ -z "$path_value" ] || [ -z "$url_value" ]; then
              git config --file .gitmodules "submodule.${gitlink_path}.path" "$gitlink_path"
              git config --file .gitmodules "submodule.${gitlink_path}.url" .
            fi
          done < <(git ls-files --stage -z)
