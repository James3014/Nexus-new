name: Policy Lane Gate CI

on:
  push:
    branches: [main, master, 'feature/**']
    paths:
      - 'nexus/engine/**'
      - 'nexus/core/**'
      - 'nexus/governance/**'
      - 'nexus/services/**'
      - 'nexus/delivery/**'
      - 'nexus-core-rs/src/**'
      - 'docs/reports/policy-manifest.v2.json'
  pull_request:
    branches: [main, master]
    paths:
      - 'nexus/engine/**'
      - 'nexus/core/**'
      - 'nexus/governance/**'
      - 'nexus/services/**'
      - 'nexus/delivery/**'
      - 'nexus-core-rs/src/**'
      - 'docs/reports/policy-manifest.v2.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-lane-gate:
    name: Policy Lane Gate Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.2"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-extras
        env:
          UV_SYSTEM_PYTHON: 0

      - name: Detect changed policy files without shell interpolation
        id: files
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/policy-files.nul"
          : > "$out"

          changed_paths() {
            if [ "$EVENT_NAME" = "pull_request" ]; then
              git diff --name-only -z --diff-filter=ACMR origin/main...HEAD
            else
              git diff --name-only -z --diff-filter=ACMR HEAD~1...HEAD || git ls-files -z
            fi
          }

          while IFS= read -r -d '' path; do
            case "$path" in
              nexus/engine/*|nexus/core/*|nexus/governance/*|nexus/services/*|nexus/delivery/*|nexus-core-rs/src/*|docs/reports/policy-manifest.v2.json)
                printf '%s\0' "$path" >> "$out"
                ;;
            esac
          done < <(changed_paths)

          echo "path_file=$out" >> "$GITHUB_OUTPUT"
          if [ -s "$out" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Policy Lane Gate Check
        if: steps.files.outputs.has_changes == 'true'
        env:
          POLICY_FILE_LIST: ${{ steps.files.outputs.path_file }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking policy lane gates for changed files..."
          violations=0

          while IFS= read -r -d '' file; do
            printf 'Checking: %q\n' "$file"
            if ! python scripts/ops/policy_lane_precommit.py --staged-files "$file"; then
              violations=$((violations + 1))
            fi
          done < "$POLICY_FILE_LIST"

          if [ "$violations" -gt 0 ]; then
            echo "## ❌ Policy Lane Gate Violations" >> "$GITHUB_STEP_SUMMARY"
            echo "Found $violations hard lane violations." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "## ✅ Policy Lane Gate Passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Lane Gate Tests
        run: |
          uv run pytest tests/ops/test_policy_lane_gate.py -v --tb=short

      - name: No Policy Changes
        if: steps.files.outputs.has_changes != 'true'
        run: echo "No policy-governed files changed. Skipping lane gate check."
