name: TG7 trusted verifier owner bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  bootstrap-trusted-verifier:
    name: Trusted verifier (default branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.2"
          enable-cache: false
      - name: Execute exact owner-bootstrap trusted verifier pipeline
        env:
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "James3014/Nexus-new"
          test "$DEFAULT_BRANCH" = "main"
          test "$HEAD_SHA" = "$(git rev-parse HEAD)"
          test "$BASE_SHA" = "$(printf '%s' "$BASE_SHA" | grep -E '^[0-9a-f]{40}$')"
          test "$HEAD_SHA" = "$(printf '%s' "$HEAD_SHA" | grep -E '^[0-9a-f]{40}$')"
          script="scripts/ops/trusted_deletion_anchor.py"
          test -f "$script"
          python - <<'PY'
          import json, os
          event = {
              "event_name": "pull_request_target",
              "workflow_ref": "James3014/Nexus-new/.github/workflows/trusted-deletion-anchor.yml@refs/heads/main",
              "workflow_sha": os.environ["HEAD_SHA"],
              "run_id": int(os.environ["RUN_ID"]),
              "repository": {
                  "full_name": os.environ["REPOSITORY"],
                  "default_branch": os.environ["DEFAULT_BRANCH"],
              },
              "pull_request": {
                  "number": int(os.environ["PR_NUMBER"]),
                  "base": {
                      "sha": os.environ["BASE_SHA"],
                      "repo": {"full_name": os.environ["REPOSITORY"]},
                  },
                  "head": {"sha": os.environ["HEAD_SHA"]},
              },
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "bootstrap-event.json"), "w", encoding="utf-8") as fh:
              json.dump(event, fh, sort_keys=True)
          PY
          python "$script" runtime-builder \
            --repo-root "$GITHUB_WORKSPACE" \
            --workflow-sha "$HEAD_SHA" \
            --uv-executable "$(command -v uv)" \
            --output-dir "$RUNNER_TEMP/runtime-built"
          python "$script" controller \
            --event-json "$RUNNER_TEMP/bootstrap-event.json" \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP/bundle" \
            --runtime-dir "$RUNNER_TEMP/runtime-built"
          python "$RUNNER_TEMP/bundle/trusted_deletion_anchor.py" executor \
            --bundle-dir "$RUNNER_TEMP/bundle"
          manifest_sha="$(sha256sum "$RUNNER_TEMP/bundle/manifest.json" | cut -d' ' -f1)"
          anchor_sha="$(sha256sum "$RUNNER_TEMP/bundle/external-anchor.json" | cut -d' ' -f1)"
          python "$script" verifier \
            --bundle-dir "$RUNNER_TEMP/bundle" \
            --expected-workflow-ref "James3014/Nexus-new/.github/workflows/trusted-deletion-anchor.yml@refs/heads/main" \
            --expected-workflow-sha "$HEAD_SHA" \
            --expected-run-id "$RUN_ID" \
            --verify-evidence "$RUNNER_TEMP/bundle/raw-evidence.json" \
            --expected-manifest-sha256 "$manifest_sha" \
            --expected-external-anchor-sha256 "$anchor_sha" \
            --expected-event-name pull_request_target \
            --expected-repository "$REPOSITORY" \
            --expected-default-branch "$DEFAULT_BRANCH" \
            --expected-pull-request-number "$PR_NUMBER" \
            --expected-base-sha "$BASE_SHA" \
            --expected-head-sha "$HEAD_SHA"
          test "$(git status --porcelain)" = ""
