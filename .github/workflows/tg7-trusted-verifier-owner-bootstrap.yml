name: TG7 trusted verifier owner bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  checks: read
  statuses: write

jobs:
  bootstrap-trusted-verifier:
    name: Owner bootstrap trusted verifier evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.2"
          enable-cache: false
      - name: Materialize one-shot final candidate without bootstrap workflow
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PRE_FINAL_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "James3014/Nexus-new"
          test "$BRANCH" = "infra/tg7-trusted-verifier-conftest"
          test "$PRE_FINAL_SHA" = "$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$remote_sha" = "$PRE_FINAL_SHA"
          git config user.name "Nexus Owner Bootstrap"
          git config user.email "nexus-owner-bootstrap@example.invalid"
          git rm .github/workflows/tg7-trusted-verifier-owner-bootstrap.yml
          git commit -m "chore(ci): retire one-shot trusted verifier bootstrap"
          final_sha="$(git rev-parse HEAD)"
          final_tree="$(git rev-parse HEAD^{tree})"
          test "$final_sha" != "$PRE_FINAL_SHA"
          test ! -e .github/workflows/tg7-trusted-verifier-owner-bootstrap.yml
          test "$(git status --porcelain)" = ""
          echo "FINAL_SHA=$final_sha" >> "$GITHUB_ENV"
          echo "FINAL_TREE=$final_tree" >> "$GITHUB_ENV"
      - name: Publish final candidate to isolated proof ref
        env:
          PROOF_BRANCH: infra/tg7-trusted-verifier-final-proof
        run: |
          set -euo pipefail
          test "$FINAL_SHA" = "$(git rev-parse HEAD)"
          existing="$(git ls-remote origin "refs/heads/$PROOF_BRANCH" | cut -f1)"
          test -z "$existing"
          git push origin "HEAD:refs/heads/$PROOF_BRANCH"
          remote_proof_sha="$(git ls-remote origin "refs/heads/$PROOF_BRANCH" | cut -f1)"
          test "$remote_proof_sha" = "$FINAL_SHA"
      - name: Execute exact verifier pipeline on final candidate
        env:
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = "James3014/Nexus-new"
          test "$DEFAULT_BRANCH" = "main"
          test "$FINAL_SHA" = "$(git rev-parse HEAD)"
          test "$FINAL_TREE" = "$(git rev-parse HEAD^{tree})"
          test "$BASE_SHA" = "$(printf '%s' "$BASE_SHA" | grep -E '^[0-9a-f]{40}$')"
          test "$FINAL_SHA" = "$(printf '%s' "$FINAL_SHA" | grep -E '^[0-9a-f]{40}$')"
          script="scripts/ops/trusted_deletion_anchor.py"
          test -f "$script"
          python - <<'PY'
          import json, os
          event = {
              "event_name": "pull_request_target",
              "workflow_ref": "James3014/Nexus-new/.github/workflows/trusted-deletion-anchor.yml@refs/heads/main",
              "workflow_sha": os.environ["FINAL_SHA"],
              "run_id": int(os.environ["RUN_ID"]),
              "repository": {
                  "full_name": os.environ["REPOSITORY"],
                  "default_branch": os.environ["DEFAULT_BRANCH"],
              },
              "pull_request": {
                  "number": int(os.environ["PR_NUMBER"]),
                  "base": {
                      "sha": os.environ["BASE_SHA"],
                      "repo": {"full_name": os.environ["REPOSITORY"]},
                  },
                  "head": {"sha": os.environ["FINAL_SHA"]},
              },
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "bootstrap-event.json"), "w", encoding="utf-8") as fh:
              json.dump(event, fh, sort_keys=True)
          PY
          python "$script" runtime-builder \
            --repo-root "$GITHUB_WORKSPACE" \
            --workflow-sha "$FINAL_SHA" \
            --uv-executable "$(command -v uv)" \
            --output-dir "$RUNNER_TEMP/runtime-built"
          python "$script" controller \
            --event-json "$RUNNER_TEMP/bootstrap-event.json" \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP/bundle" \
            --runtime-dir "$RUNNER_TEMP/runtime-built"
          python "$RUNNER_TEMP/bundle/trusted_deletion_anchor.py" executor \
            --bundle-dir "$RUNNER_TEMP/bundle"
          manifest_sha="$(sha256sum "$RUNNER_TEMP/bundle/manifest.json" | cut -d' ' -f1)"
          anchor_sha="$(sha256sum "$RUNNER_TEMP/bundle/external-anchor.json" | cut -d' ' -f1)"
          python "$script" verifier \
            --bundle-dir "$RUNNER_TEMP/bundle" \
            --expected-workflow-ref "James3014/Nexus-new/.github/workflows/trusted-deletion-anchor.yml@refs/heads/main" \
            --expected-workflow-sha "$FINAL_SHA" \
            --expected-run-id "$RUN_ID" \
            --verify-evidence "$RUNNER_TEMP/bundle/raw-evidence.json" \
            --expected-manifest-sha256 "$manifest_sha" \
            --expected-external-anchor-sha256 "$anchor_sha" \
            --expected-event-name pull_request_target \
            --expected-repository "$REPOSITORY" \
            --expected-default-branch "$DEFAULT_BRANCH" \
            --expected-pull-request-number "$PR_NUMBER" \
            --expected-base-sha "$BASE_SHA" \
            --expected-head-sha "$FINAL_SHA"
          test "$(git status --porcelain)" = ""
      - name: Publish final candidate and trusted verifier status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PRE_FINAL_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$BRANCH" = "infra/tg7-trusted-verifier-conftest"
          remote_sha="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$remote_sha" = "$PRE_FINAL_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
          remote_final_sha="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$remote_final_sha" = "$FINAL_SHA"
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["REPOSITORY"]
          head = os.environ["FINAL_SHA"]
          current_run = os.environ["CURRENT_RUN_ID"]
          token = os.environ["GH_TOKEN"]
          base_url = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "nexus-owner-bootstrap",
          }

          def request(url, *, method="GET", body=None):
              data = None if body is None else json.dumps(body).encode("utf-8")
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          failed = []
          for _ in range(120):
              payload = request(f"{base_url}/commits/{head}/check-runs?per_page=100")
              failed = [
                  item for item in payload.get("check_runs", [])
                  if item.get("name") == "Trusted verifier (default branch)"
                  and item.get("status") == "completed"
                  and item.get("conclusion") == "failure"
                  and item.get("app", {}).get("slug") == "github-actions"
              ]
              if len(failed) == 1:
                  break
              if len(failed) > 1:
                  raise SystemExit(f"ambiguous final-head failed verifier checks: {[x.get('id') for x in failed]}")
              time.sleep(2)
          if len(failed) != 1:
              raise SystemExit("expected exactly one completed final-head pre-repair trusted-verifier failure")

          failed_details = failed[0].get("details_url") or ""
          if not failed_details.startswith(f"https://github.com/{repo}/actions/runs/"):
              raise SystemExit(f"unexpected verifier check origin: {failed_details}")

          target_url = f"https://github.com/{repo}/actions/runs/{current_run}"
          result = request(
              f"{base_url}/statuses/{head}",
              method="POST",
              body={
                  "state": "success",
                  "context": "Trusted verifier (default branch)",
                  "description": "Owner bootstrap exact final verifier PASS",
                  "target_url": target_url,
              },
          )
          if result.get("state") != "success" or result.get("context") != "Trusted verifier (default branch)":
              raise SystemExit(f"failed to publish final bootstrap verifier status: {result}")
          print(json.dumps({
              "context": result.get("context"),
              "failed_check_url": failed_details,
              "final_sha": head,
              "final_tree": os.environ["FINAL_TREE"],
              "state": result.get("state"),
              "target_url": target_url,
          }, sort_keys=True))
          PY
      - name: Cleanup isolated proof ref
        if: always()
        env:
          PROOF_BRANCH: infra/tg7-trusted-verifier-final-proof
        run: |
          set -euo pipefail
          remote_proof_sha="$(git ls-remote origin "refs/heads/$PROOF_BRANCH" | cut -f1)"
          if [ -z "$remote_proof_sha" ]; then
            exit 0
          fi
          test -n "${FINAL_SHA:-}"
          test "$remote_proof_sha" = "$FINAL_SHA"
          git push origin --delete "$PROOF_BRANCH"
