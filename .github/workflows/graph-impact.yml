name: Nexus Graph Impact Analysis 🕸️

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze-impact:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Get Changed Files
        id: files
        run: |
          # Get list of changed files separated by commas
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...origin/${{ github.head_ref }} | tr '\n' ',' | sed 's/,$//')
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Run Nexus Impact Analysis
        id: nexus
        run: |
          python3 scripts/engine/ci_graph_impact.py --files "${{ steps.files.outputs.files }}" --out PR_REPORT.md
          
      - name: Post Comment to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('PR_REPORT.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
