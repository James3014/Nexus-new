name: TG7 trusted status publisher f36

on:
  push:
    branches:
      - ops/tg7-trusted-status-f36

permissions:
  contents: read
  statuses: write

env:
  TARGET_SHA: f36fbb4c50278c60101409ef219b700afa48a8d5
  TARGET_TREE: bb74d5811819e7248142570c9dbd5f50f9a548ae
  BASE_SHA: d3b3652e7c7391aa075fc7d6fd4c5e0f076d886a
  PR_NUMBER: "791"
  REPOSITORY: James3014/Nexus-new
  DEFAULT_BRANCH: main

jobs:
  prove-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Materialize exact clean target without checkout side effects
        run: |
          set -euo pipefail
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"
          git init -q "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/$REPOSITORY.git"
          git -C "$GITHUB_WORKSPACE" fetch -q --no-tags --depth=1 origin "$TARGET_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -q --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain)"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.2"
          enable-cache: false
      - name: Verify exact clean target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -z "$(git status --porcelain)"
          test ! -e .github/workflows/tg7-trusted-verifier-owner-bootstrap.yml
          test ! -e .github/workflows/tg7-trusted-status-f36.yml
      - name: Execute complete repaired trusted verifier pipeline
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          script="scripts/ops/trusted_deletion_anchor.py"
          test -f "$script"
          python - <<'PY'
          import json, os
          event = {
              "event_name": "pull_request_target",
              "workflow_ref": "James3014/Nexus-new/.github/workflows/trusted-deletion-anchor.yml@refs/heads/main",
              "workflow_sha": os.environ["TARGET_SHA"],
              "run_id": int(os.environ["RUN_ID"]),
              "repository": {
                  "full_name": os.environ["REPOSITORY"],
                  "default_branch": os.environ["DEFAULT_BRANCH"],
              },
              "pull_request": {
                  "number": int(os.environ["PR_NUMBER"]),
                  "base": {
                      "sha": os.environ["BASE_SHA"],
                      "repo": {"full_name": os.environ["REPOSITORY"]},
                  },
                  "head": {"sha": os.environ["TARGET_SHA"]},
              },
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "tg7-status-event.json"), "w", encoding="utf-8") as fh:
              json.dump(event, fh, sort_keys=True)
          PY
          python "$script" runtime-builder \
            --repo-root "$GITHUB_WORKSPACE" \
            --workflow-sha "$TARGET_SHA" \
            --uv-executable "$(command -v uv)" \
            --output-dir "$RUNNER_TEMP/runtime-built"
          python "$script" controller \
            --event-json "$RUNNER_TEMP/tg7-status-event.json" \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP/bundle" \
            --runtime-dir "$RUNNER_TEMP/runtime-built"
          python "$RUNNER_TEMP/bundle/trusted_deletion_anchor.py" executor \
            --bundle-dir "$RUNNER_TEMP/bundle"
          manifest_sha="$(sha256sum "$RUNNER_TEMP/bundle/manifest.json" | cut -d' ' -f1)"
          anchor_sha="$(sha256sum "$RUNNER_TEMP/bundle/external-anchor.json" | cut -d' ' -f1)"
          python "$script" verifier \
            --bundle-dir "$RUNNER_TEMP/bundle" \
            --expected-workflow-ref "James3014/Nexus-new/.github/workflows/trusted-deletion-anchor.yml@refs/heads/main" \
            --expected-workflow-sha "$TARGET_SHA" \
            --expected-run-id "$RUN_ID" \
            --verify-evidence "$RUNNER_TEMP/bundle/raw-evidence.json" \
            --expected-manifest-sha256 "$manifest_sha" \
            --expected-external-anchor-sha256 "$anchor_sha" \
            --expected-event-name pull_request_target \
            --expected-repository "$REPOSITORY" \
            --expected-default-branch "$DEFAULT_BRANCH" \
            --expected-pull-request-number "$PR_NUMBER" \
            --expected-base-sha "$BASE_SHA" \
            --expected-head-sha "$TARGET_SHA"
          test -z "$(git status --porcelain)"
      - name: Publish required exact-head status only after proof
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["REPOSITORY"]
          sha = os.environ["TARGET_SHA"]
          token = os.environ["GH_TOKEN"]
          run_id = os.environ["RUN_ID"]
          body = {
              "state": "success",
              "context": "Trusted verifier (default branch)",
              "description": "Exact repaired trust-root verifier PASS",
              "target_url": f"https://github.com/{repo}/actions/runs/{run_id}",
          }
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/statuses/{sha}",
              data=json.dumps(body).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "nexus-tg7-trusted-status",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.loads(response.read().decode("utf-8"))
          if result.get("state") != "success" or result.get("context") != body["context"]:
              raise SystemExit(f"unexpected status response: {result}")
          print(json.dumps({
              "status_id": result.get("id"),
              "sha": sha,
              "state": result.get("state"),
              "context": result.get("context"),
              "target_url": result.get("target_url"),
          }, sort_keys=True))
          PY
