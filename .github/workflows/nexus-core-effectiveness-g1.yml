name: Nexus Core Effectiveness G1

on:
  pull_request:
    branches: [main]
    paths:
      - "nexus/research/core_effectiveness_mutation.py"
      - "tests/research/test_core_effectiveness_mutation.py"
      - "scripts/ops/nexus_core_effectiveness_g1.py"
      - "docs/research/nexus_core_effectiveness_v1/g1_mutation_matrix.json"
      - ".github/workflows/nexus-core-effectiveness-g1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-mutation:
    name: G1 controlled evidence mutation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact evaluator head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Checkout frozen Nexus Core subject
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: James3014/nexus-core
          ref: 2c9b746d0ae2da87af4a252b39eb09ae623d7467
          path: .g1/nexus-core
          fetch-depth: 1
          persist-credentials: false

      - name: Verify frozen subject identity
        run: |
          set -euo pipefail
          test "$(git -C .g1/nexus-core rev-parse HEAD)" = "2c9b746d0ae2da87af4a252b39eb09ae623d7467"
          test "$(git -C .g1/nexus-core rev-parse HEAD^{tree})" = "f418704c4241e089bc52e6d2966b8a6f6786b47e"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.2"
          enable-cache: false

      - name: Install frozen subject dependencies
        run: |
          set -euo pipefail
          UV_PROJECT_ENVIRONMENT="$GITHUB_WORKSPACE/.g1/nexus-core/.venv" \
            uv sync --directory "$GITHUB_WORKSPACE/.g1/nexus-core" --frozen --all-groups

      - name: Run controlled mutation matrix
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nexus-core-g1"
          "$GITHUB_WORKSPACE/.g1/nexus-core/.venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/ops/nexus_core_effectiveness_g1.py" \
            --matrix "$GITHUB_WORKSPACE/docs/research/nexus_core_effectiveness_v1/g1_mutation_matrix.json" \
            --core-root "$GITHUB_WORKSPACE/.g1/nexus-core" \
            --report "$RUNNER_TEMP/nexus-core-g1/report.json"

      - name: Validate G1 report ceiling
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(os.environ["RUNNER_TEMP"], "nexus-core-g1", "report.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = {
              "gate": "G1_CONTROLLED_MUTATION_PASSED",
              "claim_ceiling": "CONTROLLED_FIXTURE_CORRECTNESS_ONLY",
              "auto_chain": False,
              "subject_revision_match": True,
              "mutants_total": 15,
              "mutants_detected": 15,
              "deterministic_mutant_escape_count": 0,
              "false_block_control_count": 0,
          }
          for key, value in expected.items():
              if report.get(key) != value:
                  raise SystemExit(
                      f"G1 report mismatch for {key}: {report.get(key)!r} != {value!r}"
                  )
          if report.get("controls_total", 0) < 1:
              raise SystemExit("G1 report contains no valid controls")
          if report.get("controls_passed") != report.get("controls_total"):
              raise SystemExit("G1 valid control failed")
          PY

      - name: Upload G1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nexus-core-effectiveness-g1-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/nexus-core-g1/
          if-no-files-found: error
          retention-days: 14
