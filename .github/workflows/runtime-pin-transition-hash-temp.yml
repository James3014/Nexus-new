name: Runtime pin transition patcher temporary

on:
  push:
    branches:
      - codex/trusted-runtime-pin-transition-960-20260914

permissions:
  contents: write

jobs:
  materialize-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout policy branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: codex/trusted-runtime-pin-transition-960-20260914
          fetch-depth: 1
          persist-credentials: true

      - name: Install temporary gitlink metadata for checkout cleanup
        run: |
          set -euo pipefail
          while IFS= read -r -d '' index_entry; do
            mode="${index_entry%% *}"
            if [ "$mode" != "160000" ]; then
              continue
            fi
            gitlink_path="${index_entry#*$'\t'}"
            if ! git config --file .gitmodules --get "submodule.${gitlink_path}.path" >/dev/null 2>&1; then
              git config --file .gitmodules "submodule.${gitlink_path}.path" "$gitlink_path"
              git config --file .gitmodules "submodule.${gitlink_path}.url" .
            fi
          done < <(git ls-files --stage -z)

      - name: Apply exact transition, verify syntax, and self-delete
        run: |
          set -euo pipefail
          python3 scripts/ops/pr960_transition_patcher_temp.py
          python3 -m py_compile scripts/ops/trusted_deletion_anchor.py tests/ops/test_trusted_deletion_anchor_dependency_transition.py
          git diff --check
          git rm .github/workflows/runtime-pin-transition-hash-temp.yml scripts/ops/pr960_transition_patcher_temp.py
          git config user.name "James3014"
          git config user.email "liligogo523@gmail.com"
          git add scripts/ops/trusted_deletion_anchor.py tests/ops/test_trusted_deletion_anchor_dependency_transition.py
          git diff --cached --check
          git commit -m "chore(trust): register PR960 Runtime pin transition"
          git push origin HEAD:codex/trusted-runtime-pin-transition-960-20260914
