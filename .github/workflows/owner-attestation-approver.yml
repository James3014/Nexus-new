name: Owner attestation approver

# Approves a pull request's exact head when an Owner-signed grant (#1750 phase 2)
# covers every change in it. The approval is pinned to head.sha; a ruleset that
# dismisses stale approvals and requires approval of the most recent push makes
# any later push need a fresh decision. Nothing from the pull request is
# executed: the gate script comes from the trusted workflow revision and the
# head is fetched only as git objects for the diff.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions: {}

concurrency:
  group: owner-attestation-approver-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  decide-and-approve:
    name: Owner attestation approver
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Decide from the trusted gate and approve the exact head
        env:
          EVENT_JSON: ${{ toJSON(github.event) }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          READ_TOKEN: ${{ github.token }}
          APPROVER_APP_ID: ${{ secrets.NEXUS_APPROVER_APP_ID }}
          APPROVER_PRIVATE_KEY: ${{ secrets.NEXUS_APPROVER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/owner-attestation-approver"
          trap 'rm -rf -- "$work"' EXIT
          mkdir -p "$work"
          workflow_path='.github/workflows/owner-attestation-approver.yml'
          test "$EVENT_NAME" = pull_request_target
          test "$WORKFLOW_REF" = "$REPOSITORY/$workflow_path@refs/heads/$DEFAULT_BRANCH"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]

          if [ -z "$APPROVER_APP_ID" ] || [ -z "$APPROVER_PRIVATE_KEY" ]; then
            echo "approver App is not configured; nothing to do"
            exit 0
          fi

          # Git objects only: trusted gate from WORKFLOW_SHA, base and head trees for the diff.
          bare="$work/repo.git"
          git init --bare -q "$bare"
          auth="$(printf '%s' "x-access-token:$READ_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="Authorization: basic $auth" \
            git -C "$bare" fetch -q --no-tags --depth=1 "https://github.com/$REPOSITORY.git" \
              "$WORKFLOW_SHA" "$BASE_SHA" "+refs/pull/$PR_NUMBER/head:refs/nexus/pr-head"
          test "$(git -C "$bare" rev-parse refs/nexus/pr-head)" = "$HEAD_SHA"
          git -C "$bare" cat-file -e "$WORKFLOW_SHA^{commit}"
          git -C "$bare" cat-file -e "$BASE_SHA^{commit}"
          git -C "$bare" cat-file -e "$HEAD_SHA^{commit}"
          git -C "$bare" cat-file blob "$WORKFLOW_SHA:scripts/ops/trusted_merge_lane_gate.py" > "$work/gate.py"

          python3 -c 'import json, os; e=json.loads(os.environ["EVENT_JSON"]); e.update(event_name=os.environ["EVENT_NAME"], workflow_sha=os.environ["WORKFLOW_SHA"]); json.dump(e, open(os.environ["RUNNER_TEMP"] + "/owner-attestation-approver/event.json", "w"))'
          python3 -I "$work/gate.py" --mode approve --event-json "$work/event.json" --repo-root "$bare" > "$work/decision.json"
          cat "$work/decision.json"
          approve="$(jq -r '.approve' "$work/decision.json")"
          decided_head="$(jq -r '.head_sha // empty' "$work/decision.json")"
          if [ "$approve" != true ] || [ "$decided_head" != "$HEAD_SHA" ]; then
            echo "no automatic approval: $(jq -r '.reason' "$work/decision.json")"
            exit 0
          fi

          # Approver App token: RS256 JWT signed with the App key, then an installation token.
          printf '%s\n' "$APPROVER_PRIVATE_KEY" > "$work/app.pem"
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"
          header="$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)"
          claims="$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' "$((now - 60))" "$((now + 540))" "$APPROVER_APP_ID" | b64url)"
          signature="$(printf '%s.%s' "$header" "$claims" | openssl dgst -sha256 -sign "$work/app.pem" -binary | b64url)"
          jwt="$header.$claims.$signature"
          rm -f -- "$work/app.pem"
          api() { curl -fsS -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          installation="$(api -H "Authorization: Bearer $jwt" "https://api.github.com/repos/$REPOSITORY/installation" | jq -r '.id')"
          [[ "$installation" =~ ^[0-9]+$ ]]
          token="$(api -X POST -H "Authorization: Bearer $jwt" \
            "https://api.github.com/app/installations/$installation/access_tokens" \
            -d "{\"repositories\":[\"${REPOSITORY#*/}\"],\"permissions\":{\"pull_requests\":\"write\"}}" | jq -r '.token')"
          test -n "$token" && test "$token" != null
          echo "::add-mask::$token"
          app_login="$(api -H "Authorization: Bearer $jwt" "https://api.github.com/app" | jq -r '.slug')[bot]"

          # Re-check the head right before approving; skip if this App already approved it.
          current_head="$(api -H "Authorization: Bearer $token" "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER" | jq -r '.head.sha')"
          test "$current_head" = "$HEAD_SHA"
          already="$(api -H "Authorization: Bearer $token" "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
            | jq --arg login "$app_login" --arg sha "$HEAD_SHA" '[.[] | select(.user.login == $login and .commit_id == $sha and .state == "APPROVED")] | length')"
          if [ "$already" != 0 ]; then
            echo "already approved at $HEAD_SHA"
            exit 0
          fi
          payload_sha="$(jq -r '.owner_attestation.payload_sha256' "$work/decision.json")"
          jq -n --arg sha "$HEAD_SHA" --arg body "Owner-signed grant covers every change at $HEAD_SHA (grant payload sha256 $payload_sha)." \
            '{commit_id: $sha, event: "APPROVE", body: $body}' > "$work/review.json"
          api -X POST -H "Authorization: Bearer $token" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER/reviews" --data @"$work/review.json" > /dev/null
          echo "approved $HEAD_SHA"
