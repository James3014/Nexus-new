name: TG8 Physical RC Controller v4r4

on:
  push:
    branches: [ops/tg8-physical-rc-a5d7]

permissions:
  contents: read
  actions: read

env:
  CANDIDATE_SHA: a5d7d032fe80838a84ed596ca36ea5bd923ae7a1
  CANDIDATE_TREE: bb8739812a5beb13e5897c40014cf69b4d49389a
  RC1_SHA: d1fbe1f1f399351b1fac2591db00a6f150179753
  RC2_SHA: 968e88f2e8df7444ee2758d25182111830cd03e8
  STABLE_SHA: 4fd27ee64a0b4ad8e3f3326fd8c32014c9a391de

jobs:
  collect:
    name: TG8 physical observation collector v4r4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ops/tg8-physical-rc-a5d7
          fetch-depth: 0
          persist-credentials: true
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12', check-latest: false}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with: {version: '0.9.2', enable-cache: false}
      - name: Strip checkout credential
        run: git config --local --unset-all 'http.https://github.com/.extraheader' || true
      - name: Collect observation-driven physical evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: bash scripts/ops/tg8_physical_v4r4_runner.sh collect
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tg8-physical-rc-v4r4-${{ env.CANDIDATE_SHA }}
          path: ${{ env.TG8_V4_ROOT }}/
          if-no-files-found: error
          retention-days: 30

  audit:
    name: TG8 fresh independent physical audit v4r4
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ops/tg8-physical-rc-a5d7
          fetch-depth: 0
          persist-credentials: true
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12', check-latest: false}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with: {version: '0.9.2', enable-cache: false}
      - name: Strip checkout credential
        run: git config --local --unset-all 'http.https://github.com/.extraheader' || true
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: tg8-physical-rc-v4r4-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/collector-v4r4
      - name: Independently rebuild wheels and rerun all physical probes
        env:
          COLLECTOR_ROOT: ${{ runner.temp }}/collector-v4r4
        run: bash scripts/ops/tg8_physical_v4r4_runner.sh audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tg8-independent-physical-audit-v4r4-${{ env.CANDIDATE_SHA }}
          path: ${{ env.TG8_V4_AUDIT_ROOT }}/
          if-no-files-found: error
          retention-days: 30
