name: Review record present

# #2290: advisory. pull_request_target and issue_comment run the default-branch
# copy of this workflow (pull_request_review is deliberately not used: that event
# runs the PR's own copy). PR code is never checked out or executed: the script
# only reads the PR, its file list, comments and reviews through the REST API and
# publishes the commit status "Review record present (advisory)" on the PR head,
# so a record posted after the last push updates the status without a new push.
# The status is the signal; this job goes red only when the PR cannot be read.
# #3084: the run first marks the status pending on the PR head the check reads,
# and marks it error if the check does not finish, so a run that times out, is
# cancelled or fails never leaves an earlier run's success in place.
# Comment runs serialize per PR through their own concurrency group (a newer
# event cancels an older run, so the last status reflects the newest state).
# Making the status required is an Owner (ruleset) decision; see the script
# docstring on why it cannot be required as-is.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
  issue_comment:
    types: [created, edited, deleted]

concurrency:
  group: review-record-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  review-record:
    name: Review record present (advisory job)
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    env:
      CONTEXT: Review record present (advisory)
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark the status pending before anything can fail
        id: pending
        timeout-minutes: 1
        run: |
          set -euo pipefail
          # The check reads the live PR head (pulls/N head.sha); mark that same head.
          head="$(gh api "repos/${REPO}/pulls/${PR}" --jq .head.sha)"
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "PR head sha unavailable" >&2; exit 1; }
          echo "head_sha=${head}" >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/${REPO}/statuses/${head}" \
            -f state=pending -f context="$CONTEXT" -f target_url="$RUN_URL" \
            -f description="evaluating the review record" > /dev/null
      - name: Checkout default branch (never PR code)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check the review record at the PR head and publish the status
        id: check
        # Below the job timeout, so a slow check fails this step and the next step still runs.
        timeout-minutes: 7
        run: |
          set -euo pipefail
          python3 -I scripts/ops/review_record_check.py --repo "$REPO" --pr "$PR" \
            --target-url "$RUN_URL" --output "$RUNNER_TEMP/review-record.json" --no-fail
      - name: Mark the status error when the check did not finish
        if: (failure() || cancelled()) && steps.check.outcome != 'success'
        timeout-minutes: 1
        env:
          HEAD_SHA: ${{ steps.pending.outputs.head_sha }}
        run: |
          set -euo pipefail
          head="$HEAD_SHA"
          if ! [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
            head="$(gh api "repos/${REPO}/pulls/${PR}" --jq .head.sha)"
          fi
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "PR head sha unavailable" >&2; exit 1; }
          gh api -X POST "repos/${REPO}/statuses/${head}" \
            -f state=error -f context="$CONTEXT" -f target_url="$RUN_URL" \
            -f description="review record check did not finish; see the run" > /dev/null
