name: Nexus Pytest CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  impact-gate:
    name: Exact-base impact gate
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Initialize evidence directory
        run: |
          mkdir -p "$RUNNER_TEMP/nexus-ci-impact"
          printf '%s\n' '{"status":"CI_BOOTSTRAP_DEFECT","reason":"impact gate did not reach classification"}' > "$RUNNER_TEMP/nexus-ci-impact/classification.json"

      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Remove checkout credentials
        run: |
          set -euo pipefail
          credential_count=0
          host_credential_count=0
          while IFS= read -r entry; do
            credential_count=$((credential_count + 1))
            key="${entry%% *}"
            credential_file="${entry#* }"
            case "$credential_file" in
              "$RUNNER_TEMP"/git-credentials-*.config)
                host_credential_count=$((host_credential_count + 1))
                rm -f -- "$credential_file"
                ;;
              /github/runner_temp/git-credentials-*.config) ;;
              *)
                echo "unexpected checkout credential path: $credential_file" >&2
                exit 1
                ;;
            esac
            git config --local --unset-all "$key"
          done < <(git config --local --get-regexp '^includeif\.gitdir:.*\.path$' || true)
          if [ "$credential_count" -eq 0 ] || [ "$host_credential_count" -eq 0 ]; then
            echo "checkout credential includeIf entries are missing" >&2
            exit 1
          fi
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          git config --local --unset-all core.sshCommand || true
          if git config --local --get-regexp '^includeif\.gitdir:.*\.path$' >/dev/null; then
            echo "checkout credentials remain configured" >&2
            exit 1
          fi
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv sync --frozen --all-groups --all-extras
        env:
          UV_SYSTEM_PYTHON: 0

      - name: Resolve exact comparison base
        id: base
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "Exact base/head SHA is empty" >&2
            exit 1
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Exact revisions must be full 40-character lowercase SHAs" >&2
            exit 1
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Run Golden Behavior gate on exact PR or main-push head
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          HEAD_SHA: ${{ steps.base.outputs.head_sha }}
          GIT_AUTHOR_NAME: Nexus CI
          GIT_AUTHOR_EMAIL: nexus-ci@example.invalid
          GIT_COMMITTER_NAME: Nexus CI
          GIT_COMMITTER_EMAIL: nexus-ci@example.invalid
        run: |
          set -euo pipefail
          .venv/bin/python scripts/ops/run_golden_behavior_eval.py \
            --json-report "$RUNNER_TEMP/nexus-ci-impact/golden-behavior.json"
          .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(os.environ["RUNNER_TEMP"], "nexus-ci-impact", "golden-behavior.json").read_text(
                  encoding="utf-8"
              )
          )
          if report.get("schema") != "nexus.golden_behavior_eval.v1":
              raise SystemExit("Golden Behavior report schema mismatch")
          if report.get("source_revision") != os.environ["HEAD_SHA"]:
              raise SystemExit("Golden Behavior report source revision mismatch")
          expected_tree = __import__("subprocess").check_output(
              ["git", "rev-parse", "HEAD^{tree}"], text=True
          ).strip()
          if report.get("source_tree") != expected_tree:
              raise SystemExit("Golden Behavior report source tree mismatch")
          if report.get("workspace_dirty") is not False:
              raise SystemExit("Golden Behavior evaluator did not observe a clean exact-head checkout")
          for field in (
              "corpus_identity",
              "evaluator_identity",
              "dependency_lock_identity",
              "python_version",
              "pytest_version",
              "case_evidence",
          ):
              if not report.get(field):
                  raise SystemExit(f"Golden Behavior report missing {field}")
          PY

      - name: Link persistent evidence directory
        run: ln -s "$RUNNER_TEMP/nexus-ci-impact" .ci-impact

      - name: Build tiered exact-base impact plan
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          .venv/bin/python scripts/ops/pr_impact_gate.py plan \
            --base-sha "$BASE_SHA" \
            --head-sha "${{ steps.base.outputs.head_sha }}" \
            --output .ci-impact/plan.json

      - name: Validate workflow syntax when required
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          plan = json.loads(Path('.ci-impact/plan.json').read_text(encoding='utf-8'))
          if plan['workflow_validation_required']:
              for path in sorted(Path('.github/workflows').glob('*.yml')):
                  yaml.safe_load(path.read_text(encoding='utf-8'))
                  print(f'YAML_OK {path}')
          PY

      - name: Materialize exact base worktree
        id: base-worktree
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          BASE_WORKTREE=$(mktemp -d "$RUNNER_TEMP/nexus-ci-base.XXXXXX")
          git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          echo "path=$BASE_WORKTREE" >> "$GITHUB_OUTPUT"

      - name: Install exact-base dependencies
        env:
          BASE_WORKTREE: ${{ steps.base-worktree.outputs.path }}
        run: |
          set -euo pipefail
          UV_PROJECT_ENVIRONMENT="$BASE_WORKTREE/.venv" uv sync \
            --directory "$BASE_WORKTREE" \
            --frozen --all-groups --all-extras

      - name: Run mapped tests on exact base source
        run: |
          set +e
          .venv/bin/python "$GITHUB_WORKSPACE/scripts/ops/pr_impact_gate.py" run \
            --plan .ci-impact/plan.json \
            --cwd "${{ steps.base-worktree.outputs.path }}" \
            --revision "${{ steps.base.outputs.sha }}" \
            --result .ci-impact/base-result.json \
            --junit "$GITHUB_WORKSPACE/.ci-impact/base-junit.xml" \
            --stdout "$GITHUB_WORKSPACE/.ci-impact/base-stdout.log"
          RUN_STATUS=$?
          if [ ! -s .ci-impact/base-result.json ]; then
            echo "base run did not emit classification evidence" >&2
            exit 2
          fi
          echo "base run evidence exit: $RUN_STATUS"
          exit 0

      - name: Run mapped tests on exact head
        run: |
          set +e
          .venv/bin/python "$GITHUB_WORKSPACE/scripts/ops/pr_impact_gate.py" run \
            --plan .ci-impact/plan.json \
            --cwd "$GITHUB_WORKSPACE" \
            --revision "${{ steps.base.outputs.head_sha }}" \
            --result .ci-impact/head-result.json \
            --junit "$GITHUB_WORKSPACE/.ci-impact/head-junit.xml" \
            --stdout "$GITHUB_WORKSPACE/.ci-impact/head-stdout.log"
          RUN_STATUS=$?
          if [ ! -s .ci-impact/head-result.json ]; then
            echo "head run did not emit classification evidence" >&2
            exit 2
          fi
          echo "head run evidence exit: $RUN_STATUS"
          exit 0

      - name: Classify exact-base regression
        run: |
          set -uo pipefail
          .venv/bin/python scripts/ops/pr_impact_gate.py classify \
            --base-result .ci-impact/base-result.json \
            --head-result .ci-impact/head-result.json \
            --output .ci-impact/classification.json
          CLASSIFIER_STATUS=$?
          {
            echo "## Exact-base impact classification"
            echo '```json'
            cat .ci-impact/classification.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$CLASSIFIER_STATUS"
        env:
          NEXUS_TEST_MODE: CI
          PYTHONPATH: .

      - name: Capture failure tails
        if: failure()
        run: |
          echo "## Exact-base pytest tails" >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 .ci-impact/base-stdout.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          tail -n 80 .ci-impact/head-stdout.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Remove exact base worktree
        if: always() && steps.base-worktree.outputs.path != ''
        run: git worktree remove --force "${{ steps.base-worktree.outputs.path }}"

      - name: Install gitlink metadata for checkout post-cleanup
        if: always()
        run: |
          set -euo pipefail
          while IFS= read -r -d '' index_entry; do
            mode="${index_entry%% *}"
            if [ "$mode" != "160000" ]; then
              continue
            fi
            gitlink_path="${index_entry#*$'\t'}"
            if ! git config --file .gitmodules --get "submodule.${gitlink_path}.path" >/dev/null 2>&1; then
              git config --file .gitmodules "submodule.${gitlink_path}.path" "$gitlink_path"
              git config --file .gitmodules "submodule.${gitlink_path}.url" .
            fi
          done < <(git ls-files --stage -z)
          git submodule foreach --recursive ':'

      - name: Archive impact evidence 📦
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-base-impact-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/nexus-ci-impact/
          if-no-files-found: error
          retention-days: 7

  full-regression:
    name: Tier 3 full regression
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Initialize full-regression evidence
        run: |
          printf '%s\n' '<testsuite name="ci-bootstrap" tests="1" failures="1"><testcase name="full-regression"><failure message="full regression did not reach execution"/></testcase></testsuite>' > "$RUNNER_TEMP/full-regression.xml"
      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: false
          ref: ${{ github.sha }}
      - name: Remove checkout credentials
        run: |
          set -euo pipefail
          credential_count=0
          host_credential_count=0
          while IFS= read -r entry; do
            credential_count=$((credential_count + 1))
            key="${entry%% *}"
            credential_file="${entry#* }"
            case "$credential_file" in
              "$RUNNER_TEMP"/git-credentials-*.config)
                host_credential_count=$((host_credential_count + 1))
                rm -f -- "$credential_file"
                ;;
              /github/runner_temp/git-credentials-*.config) ;;
              *)
                echo "unexpected checkout credential path: $credential_file" >&2
                exit 1
                ;;
            esac
            git config --local --unset-all "$key"
          done < <(git config --local --get-regexp '^includeif\.gitdir:.*\.path$' || true)
          if [ "$credential_count" -eq 0 ] || [ "$host_credential_count" -eq 0 ]; then
            echo "checkout credential includeIf entries are missing" >&2
            exit 1
          fi
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          git config --local --unset-all core.sshCommand || true
          if git config --local --get-regexp '^includeif\.gitdir:.*\.path$' >/dev/null; then
            echo "checkout credentials remain configured" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-extras
      - name: Run full repository regression
        run: uv run pytest tests/ -v --timeout=300 --junitxml="$RUNNER_TEMP/full-regression.xml"
        env:
          NEXUS_TEST_MODE: CI
          PYTHONPATH: .
      - name: Install gitlink metadata for checkout post-cleanup
        if: always()
        run: |
          set -euo pipefail
          while IFS= read -r -d '' index_entry; do
            mode="${index_entry%% *}"
            if [ "$mode" != "160000" ]; then
              continue
            fi
            gitlink_path="${index_entry#*$'\t'}"
            if ! git config --file .gitmodules --get "submodule.${gitlink_path}.path" >/dev/null 2>&1; then
              git config --file .gitmodules "submodule.${gitlink_path}.path" "$gitlink_path"
              git config --file .gitmodules "submodule.${gitlink_path}.url" .
            fi
          done < <(git ls-files --stage -z)
          git submodule foreach --recursive ':'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-regression-${{ github.sha }}
          path: ${{ runner.temp }}/full-regression.xml
          if-no-files-found: error
          retention-days: 14
