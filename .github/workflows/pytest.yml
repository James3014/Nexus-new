            --expected-head-sha "$HEAD_SHA" \
            --junit "$WITNESS_DIR/junit-sandbox-runner-rundir.xml" \
            --not-before "$(cat "$WITNESS_DIR/not-before-sandbox-runner-rundir.txt")" \
            --command "$(cat "$WITNESS_DIR/command-sandbox-runner-rundir.txt")" \
            --require-github-hosted \
            --output "$WITNESS_DIR/receipt-sandbox-runner-rundir.json"
          {
            echo "## sandbox runner run_dir Seatbelt physical witness"
            echo '```json'
            cat "$WITNESS_DIR/receipt-sandbox-runner-rundir.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$(cat "$WITNESS_DIR/pytest-exit-sandbox-runner-rundir.txt")" = 0

      - name: Run EIA closure verifier Seatbelt physical witnesses
        # Issue #2795: closure pytest verifiers run under sandbox-exec with an
