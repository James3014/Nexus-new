          echo "$pytest_status" > "$WITNESS_DIR/pytest-exit-eia-closure-verifier.txt"
          echo "pytest exit: $pytest_status"
          exit "$pytest_status"

      - name: Verify EIA closure verifier physical witness receipt
        run: |
          set -euo pipefail
          .venv/bin/python scripts/ci/verify_physical_witness_junit.py verify \
            --suite eia-closure-verifier \
            --repo-root "$GITHUB_WORKSPACE" \
            --expected-head-sha "$HEAD_SHA" \
            --junit "$WITNESS_DIR/junit-eia-closure-verifier.xml" \
            --not-before "$(cat "$WITNESS_DIR/not-before-eia-closure-verifier.txt")" \
            --command "$(cat "$WITNESS_DIR/command-eia-closure-verifier.txt")" \
            --require-github-hosted \
            --output "$WITNESS_DIR/receipt-eia-closure-verifier.json"
          {
            echo "## EIA closure verifier Seatbelt physical witness"
            echo '```json'
            cat "$WITNESS_DIR/receipt-eia-closure-verifier.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$(cat "$WITNESS_DIR/pytest-exit-eia-closure-verifier.txt")" = 0

      - name: Install gitlink metadata for checkout post-cleanup
        if: always()
        run: |
          set -euo pipefail
          while IFS= read -r -d '' index_entry; do
            mode="${index_entry%% *}"
            if [ "$mode" != "160000" ]; then
              continue
            fi
            gitlink_path="${index_entry#*$'\t'}"
            if ! git config --file .gitmodules --get "submodule.${gitlink_path}.path" >/dev/null 2>&1; then
              git config --file .gitmodules "submodule.${gitlink_path}.path" "$gitlink_path"
              git config --file .gitmodules "submodule.${gitlink_path}.url" .
            fi
          done < <(git ls-files --stage -z)
          git submodule foreach --recursive ':'

      - name: Archive physical witness evidence 📦
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsh-seatbelt-physical-witness-${{ env.HEAD_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nexus-physical-witness/
          if-no-files-found: error
          retention-days: 30
