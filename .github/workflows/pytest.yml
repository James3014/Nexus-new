name: Nexus Pytest CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  impact-run:
    name: Exact-base impact run (${{ matrix.side }})
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Base and head run on separate runners at the same time (#2220); the
    # "Exact-base impact gate" job below classifies both results.  An unmapped
    # path runs the full tests/ suite (#2092): 23-42 min per pass plus setup.
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        side: [base, head]

    steps:
      - name: Initialize evidence directory
        run: mkdir -p "$RUNNER_TEMP/nexus-ci-impact"

      - name: Checkout exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Remove checkout credentials
        run: |
          set -euo pipefail
          credential_count=0
          host_credential_count=0
          while IFS= read -r entry; do
            credential_count=$((credential_count + 1))
            key="${entry%% *}"
            credential_file="${entry#* }"
            case "$credential_file" in
              "$RUNNER_TEMP"/git-credentials-*.config)
                host_credential_count=$((host_credential_count + 1))
                rm -f -- "$credential_file"
                ;;
              /github/runner_temp/git-credentials-*.config) ;;
              *)
                echo "unexpected checkout credential path: $credential_file" >&2
                exit 1
                ;;
            esac
            git config --local --unset-all "$key"
          done < <(git config --local --get-regexp '^includeif\.gitdir:.*\.path$' || true)
          if [ "$credential_count" -eq 0 ] || [ "$host_credential_count" -eq 0 ]; then
            echo "checkout credential includeIf entries are missing" >&2
            exit 1
          fi
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          git config --local --unset-all core.sshCommand || true
          if git config --local --get-regexp '^includeif\.gitdir:.*\.path$' >/dev/null; then
            echo "checkout credentials remain configured" >&2
            exit 1
          fi
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.2"
          enable-cache: false

      - name: Install dependencies
        run: |
          uv sync --frozen --all-groups --all-extras
        env:
          UV_SYSTEM_PYTHON: 0

      - name: Install exact canonical Learning package
        run: |
          set -euo pipefail
          uv pip install --python .venv/bin/python --requirement requirements/canonical-learning.txt
      - name: Install exact canonical runtime package
        run: |
          set -euo pipefail
          uv pip install --python .venv/bin/python --requirement requirements/canonical-runtime.txt
          EXPECTED_RUNTIME_COMMIT="$(sed -n 's/.*@\([0-9a-f]\{40\}\).*/\1/p' requirements/canonical-runtime.txt)"
          test -n "$EXPECTED_RUNTIME_COMMIT"
          EXPECTED_RUNTIME_COMMIT="$EXPECTED_RUNTIME_COMMIT" .venv/bin/python - <<'PY'
          import importlib.metadata as metadata
          import json
          import os
          import sys
          from pathlib import Path

          dist = metadata.distribution("nexus-runtime")
          direct_url = json.loads((Path(dist._path) / "direct_url.json").read_text(encoding="utf-8"))
          commit = direct_url.get("vcs_info", {}).get("commit_id")
          expected = os.environ["EXPECTED_RUNTIME_COMMIT"]
          if commit != expected:
              raise SystemExit(f"nexus-runtime commit mismatch: {commit!r} != {expected!r}")
          import nexus_runtime
          print(f"Python {sys.version.split()[0]}")
          print(f"sys.executable={sys.executable}")
          print(f"nexus-runtime commit_id={commit}")
          print(f"nexus-runtime direct_url={Path(dist._path) / 'direct_url.json'}")
          print(f"nexus_runtime.__file__={nexus_runtime.__file__}")
          PY

      - name: Resolve exact comparison base
        id: base
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "Exact base/head SHA is empty" >&2
            exit 1
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Exact revisions must be full 40-character lowercase SHAs" >&2
            exit 1
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Run Golden Behavior gate on exact PR or main-push head
        if: (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && matrix.side == 'head'
        env:
          HEAD_SHA: ${{ steps.base.outputs.head_sha }}
          GIT_AUTHOR_NAME: Nexus CI
          GIT_AUTHOR_EMAIL: nexus-ci@example.invalid
          GIT_COMMITTER_NAME: Nexus CI
          GIT_COMMITTER_EMAIL: nexus-ci@example.invalid
        run: |
          set -euo pipefail
          .venv/bin/python scripts/ops/run_golden_behavior_eval.py \
            --json-report "$RUNNER_TEMP/nexus-ci-impact/golden-behavior.json"
          .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(os.environ["RUNNER_TEMP"], "nexus-ci-impact", "golden-behavior.json").read_text(
                  encoding="utf-8"
              )
          )
          if report.get("schema") != "nexus.golden_behavior_eval.v1":
              raise SystemExit("Golden Behavior report schema mismatch")
          if report.get("source_revision") != os.environ["HEAD_SHA"]:
              raise SystemExit("Golden Behavior report source revision mismatch")
          expected_tree = __import__("subprocess").check_output(
              ["git", "rev-parse", "HEAD^{tree}"], text=True
          ).strip()
          if report.get("source_tree") != expected_tree:
              raise SystemExit("Golden Behavior report source tree mismatch")
          if report.get("workspace_dirty") is not False:
              raise SystemExit("Golden Behavior evaluator did not observe a clean exact-head checkout")
          for field in (
              "corpus_identity",
              "evaluator_identity",
              "dependency_lock_identity",
              "python_version",
              "pytest_version",
              "case_evidence",
          ):
              if not report.get(field):
                  raise SystemExit(f"Golden Behavior report missing {field}")
          PY

      - name: Link persistent evidence directory
        run: ln -s "$RUNNER_TEMP/nexus-ci-impact" .ci-impact

      - name: Build tiered exact-base impact plan
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          .venv/bin/python scripts/ops/pr_impact_gate.py plan \
            --base-sha "$BASE_SHA" \
            --head-sha "${{ steps.base.outputs.head_sha }}" \
            --output .ci-impact/plan.json

      - name: Summarize unmapped-path fallback
        if: matrix.side == 'head'
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path(".ci-impact/plan.json").read_text(encoding="utf-8"))
          if plan.get("fallback") == "FULL_SUITE":
              def clean(path):
                  # Paths are PR-controlled: no CR/LF or workflow-command escapes.
                  text = "".join(ch for ch in str(path) if ch.isprintable() and ch not in "%`#[]")
                  return text[:200] + ("..." if len(text) > 200 else "")

              paths = [clean(path) for path in plan.get("unmatched_paths", [])][:50]
              lines = [
                  "## Impact gate: FULL_SUITE fallback",
                  "",
                  "These changed paths have no impact-map entry, so the whole `tests/` suite "
                  "runs on exact base and exact head (slow). The gate passes only with no new "
                  "failures and no new collection errors.",
                  "",
                  *(f"- `{path}`" for path in paths),
                  "",
                  "Hint: add a `docs/testing/test_impact_map.md` row for these paths to get a "
                  "scoped, faster selection.",
              ]
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("\n".join(lines) + "\n")
              notice = ", ".join(paths)[:1000]
              print(f"::notice title=Impact gate FULL_SUITE fallback::unmapped paths: {notice}")
          PY

      - name: Validate workflow syntax when required
        if: matrix.side == 'head'
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          plan = json.loads(Path('.ci-impact/plan.json').read_text(encoding='utf-8'))
          if plan['workflow_validation_required']:
              for path in sorted(Path('.github/workflows').glob('*.yml')):
                  yaml.safe_load(path.read_text(encoding='utf-8'))
                  print(f'YAML_OK {path}')
          PY

      - name: Materialize exact base worktree
        if: matrix.side == 'base'
        id: base-worktree
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          BASE_WORKTREE=$(mktemp -d "$RUNNER_TEMP/nexus-ci-base.XXXXXX")
          git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          echo "path=$BASE_WORKTREE" >> "$GITHUB_OUTPUT"

      - name: Install exact-base dependencies
        if: matrix.side == 'base'
        env:
          BASE_WORKTREE: ${{ steps.base-worktree.outputs.path }}
        run: |
          set -euo pipefail
          UV_PROJECT_ENVIRONMENT="$BASE_WORKTREE/.venv" uv sync \
            --directory "$BASE_WORKTREE" \
            --frozen --all-groups --all-extras
          if [ -f "$BASE_WORKTREE/requirements/canonical-learning.txt" ]; then
            uv pip install --python "$BASE_WORKTREE/.venv/bin/python" \
              --requirement "$BASE_WORKTREE/requirements/canonical-learning.txt"
          fi
          if [ -f "$BASE_WORKTREE/requirements/canonical-runtime.txt" ]; then
            test -f "$BASE_WORKTREE/requirements/canonical-learning.txt"
            uv pip install --python "$BASE_WORKTREE/.venv/bin/python" \
              --requirement "$BASE_WORKTREE/requirements/canonical-runtime.txt"
            EXPECTED_RUNTIME_COMMIT="$(sed -n 's/.*@\([0-9a-f]\{40\}\).*/\1/p' "$BASE_WORKTREE/requirements/canonical-runtime.txt")"
            test -n "$EXPECTED_RUNTIME_COMMIT"
            EXPECTED_RUNTIME_COMMIT="$EXPECTED_RUNTIME_COMMIT" "$BASE_WORKTREE/.venv/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import json
          import os
          import sys
          from pathlib import Path

          dist = metadata.distribution("nexus-runtime")
          direct_url = json.loads((Path(dist._path) / "direct_url.json").read_text(encoding="utf-8"))
          commit = direct_url.get("vcs_info", {}).get("commit_id")
          expected = os.environ["EXPECTED_RUNTIME_COMMIT"]
          if commit != expected:
              raise SystemExit(f"nexus-runtime commit mismatch: {commit!r} != {expected!r}")
          import nexus_runtime
          print(f"Python {sys.version.split()[0]}")
          print(f"sys.executable={sys.executable}")
          print(f"nexus-runtime commit_id={commit}")
          print(f"nexus-runtime direct_url={Path(dist._path) / 'direct_url.json'}")
          print(f"nexus_runtime.__file__={nexus_runtime.__file__}")
          PY
          fi

      - name: Run mapped tests on exact base source
        if: matrix.side == 'base'
        env:
          BASE_WORKTREE: ${{ steps.base-worktree.outputs.path }}
        run: |
          set +e
          "$BASE_WORKTREE/.venv/bin/python" "$GITHUB_WORKSPACE/scripts/ops/pr_impact_gate.py" run \
            --plan .ci-impact/plan.json \
            --cwd "${{ steps.base-worktree.outputs.path }}" \
            --revision "${{ steps.base.outputs.sha }}" \
            --result .ci-impact/base-result.json \
            --junit "$GITHUB_WORKSPACE/.ci-impact/base-junit.xml" \
            --stdout "$GITHUB_WORKSPACE/.ci-impact/base-stdout.log"
          RUN_STATUS=$?
          if [ ! -s .ci-impact/base-result.json ]; then
            echo "base run did not emit classification evidence" >&2
            exit 2
          fi
          echo "base run evidence exit: $RUN_STATUS"
          exit 0

      - name: Release exact-base resources before exact head
        if: always() && steps.base-worktree.outputs.path != ''
        env:
          BASE_WORKTREE: ${{ steps.base-worktree.outputs.path }}
        run: |
          set -euo pipefail
          if [ -d "$BASE_WORKTREE" ]; then
            du -sh "$BASE_WORKTREE" || true
            git worktree remove --force "$BASE_WORKTREE"
          fi
          git worktree prune
          uv cache clean
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"

      - name: Run mapped tests on exact head
        if: matrix.side == 'head'
        run: |
          set +e
          .venv/bin/python "$GITHUB_WORKSPACE/scripts/ops/pr_impact_gate.py" run \
            --plan .ci-impact/plan.json \
            --cwd "$GITHUB_WORKSPACE" \
            --revision "${{ steps.base.outputs.head_sha }}" \
            --result .ci-impact/head-result.json \
            --junit "$GITHUB_WORKSPACE/.ci-impact/head-junit.xml" \
            --stdout "$GITHUB_WORKSPACE/.ci-impact/head-stdout.log"
          RUN_STATUS=$?
          if [ ! -s .ci-impact/head-result.json ]; then
            echo "head run did not emit classification evidence" >&2
            exit 2
          fi
          echo "head run evidence exit: $RUN_STATUS"
          exit 0

      - name: Remove exact base worktree
        if: always() && steps.base-worktree.outputs.path != ''
        env:
          BASE_WORKTREE: ${{ steps.base-worktree.outputs.path }}
        run: |
          set -euo pipefail
          if [ -d "$BASE_WORKTREE" ]; then
            git worktree remove --force "$BASE_WORKTREE"
          fi
          git worktree prune

      - name: Install gitlink metadata for checkout post-cleanup
        if: always()
        run: |
          set -euo pipefail
          while IFS= read -r -d '' index_entry; do
            mode="${index_entry%% *}"
            if [ "$mode" != "160000" ]; then
              continue
            fi
            gitlink_path="${index_entry#*$'\t'}"
            if ! git config --file .gitmodules --get "submodule.${gitlink_path}.path" >/dev/null 2>&1; then
              git config --file .gitmodules "submodule.${gitlink_path}.path" "$gitlink_path"
              git config --file .gitmodules "submodule.${gitlink_path}.url" .
            fi
          done < <(git ls-files --stage -z)
          git submodule foreach --recursive ':'

      - name: Clear run side marker
        # always(): a marker pre-written by PR code must never survive a failed
        # side; only the success-only step below may (re)create it.
        if: always()
        run: rm -f "$RUNNER_TEMP/nexus-ci-impact/side-status.json"

      - name: Record run side success
        # Last step before upload: present only when every earlier step of this
        # side succeeded, so the gate can verify each side on its own (#2220).
        env:
          SIDE: ${{ matrix.side }}
          HEAD_SHA: ${{ steps.base.outputs.head_sha }}
        run: printf '{"side":"%s","head_sha":"%s","status":"success"}\n' "$SIDE" "$HEAD_SHA" > "$RUNNER_TEMP/nexus-ci-impact/side-status.json"

      - name: Upload exact-base run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # The attempt suffix keeps "Re-run failed jobs" from colliding with the
          # first attempt's artifact; the gate takes each side's newest attempt.
          name: exact-base-impact-${{ matrix.side }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/nexus-ci-impact/
          if-no-files-found: error
          retention-days: 7

  impact-gate:
    name: Exact-base impact gate
    needs: impact-run
    # always(): a failed or cancelled run side must fail this required check,
    # never leave it skipped (GitHub treats a skipped required check as passed).
    if: always() && github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Initialize evidence directory
        run: |
          mkdir -p "$RUNNER_TEMP/nexus-ci-impact"
          printf '%s\n' '{"status":"CI_BOOTSTRAP_DEFECT","reason":"impact gate did not reach classification"}' > "$RUNNER_TEMP/nexus-ci-impact/classification.json"

      - name: Checkout exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Remove checkout credentials
        run: |
          set -euo pipefail
          credential_count=0
          host_credential_count=0
          while IFS= read -r entry; do
            credential_count=$((credential_count + 1))
            key="${entry%% *}"
            credential_file="${entry#* }"
            case "$credential_file" in
              "$RUNNER_TEMP"/git-credentials-*.config)
                host_credential_count=$((host_credential_count + 1))
                rm -f -- "$credential_file"
                ;;
              /github/runner_temp/git-credentials-*.config) ;;
              *)
                echo "unexpected checkout credential path: $credential_file" >&2
                exit 1
                ;;
            esac
            git config --local --unset-all "$key"
          done < <(git config --local --get-regexp '^includeif\.gitdir:.*\.path$' || true)
          if [ "$credential_count" -eq 0 ] || [ "$host_credential_count" -eq 0 ]; then
            echo "checkout credential includeIf entries are missing" >&2
            exit 1
          fi
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          git config --local --unset-all core.sshCommand || true
          if git config --local --get-regexp '^includeif\.gitdir:.*\.path$' >/dev/null; then
            echo "checkout credentials remain configured" >&2
            exit 1
          fi
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Resolve exact comparison base
        id: base
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "Exact base/head SHA is empty" >&2
            exit 1
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Exact revisions must be full 40-character lowercase SHAs" >&2
            exit 1
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Extract exact-base impact classifier
        id: trusted-impact
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          # The regression verdict is computed by the exact-base classifier so a
          # candidate cannot rewrite the code that classifies its own run (#1754).
          trusted="$RUNNER_TEMP/trusted-impact-gate"
          mkdir -p "$trusted/scripts/ops"
          for f in scripts/__init__.py scripts/ops/__init__.py scripts/ops/pr_impact_gate.py scripts/ops/select_tests.py; do
            git show "$BASE_SHA:$f" > "$trusted/$f"
          done
          echo "gate=$trusted/scripts/ops/pr_impact_gate.py" >> "$GITHUB_OUTPUT"

      - name: Download exact-base run evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: exact-base-impact-*-${{ steps.base.outputs.head_sha }}-a*
          path: ${{ runner.temp }}/nexus-ci-impact-sides

      - name: Verify both run sides and assemble evidence
        env:
          RUN_RESULT: ${{ needs.impact-run.result }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ steps.base.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [ "$RUN_RESULT" != "success" ]; then
            echo "::error title=Exact-base impact gate::base/head run jobs ended with '$RUN_RESULT'"
            exit 1
          fi
          python3 -I - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          head_sha = os.environ["HEAD_SHA"]
          downloaded = temp / "nexus-ci-impact-sides"

          def newest_attempt(side):
              prefix = f"exact-base-impact-{side}-{head_sha}-a"
              attempts = [
                  int(path.name.removeprefix(prefix))
                  for path in downloaded.iterdir()
                  if path.name.startswith(prefix)
                  and re.fullmatch(r"[1-9][0-9]*", path.name.removeprefix(prefix))
              ]
              if not attempts:
                  raise SystemExit(f"no {side} run evidence for {head_sha}")
              return downloaded / f"{prefix}{max(attempts)}"

          sides = {side: newest_attempt(side) for side in ("base", "head")}
          for side, path in sides.items():
              status = json.loads((path / "side-status.json").read_text(encoding="utf-8"))
              if status != {"side": side, "head_sha": head_sha, "status": "success"}:
                  raise SystemExit(f"{side} run side did not record success")
          plans = {side: (path / "plan.json").read_bytes() for side, path in sides.items()}
          if hashlib.sha256(plans["base"]).digest() != hashlib.sha256(plans["head"]).digest():
              raise SystemExit("base and head run sides used different impact plans")
          plan = json.loads(plans["head"])
          if plan.get("base_sha") != os.environ["BASE_SHA"] or plan.get("head_sha") != head_sha:
              raise SystemExit("impact plan does not bind the exact base/head revisions")
          evidence = temp / "nexus-ci-impact"
          wanted = {
              "base": ("base-result.json", "base-junit.xml", "base-stdout.log"),
              "head": ("plan.json", "golden-behavior.json", "head-result.json", "head-junit.xml", "head-stdout.log"),
          }
          for side, names in wanted.items():
              for name in names:
                  source = sides[side] / name
                  if source.exists():
                      shutil.copyfile(source, evidence / name)
          for name in ("base-result.json", "head-result.json"):
              if not (evidence / name).stat().st_size:
                  raise SystemExit(f"{name} is empty")
          PY

      - name: Link persistent evidence directory
        run: ln -s "$RUNNER_TEMP/nexus-ci-impact" .ci-impact

      - name: Classify exact-base regression
        run: |
          set -uo pipefail
          # -I and no PYTHONPATH: nothing in the PR-head checkout may shadow a
          # module of the trusted exact-base classifier (#2236).
          python3 -I "${{ steps.trusted-impact.outputs.gate }}" classify \
            --base-result .ci-impact/base-result.json \
            --head-result .ci-impact/head-result.json \
            --output .ci-impact/classification.json
          CLASSIFIER_STATUS=$?
          {
            echo "## Exact-base impact classification"
            echo '```json'
            cat .ci-impact/classification.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$CLASSIFIER_STATUS"
        env:
          NEXUS_TEST_MODE: CI

      - name: Capture failure tails
        if: failure()
        run: |
          echo "## Exact-base pytest tails" >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 .ci-impact/base-stdout.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          tail -n 80 .ci-impact/head-stdout.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Install gitlink metadata for checkout post-cleanup
        if: always()
        run: |
          set -euo pipefail
          while IFS= read -r -d '' index_entry; do
            mode="${index_entry%% *}"
            if [ "$mode" != "160000" ]; then
              continue
            fi
            gitlink_path="${index_entry#*$'\t'}"
            if ! git config --file .gitmodules --get "submodule.${gitlink_path}.path" >/dev/null 2>&1; then
              git config --file .gitmodules "submodule.${gitlink_path}.path" "$gitlink_path"
              git config --file .gitmodules "submodule.${gitlink_path}.url" .
            fi
          done < <(git ls-files --stage -z)
          git submodule foreach --recursive ':'

      - name: Archive impact evidence 📦
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exact-base-impact-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/nexus-ci-impact/
          if-no-files-found: error
          retention-days: 7

  impact-map-coverage:
    name: Impact map coverage (advisory)
    # Not a required check: fails within minutes when a changed path has no
    # docs/testing/test_impact_map.md row, which would make the required gate run
    # the full suite twice (~75 min instead of a median of ~7; #2220).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check impact-map coverage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ops/pr_impact_gate.py plan \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --output "$RUNNER_TEMP/plan.json" > /dev/null
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path(os.environ["RUNNER_TEMP"], "plan.json").read_text(encoding="utf-8"))
          if plan.get("fallback") != "FULL_SUITE":
              print("impact map covers every changed path")
              raise SystemExit(0)

          def clean(path):
              # Paths are PR-controlled: no CR/LF or workflow-command escapes.
              # The runner also parses legacy ##[command] anywhere in a line.
              text = "".join(ch for ch in str(path) if ch.isprintable() and ch not in "%`:#[]")
              return text[:200]

          paths = [clean(path) for path in plan.get("unmatched_paths", [])][:20]
          for path in paths:
              print(f"::error title=Unmapped path (add a docs/testing/test_impact_map.md row)::{path}")
          raise SystemExit(
              f"{len(paths)} changed path(s) have no impact-map row; the required gate will run the full suite"
          )
          PY

  full-regression:
    name: Tier 3 full regression
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Initialize full-regression evidence
        run: |
          printf '%s\n' '<testsuite name="ci-bootstrap" tests="1" failures="1"><testcase name="full-regression"><failure message="full regression did not reach execution"/></testcase></testsuite>' > "$RUNNER_TEMP/full-regression.xml"
      - name: Checkout exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: false
          ref: ${{ github.sha }}
      - name: Remove checkout credentials
        run: |
          set -euo pipefail
          credential_count=0
          host_credential_count=0
          while IFS= read -r entry; do
            credential_count=$((credential_count + 1))
            key="${entry%% *}"
            credential_file="${entry#* }"
            case "$credential_file" in
              "$RUNNER_TEMP"/git-credentials-*.config)
                host_credential_count=$((host_credential_count + 1))
                rm -f -- "$credential_file"
                ;;
              /github/runner_temp/git-credentials-*.config) ;;
              *)
                echo "unexpected checkout credential path: $credential_file" >&2
                exit 1
                ;;
            esac
            git config --local --unset-all "$key"
          done < <(git config --local --get-regexp '^includeif\.gitdir:.*\.path$' || true)
          if [ "$credential_count" -eq 0 ] || [ "$host_credential_count" -eq 0 ]; then
            echo "checkout credential includeIf entries are missing" >&2
            exit 1
          fi
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          git config --local --unset-all core.sshCommand || true
          if git config --local --get-regexp '^includeif\.gitdir:.*\.path$' >/dev/null; then
            echo "checkout credentials remain configured" >&2
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.2"
          enable-cache: false
      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-extras
      - name: Install exact canonical Learning package
        run: |
          set -euo pipefail
          uv pip install --python .venv/bin/python --requirement requirements/canonical-learning.txt
      - name: Install exact canonical runtime package
        run: |
          set -euo pipefail
          uv pip install --python .venv/bin/python --requirement requirements/canonical-runtime.txt
          EXPECTED_RUNTIME_COMMIT="$(sed -n 's/.*@\([0-9a-f]\{40\}\).*/\1/p' requirements/canonical-runtime.txt)"
          test -n "$EXPECTED_RUNTIME_COMMIT"
          EXPECTED_RUNTIME_COMMIT="$EXPECTED_RUNTIME_COMMIT" .venv/bin/python - <<'PY'
          import importlib.metadata as metadata
          import json
          import os
          import sys
          from pathlib import Path

          dist = metadata.distribution("nexus-runtime")
          direct_url = json.loads((Path(dist._path) / "direct_url.json").read_text(encoding="utf-8"))
          commit = direct_url.get("vcs_info", {}).get("commit_id")
          expected = os.environ["EXPECTED_RUNTIME_COMMIT"]
          if commit != expected:
              raise SystemExit(f"nexus-runtime commit mismatch: {commit!r} != {expected!r}")
          import nexus_runtime
          print(f"Python {sys.version.split()[0]}")
          print(f"sys.executable={sys.executable}")
          print(f"nexus-runtime commit_id={commit}")
          print(f"nexus-runtime direct_url={Path(dist._path) / 'direct_url.json'}")
          print(f"nexus_runtime.__file__={nexus_runtime.__file__}")
          PY
      - name: Run full repository regression
        run: uv run pytest tests/ -v --timeout=300 --junitxml="$RUNNER_TEMP/full-regression.xml"
        env:
          NEXUS_TEST_MODE: CI
          # Explicit, reviewed quarantine list: tests/nightly_quarantine_items/<slug>.py, one module per entry, retire via ENTRY = None (#1897).
          NEXUS_NIGHTLY_QUARANTINE: "1"
          PYTHONPATH: .
      - name: Install gitlink metadata for checkout post-cleanup
        if: always()
        run: |
          set -euo pipefail
          while IFS= read -r -d '' index_entry; do
            mode="${index_entry%% *}"
            if [ "$mode" != "160000" ]; then
              continue
            fi
            gitlink_path="${index_entry#*$'\t'}"
            if ! git config --file .gitmodules --get "submodule.${gitlink_path}.path" >/dev/null 2>&1; then
              git config --file .gitmodules "submodule.${gitlink_path}.path" "$gitlink_path"
              git config --file .gitmodules "submodule.${gitlink_path}.url" .
            fi
          done < <(git ls-files --stage -z)
          git submodule foreach --recursive ':'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: full-regression-${{ github.sha }}
          path: ${{ runner.temp }}/full-regression.xml
          if-no-files-found: error
          retention-days: 14

  nightly-signal:
    # Makes a red scheduled full regression visible (#1897): opens or updates ONE
    # tracking Issue with a run-linked comment, deduplicated per run id. Kept as a
    # separate job so the test-running job never holds an Issue write token.
    # Never blocks PRs and adds no merge authority.
    name: Nightly regression signal
    needs: full-regression
    if: always() && github.event_name == 'schedule' && needs.full-regression.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          ref: ${{ github.sha }}
      - name: Open or update nightly regression tracking Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 scripts/ops/governance_signal_issue.py
          --repo "$GITHUB_REPOSITORY" --run-url "$RUN_URL"
          nightly --run-id "$GITHUB_RUN_ID" --sha "$GITHUB_SHA"

  dsh-seatbelt-physical-witness:
    # Required-check candidate: no `if`, path filter or continue-on-error, so it can
    # never be skipped into a green. Linux does not collect the two physical
    # Seatbelt witnesses (#1607); only this GitHub-hosted macOS job proves them.
    name: DSH Seatbelt physical witness (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Initialize witness evidence
        run: |
          WITNESS_DIR="$RUNNER_TEMP/nexus-physical-witness"
          echo "WITNESS_DIR=$WITNESS_DIR" >> "$GITHUB_ENV"
          mkdir -p "$WITNESS_DIR"
          printf '%s\n' '{"status":"CI_BOOTSTRAP_DEFECT","reason":"physical witness did not reach verification"}' > "$WITNESS_DIR/receipt.json"
          cp "$WITNESS_DIR/receipt.json" "$WITNESS_DIR/receipt-agy-dispatch.json"
          cp "$WITNESS_DIR/receipt.json" "$WITNESS_DIR/receipt-sandbox-runner-rundir.json"
          cp "$WITNESS_DIR/receipt.json" "$WITNESS_DIR/receipt-eia-closure-verifier.json"
          cp "$WITNESS_DIR/receipt.json" "$WITNESS_DIR/receipt-claude-measurement.json"

      - name: Checkout exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: true
          submodules: false
          ref: ${{ env.HEAD_SHA }}

      - name: Remove checkout credentials
        run: |
          set -euo pipefail
          credential_count=0
          host_credential_count=0
          while IFS= read -r entry; do
            credential_count=$((credential_count + 1))
            key="${entry%% *}"
            credential_file="${entry#* }"
            case "$credential_file" in
              "$RUNNER_TEMP"/git-credentials-*.config)
                host_credential_count=$((host_credential_count + 1))
                rm -f -- "$credential_file"
                ;;
              /github/runner_temp/git-credentials-*.config) ;;
              *)
                echo "unexpected checkout credential path: $credential_file" >&2
                exit 1
                ;;
            esac
            git config --local --unset-all "$key"
          done < <(git config --local --get-regexp '^includeif\.gitdir:.*\.path$' || true)
          if [ "$credential_count" -eq 0 ] || [ "$host_credential_count" -eq 0 ]; then
            echo "checkout credential includeIf entries are missing" >&2
            exit 1
          fi
          git config --local --unset-all 'http.https://github.com/.extraheader' || true
          git config --local --unset-all core.sshCommand || true
          if git config --local --get-regexp '^includeif\.gitdir:.*\.path$' >/dev/null; then
            echo "checkout credentials remain configured" >&2
            exit 1
          fi

      - name: Verify exact head checkout
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Exact head must be a full 40-character lowercase SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.2"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --frozen --all-groups --all-extras

      - name: Fail closed without physical Seatbelt
        run: .venv/bin/python scripts/ci/verify_physical_witness_junit.py preflight

      - name: Run DSH Seatbelt physical witnesses
        env:
          NEXUS_TEST_MODE: CI
          PYTHONPATH: .
        run: |
          set -euo pipefail
          witness_cmd=(
            .venv/bin/python -m pytest tests/ops/test_nexus_dsh_linked_worktree.py
            -v -rA --timeout=300 -p no:cacheprovider "--junitxml=$WITNESS_DIR/junit.xml"
          )
          printf '%q ' "${witness_cmd[@]}" > "$WITNESS_DIR/command.txt"
          date -u +%Y-%m-%dT%H:%M:%S+00:00 > "$WITNESS_DIR/not-before.txt"
          set +e
          "${witness_cmd[@]}" 2>&1 | tee "$WITNESS_DIR/pytest.log"
          pytest_status="${PIPESTATUS[0]}"
          set -e
          echo "$pytest_status" > "$WITNESS_DIR/pytest-exit.txt"
          echo "pytest exit: $pytest_status"
          exit "$pytest_status"

      - name: Verify physical witness receipt
        run: |
          set -euo pipefail
          .venv/bin/python scripts/ci/verify_physical_witness_junit.py verify \
            --repo-root "$GITHUB_WORKSPACE" \
            --expected-head-sha "$HEAD_SHA" \
            --junit "$WITNESS_DIR/junit.xml" \
            --not-before "$(cat "$WITNESS_DIR/not-before.txt")" \
            --command "$(cat "$WITNESS_DIR/command.txt")" \
            --require-github-hosted \
            --output "$WITNESS_DIR/receipt.json"
          {
            echo "## DSH Seatbelt physical witness"
            echo '```json'
            cat "$WITNESS_DIR/receipt.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$(cat "$WITNESS_DIR/pytest-exit.txt")" = 0

      - name: Run agy dispatch Seatbelt physical witnesses
        env:
          NEXUS_TEST_MODE: CI
          PYTHONPATH: .
        run: |
          set -euo pipefail
          agy_cmd=(
            .venv/bin/python -m pytest tests/nexus/executors/test_agy_dispatch_seatbelt_physical_witness.py
            -v -rA --timeout=300 -p no:cacheprovider "--junitxml=$WITNESS_DIR/junit-agy-dispatch.xml"
          )
          printf '%q ' "${agy_cmd[@]}" > "$WITNESS_DIR/command-agy-dispatch.txt"
          date -u +%Y-%m-%dT%H:%M:%S+00:00 > "$WITNESS_DIR/not-before-agy-dispatch.txt"
          set +e
          "${agy_cmd[@]}" 2>&1 | tee "$WITNESS_DIR/pytest-agy-dispatch.log"
          pytest_status="${PIPESTATUS[0]}"
          set -e
          echo "$pytest_status" > "$WITNESS_DIR/pytest-exit-agy-dispatch.txt"
          echo "pytest exit: $pytest_status"
          exit "$pytest_status"

      - name: Verify agy dispatch physical witness receipt
        run: |
          set -euo pipefail
          .venv/bin/python scripts/ci/verify_physical_witness_junit.py verify \
            --suite agy-dispatch \
            --repo-root "$GITHUB_WORKSPACE" \
            --expected-head-sha "$HEAD_SHA" \
            --junit "$WITNESS_DIR/junit-agy-dispatch.xml" \
            --not-before "$(cat "$WITNESS_DIR/not-before-agy-dispatch.txt")" \
            --command "$(cat "$WITNESS_DIR/command-agy-dispatch.txt")" \
            --require-github-hosted \
            --output "$WITNESS_DIR/receipt-agy-dispatch.json"
          {
            echo "## agy dispatch Seatbelt physical witness"
            echo '```json'
            cat "$WITNESS_DIR/receipt-agy-dispatch.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$(cat "$WITNESS_DIR/pytest-exit-agy-dispatch.txt")" = 0

      - name: Run Claude measurement Seatbelt physical witnesses
        env:
          NEXUS_TEST_MODE: CI
          PYTHONPATH: .
        run: |
          set -euo pipefail
          claude_cmd=(
            .venv/bin/python -m pytest tests/nexus/executors/test_claude_measurement_worker.py
            -v -rA --timeout=300 -p no:cacheprovider "--junitxml=$WITNESS_DIR/junit-claude-measurement.xml"
          )
          printf '%q ' "${claude_cmd[@]}" > "$WITNESS_DIR/command-claude-measurement.txt"
          date -u +%Y-%m-%dT%H:%M:%S+00:00 > "$WITNESS_DIR/not-before-claude-measurement.txt"
          set +e
          "${claude_cmd[@]}" 2>&1 | tee "$WITNESS_DIR/pytest-claude-measurement.log"
          pytest_status="${PIPESTATUS[0]}"
          set -e
          echo "$pytest_status" > "$WITNESS_DIR/pytest-exit-claude-measurement.txt"
          echo "pytest exit: $pytest_status"
          exit "$pytest_status"

      - name: Verify Claude measurement physical witness receipt
        run: |
          set -euo pipefail
          .venv/bin/python scripts/ci/verify_physical_witness_junit.py verify \
            --suite claude-measurement \
            --repo-root "$GITHUB_WORKSPACE" \
            --expected-head-sha "$HEAD_SHA" \
            --junit "$WITNESS_DIR/junit-claude-measurement.xml" \
            --not-before "$(cat "$WITNESS_DIR/not-before-claude-measurement.txt")" \
            --command "$(cat "$WITNESS_DIR/command-claude-measurement.txt")" \
            --require-github-hosted \
            --output "$WITNESS_DIR/receipt-claude-measurement.json"
          {
            echo "## Claude measurement Seatbelt physical witness"
            echo '```json'
            cat "$WITNESS_DIR/receipt-claude-measurement.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$(cat "$WITNESS_DIR/pytest-exit-claude-measurement.txt")" = 0

      - name: Run sandbox runner run_dir Seatbelt physical witnesses
        # Issue #2785: the sandboxed child cannot rename or replace run_dir.
        env:
          NEXUS_TEST_MODE: CI
          PYTHONPATH: .
        run: |
          set -euo pipefail
          rundir_cmd=(
            .venv/bin/python -m pytest tests/engine/test_sandbox_runner_rundir_seatbelt_witness_2785.py
            -v -rA --timeout=300 -p no:cacheprovider "--junitxml=$WITNESS_DIR/junit-sandbox-runner-rundir.xml"
          )
          printf '%q ' "${rundir_cmd[@]}" > "$WITNESS_DIR/command-sandbox-runner-rundir.txt"
          date -u +%Y-%m-%dT%H:%M:%S+00:00 > "$WITNESS_DIR/not-before-sandbox-runner-rundir.txt"
          set +e
          "${rundir_cmd[@]}" 2>&1 | tee "$WITNESS_DIR/pytest-sandbox-runner-rundir.log"
          pytest_status="${PIPESTATUS[0]}"
          set -e
          echo "$pytest_status" > "$WITNESS_DIR/pytest-exit-sandbox-runner-rundir.txt"
          echo "pytest exit: $pytest_status"
          exit "$pytest_status"

      - name: Verify sandbox runner run_dir physical witness receipt
