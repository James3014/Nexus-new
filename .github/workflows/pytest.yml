        run: |
          set -euo pipefail
          eia_cmd=(
            .venv/bin/python -m pytest tests/services/test_eia_closure_verifier_seatbelt_witness_2795.py
            -v -rA --timeout=600 -p no:cacheprovider "--junitxml=$WITNESS_DIR/junit-eia-closure-verifier.xml"
          )
          printf '%q ' "${eia_cmd[@]}" > "$WITNESS_DIR/command-eia-closure-verifier.txt"
          date -u +%Y-%m-%dT%H:%M:%S+00:00 > "$WITNESS_DIR/not-before-eia-closure-verifier.txt"
          set +e
