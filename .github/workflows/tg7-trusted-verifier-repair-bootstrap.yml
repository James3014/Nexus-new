name: TG7 trusted verifier repair bootstrap

on:
  push:
    branches:
      - infra/tg7-trusted-verifier-conftest

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: infra/tg7-trusted-verifier-conftest
          fetch-depth: 0
      - name: Apply bounded lazy-import repair
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d3b3652e7c7391aa075fc7d6fd4c5e0f076d886a HEAD
          test "$(git rev-parse d3b3652e7c7391aa075fc7d6fd4c5e0f076d886a^{commit})" = "d3b3652e7c7391aa075fc7d6fd4c5e0f076d886a"
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/conftest.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '    import numpy as _np\n\n    mod = types.ModuleType("sentence_transformers")',
                  '    mod = types.ModuleType("sentence_transformers")',
              ),
              (
                  '        def encode(self, texts):\n            if isinstance(texts, str):',
                  '        def encode(self, texts):\n            import numpy as _np\n\n            if isinstance(texts, str):',
              ),
              (
                  '    import pandas as _pd\n\n    lancedb_mod = types.ModuleType("lancedb")',
                  '    lancedb_mod = types.ModuleType("lancedb")',
              ),
              (
                  '        def to_pandas(self):\n            return _pd.DataFrame([])',
                  '        def to_pandas(self):\n            import pandas as _pd\n\n            return _pd.DataFrame([])',
              ),
              (
                  '    import numpy as _np\n\n    scipy_mod = types.ModuleType("scipy")',
                  '    scipy_mod = types.ModuleType("scipy")',
              ),
              (
                  '        def cdf(x):\n            x = _np.asarray(x, dtype=float)',
                  '        def cdf(x):\n            import numpy as _np\n\n            x = _np.asarray(x, dtype=float)',
              ),
              (
                  '        def pdf(x):\n            x = _np.asarray(x, dtype=float)',
                  '        def pdf(x):\n            import numpy as _np\n\n            x = _np.asarray(x, dtype=float)',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"patch target count mismatch: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git diff -- tests/conftest.py
          git rm .github/workflows/tg7-trusted-verifier-repair-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/conftest.py
          git commit -m "fix(ci): make optional test stubs collection-safe"
          git push origin HEAD:infra/tg7-trusted-verifier-conftest
