name: TG8 TG7 Material Binding Repair

on:
  push:
    branches:
      - ops/tg8-mechanical-repair-20260905

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact TG8 PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/issue-772-tg8-protocol-maturity
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded TG7 external-material binding repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('product/protocol/compatibility_gate.py')
          text = source.read_text(encoding='utf-8')
          old = '''    if c.get("repository") != repo or sh.get("repository") != repo:\n        e.append("TG7:REPOSITORY")\n'''
          new = '''    shadow_repo = sh.get("repository")\n    if c.get("repository") != repo:\n        e.append("TG7:REPOSITORY")\n    elif not isinstance(shadow_repo, Mapping):\n        e.append("TG7:REPOSITORY")\n    else:\n        shadow_identity = {key: shadow_repo.get(key) for key in ("owner", "name", "commit", "tree")}\n        expected_shadow_keys = {"owner", "name", "commit", "tree", "bottle_py_hash"}\n        if (\n            shadow_identity != repo\n            or set(shadow_repo) != expected_shadow_keys\n            or not _sha(shadow_repo.get("bottle_py_hash"))\n        ):\n            e.append("TG7:REPOSITORY")\n'''
          if text.count(old) != 1:
              raise SystemExit('expected one TG7 repository equality seam')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/benchmark/test_core_v1_tg8_protocol_gate.py')
          text = test.read_text(encoding='utf-8')
          old = '''            "repository": corpus["repository"],\n'''
          new = '''            "repository": {\n                **corpus["repository"],\n                "bottle_py_hash": "sha256:" + "e" * 64,\n            },\n'''
          if text.count(old) != 1:
              raise SystemExit('expected one TG7 shadow repository fixture seam')
          text = text.replace(old, new, 1)
          anchor = '''def test_tg7_tamper_blocks'''
          if anchor not in text:
              raise SystemExit('expected TG7 tamper test anchor')
          insert = '''def test_tg7_shadow_repository_requires_external_material_hash(tmp_path: Path) -> None:\n    paths = _packet(tmp_path)\n    shadow = json.loads(paths["tg7_shadow"].read_text(encoding="utf-8"))\n    shadow["repository"].pop("bottle_py_hash")\n    shadow["receipt_hash"] = _digest({k: v for k, v in shadow.items() if k != "receipt_hash"})\n    _write(paths["tg7_shadow"], shadow)\n    report = gate.adjudicate(**paths)\n    assert report["classification"] == gate.UNVERIFIABLE\n    assert "TG7:REPOSITORY" in report["reasons"]\n\n\ndef test_tg7_shadow_repository_rejects_invalid_external_material_hash(tmp_path: Path) -> None:\n    paths = _packet(tmp_path)\n    shadow = json.loads(paths["tg7_shadow"].read_text(encoding="utf-8"))\n    shadow["repository"]["bottle_py_hash"] = "not-a-sha256"\n    shadow["receipt_hash"] = _digest({k: v for k, v in shadow.items() if k != "receipt_hash"})\n    _write(paths["tg7_shadow"], shadow)\n    report = gate.adjudicate(**paths)\n    assert report["classification"] == gate.UNVERIFIABLE\n    assert "TG7:REPOSITORY" in report["reasons"]\n\n\n'''
          text = text.replace(anchor, insert + anchor, 1)
          test.write_text(text, encoding='utf-8')
          PY

      - name: Install exact repository formatter
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.9.2"
          enable-cache: false
      - name: Sync frozen toolchain
        shell: bash
        run: uv sync --frozen --all-groups --all-extras
      - name: Format and statically verify only authorized files
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/ruff format --preview product/protocol/compatibility_gate.py tests/benchmark/test_core_v1_tg8_protocol_gate.py
          .venv/bin/ruff format --check --preview product/protocol/compatibility_gate.py tests/benchmark/test_core_v1_tg8_protocol_gate.py
          python3 -m py_compile product/protocol/compatibility_gate.py tests/benchmark/test_core_v1_tg8_protocol_gate.py
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' product/protocol/compatibility_gate.py tests/benchmark/test_core_v1_tg8_protocol_gate.py | sort)"
          test "$changed" = "$expected"

      - name: Publish repaired Candidate to isolated output ref
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nexus TG8 Material Binding Repair'
          git config user.email 'nexus-tg8-repair@example.invalid'
          git add product/protocol/compatibility_gate.py tests/benchmark/test_core_v1_tg8_protocol_gate.py
          git commit -m 'fix(core-v1): bind TG8 to TG7 external material hash (#772)'
          git push --force origin HEAD:refs/heads/ops/tg8-mechanical-repaired-output
