name: Night Shift AutoResearch 🌙

on:
  schedule:
    - cron: '0 2 * * *'  # 每晚 2AM 執行
  workflow_dispatch:      # 支援手動觸發

jobs:
  autoresearch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies 🛠️
        run: |
          pip install uv
          uv pip install --system -e .
          echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      - name: Execute Swarm AutoResearch 🐝
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python scripts/nightshift.py --tasks "cors,hydration,redis" --max_rounds 20 --swarm --workers 4
        env:
          MUSE_RUN_CODEX_LOOP: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive Evolutions 📦
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightshift-evolution-${{ github.sha }}
          path: |
            tracelog.jsonl
            evolve_trace.log
            *.patch
          retention-days: 14
