name: Night Shift AutoResearch 🌙

on:
  schedule:
    - cron: '0 2 * * *'  # 每晚 2AM 執行
  workflow_dispatch:      # 支援手動觸發

jobs:
  autoresearch:
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies 🛠️
        run: |
          pip install uv
          uv pip install --system -e .
          echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      - name: Execute Swarm AutoResearch 🐝
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python scripts/nightshift.py --tasks "cors,hydration,redis" --max_rounds 20 --swarm --workers 4
        env:
          MUSE_RUN_CODEX_LOOP: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Evolutions 🚀
        run: |
          git config --global user.name "Nexus-AutoResearch[bot]"
          git config --global user.email "nexus-bot@muse-core.ai"
          git add .
          git commit -m "🌙 Night Shift Evolution: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin main
