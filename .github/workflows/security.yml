name: Nexus Scoped Security Scan (nexus/core blocking)

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  bandit:
    name: Bandit Scan (nexus/core blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv sync --frozen --all-groups --all-extras
        env:
          UV_SYSTEM_PYTHON: 0

      - name: Run Bandit (nexus/core only, medium+ severity, medium+ confidence)
        id: bandit
        run: |
          uv run bandit -r nexus/core -ll -ii; echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Report Result
        if: always()
        run: |
          echo "## Bandit Scan (nexus/core blocking)" >> $GITHUB_STEP_SUMMARY
          echo "Exit code: ${{ steps.bandit.outputs.exit_code }}" >> $GITHUB_STEP_SUMMARY
          echo "This scan blocks CI if medium+ findings are detected in nexus/core." >> $GITHUB_STEP_SUMMARY
