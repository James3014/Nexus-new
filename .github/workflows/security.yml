name: Nexus Exact-Base Bandit CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  bandit:
    name: Exact-base Bandit regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Initialize evidence
        run: |
          mkdir -p .ci-bandit
          printf '%s\n' '{"classification":"CI_BOOTSTRAP_DEFECT","blocking":true,"reason":"Bandit gate did not reach classification"}' > .ci-bandit/classification.json
      - name: Checkout exact public revisions without credentials
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [[ ! "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ || ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "Invalid pull request ref metadata" >&2
              exit 1
            fi
            git fetch --no-tags origin \
              "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
              "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
          else
            git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          fi
          git checkout --detach "$HEAD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen --all-groups --all-extras
      - name: Resolve exact revisions and worktree
        id: revisions
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Exact revisions must be full 40-character lowercase SHAs" >&2
            exit 1
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          BASE_WORKTREE=$(mktemp -d /tmp/nexus-bandit-base.XXXXXX)
          git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- pyproject.toml .bandit bandit.yaml; then
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" -- 'nexus/core/*.py' 'nexus/core/**/*.py' > .ci-bandit/changed.nul
          else
            { git ls-tree -r -z --name-only "$BASE_SHA" -- nexus/core; git ls-tree -r -z --name-only "$HEAD_SHA" -- nexus/core; } \
              | .venv/bin/python -c 'import sys; data=sys.stdin.buffer.read().split(b"\0"); paths=sorted({p for p in data if p.endswith(b".py")}); sys.stdout.buffer.write(b"\0".join(paths) + (b"\0" if paths else b""))' \
              > .ci-bandit/changed.nul
          fi
          echo "base_worktree=$BASE_WORKTREE" >> "$GITHUB_OUTPUT"
      - name: Run Bandit on exact base and head
        id: bandit
        env:
          BASE_WORKTREE: ${{ steps.revisions.outputs.base_worktree }}
        run: |
          set -euo pipefail
          mapfile -d '' CHANGED < .ci-bandit/changed.nul || true
          run_bandit() {
            local root="$1" output="$2" prefix="$3"
            local files=()
            for path in "${CHANGED[@]}"; do
              if [ -f "$root/$path" ]; then files+=("$path"); fi
            done
            if [ "${#files[@]}" -eq 0 ]; then
              printf '{"results":[]}\n' > "$output"
              echo "${prefix}_exit=0" >> "$GITHUB_OUTPUT"
              return
            fi
            set +e
            (cd "$root" && "$GITHUB_WORKSPACE/.venv/bin/bandit" -f json -ll -ii "${files[@]}") > "$output"
            local status=$?
            set -e
            echo "${prefix}_exit=$status" >> "$GITHUB_OUTPUT"
          }
          run_bandit "$BASE_WORKTREE" .ci-bandit/base.json base
          run_bandit "$GITHUB_WORKSPACE" .ci-bandit/head.json head
      - name: Classify Bandit regression
        run: |
          set +e
          .venv/bin/python scripts/ops/exact_base_tool_gate.py \
            --tool bandit \
            --base .ci-bandit/base.json \
            --head .ci-bandit/head.json \
            --base-root "${{ steps.revisions.outputs.base_worktree }}" \
            --head-root "$GITHUB_WORKSPACE" \
            --base-exit-code "${{ steps.bandit.outputs.base_exit }}" \
            --head-exit-code "${{ steps.bandit.outputs.head_exit }}" \
            --output .ci-bandit/classification.json
          STATUS=$?
          echo '## Exact-base Bandit classification' >> "$GITHUB_STEP_SUMMARY"
          cat .ci-bandit/classification.json >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"
      - name: Remove exact base worktree
        if: always() && steps.revisions.outputs.base_worktree != ''
        run: git worktree remove --force "${{ steps.revisions.outputs.base_worktree }}"
      - name: Upload Bandit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-base-bandit-${{ github.sha }}
          path: .ci-bandit/
          retention-days: 14
