name: TG9 Candidate Mechanical Format

on:
  push:
    branches: [ops/tg9-format-20260905]

permissions:
  contents: write

env:
  TARGET_BRANCH: codex/issue-773-core-v1-tg9
  EXPECTED_HEAD: 1639c65492dbdac0fc7cb830f75217f8bc0b0d1d

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.9.2'
          enable-cache: false
      - name: CAS bind target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Format authorized TG9 files only
        run: |
          set -euo pipefail
          uv sync --frozen --group dev
          uv run ruff format --preview product/benchmark/tg9_value.py tests/benchmark/test_core_v1_tg9_value_manifest.py
          uv run ruff check product/benchmark/tg9_value.py tests/benchmark/test_core_v1_tg9_value_manifest.py
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed.txt
          printf '%s\n' product/benchmark/tg9_value.py tests/benchmark/test_core_v1_tg9_value_manifest.py | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Commit mechanical formatting
        run: |
          set -euo pipefail
          git config user.name 'Nexus TG9 Controller'
          git config user.email 'noreply@users.noreply.github.com'
          git add product/benchmark/tg9_value.py tests/benchmark/test_core_v1_tg9_value_manifest.py
          git commit -m 'style(core-v1): format TG9 value verifier (#773)'
          git push origin HEAD:"$TARGET_BRANCH"
