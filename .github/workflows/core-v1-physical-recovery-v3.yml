name: Core V1 TG5 TG6 Physical Recovery V3

on:
  push:
    branches:
      - controller/core-v1-physical-recovery-20260905

permissions:
  contents: read
  pull-requests: read

jobs:
  physical-recovery-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      TG5_SHA: 10b4cf7cd0b9b9624795ac5001671190c750326b
      TG6_SHA: 6a713fd7defb6e9ad30e7897490578635317319e
      TG5_MERGE_SHA: 4bf99aac7673603400e6a69436aaf23f4d7b3f88
      TG7_MERGE_SHA: ddfdfc6d3277f134130fef992e0b4deb3d86efe1
      MAIN_FENCE_SHA: f5fa2d69c22c51f20ec5090293fc36d5d4ae813c
      EXPECTED_PREDECESSOR_SHA256: 162c2e79b9df15255be59f42968dab4ef9374fc470cc17be19caa8d2c3b153d7
      EXPECTED_TG5_RECEIPT_HASH: sha256:c326b16757b6f38fe1cbfe64687fb2559132549a1d48ceb934ce16f6bda0288f
      EVIDENCE_DIR: /tmp/core-v1-physical-recovery-v3
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Materialize repository without checkout action
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* "$GITHUB_WORKSPACE"/..?* 2>/dev/null || true
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin https://github.com/James3014/Nexus-new.git
          git -c protocol.version=2 fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/controller/core-v1-physical-recovery-20260905:refs/remotes/origin/controller/core-v1-physical-recovery-20260905 \
            +refs/heads/codex/issue-770-core-v1-tg6:refs/remotes/origin/codex/issue-770-core-v1-tg6 \
            +refs/heads/codex/issue-771-tg7-postmerge-repair:refs/remotes/origin/codex/issue-771-tg7-postmerge-repair
          git checkout --detach refs/remotes/origin/controller/core-v1-physical-recovery-20260905
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$TG5_SHA^{commit}"
          git cat-file -e "$TG6_SHA^{commit}"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.9.2'
          enable-cache: false

      - name: Run hosted TG5/TG6 physical recovery
        id: recovery
        shell: bash
        run: |
          set +e
          bash scripts/ops/core_v1_tg5_tg6_physical_recovery_hosted.sh 2>&1 | tee /tmp/core-v1-physical-recovery-v3-run.log
          rc=${PIPESTATUS[0]}
          mkdir -p "$EVIDENCE_DIR"
          cp /tmp/core-v1-physical-recovery-v3-run.log "$EVIDENCE_DIR/recovery-run.log"
          printf '%s\n' "$rc" > "$EVIDENCE_DIR/recovery-exit-code.txt"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write harness identity
        if: always()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          printf 'workflow_commit=%s\nworkflow_run_id=%s\nworkflow_run_attempt=%s\nrunner=%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_NAME" > "$EVIDENCE_DIR/harness-identity.txt"

      - name: Upload retained physical evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-v1-tg5-tg6-physical-v3-${{ env.TG6_SHA }}
          path: /tmp/core-v1-physical-recovery-v3/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

      - name: Enforce recovery result
        if: always()
        shell: bash
        run: |
          test -f "$EVIDENCE_DIR/recovery-exit-code.txt"
          test "$(cat "$EVIDENCE_DIR/recovery-exit-code.txt")" = "0"
          test -f "$EVIDENCE_DIR/bundle-summary.json"
          test -f "$EVIDENCE_DIR/tg5-receipt.json"
          test -f "$EVIDENCE_DIR/tg6-10-migration.log"
          test -f "$EVIDENCE_DIR/tg6-11-live-client.log"
