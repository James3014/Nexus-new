name: Core TG8 Corrupt Wheel Falsification

on:
  pull_request:

permissions:
  contents: read

jobs:
  corrupt-wheel-falsifier:
    runs-on: ubuntu-latest
    env:
      STABLE_SHA: ca003f4aa20490b3200b433970d7ccc65425aae4
      SOURCE_DATE_EPOCH: "1700000000"
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Acquire exact Stable source and build wheel
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/James3014/nexus-core.git core
          git -C core checkout --quiet --detach "${STABLE_SHA}"
          test "$(git -C core rev-parse HEAD)" = "${STABLE_SHA}"
          test -z "$(git -C core status --porcelain)"
          mkdir -p /tmp/stable-wheel evidence
          (cd core && SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}" uv build --wheel --out-dir /tmp/stable-wheel)
          STABLE_WHEEL=$(find /tmp/stable-wheel -maxdepth 1 -name 'nexus_core-*.whl' -print -quit)
          test -n "$STABLE_WHEEL"
          sha256sum "$STABLE_WHEEL" > evidence/stable-wheel.sha256

      - name: Install exact Stable and bind installed bytes
        run: |
          set -euo pipefail
          python -m venv /tmp/tg8-corrupt-venv
          PIP=/tmp/tg8-corrupt-venv/bin/pip
          PY=/tmp/tg8-corrupt-venv/bin/python
          STABLE_WHEEL=$(find /tmp/stable-wheel -maxdepth 1 -name 'nexus_core-*.whl' -print -quit)
          "$PIP" install --quiet "$STABLE_WHEEL"
          /tmp/tg8-corrupt-venv/bin/nexus-certify --help >/dev/null
          "$PY" - <<'PY' > evidence/installed-before.json
          import hashlib, json
          import product.protocol as protocol
          from pathlib import Path
          path = Path(protocol.__file__)
          assert protocol.PUBLIC_PROTOCOL_VERSION == "1.0.0"
          print(json.dumps({
              "protocol_version": protocol.PUBLIC_PROTOCOL_VERSION,
              "protocol_file": str(path),
              "protocol_file_sha256": "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest(),
          }, sort_keys=True))
          PY

      - name: Create byte-corrupt wheel with valid wheel filename
        run: |
          set -euo pipefail
          mkdir -p /tmp/corrupt-wheel
          STABLE_WHEEL=$(find /tmp/stable-wheel -maxdepth 1 -name 'nexus_core-*.whl' -print -quit)
          TARGET="/tmp/corrupt-wheel/$(basename "$STABLE_WHEEL")"
          python - "$STABLE_WHEEL" "$TARGET" <<'PY'
          from pathlib import Path
          import sys
          source = Path(sys.argv[1]).read_bytes()
          assert len(source) > 1000
          Path(sys.argv[2]).write_bytes(source[: len(source) // 2])
          PY
          test "$(basename "$TARGET")" = "$(basename "$STABLE_WHEEL")"
          test "$(sha256sum "$TARGET" | awk '{print $1}')" != "$(sha256sum "$STABLE_WHEEL" | awk '{print $1}')"
          sha256sum "$TARGET" > evidence/corrupt-wheel.sha256

      - name: Require corrupt valid-name upgrade to fail without partial uninstall
        run: |
          set -euo pipefail
          PIP=/tmp/tg8-corrupt-venv/bin/pip
          PY=/tmp/tg8-corrupt-venv/bin/python
          CORRUPT_WHEEL=$(find /tmp/corrupt-wheel -maxdepth 1 -name 'nexus_core-*.whl' -print -quit)
          set +e
          "$PIP" install --force-reinstall --no-deps "$CORRUPT_WHEEL" > evidence/corrupt-upgrade.log 2>&1
          code=$?
          set -e
          cat evidence/corrupt-upgrade.log
          test "$code" -ne 0
          printf '%s\n' "$code" > evidence/corrupt-upgrade.exit-code
          /tmp/tg8-corrupt-venv/bin/nexus-certify --help >/dev/null
          "$PY" - <<'PY' > evidence/installed-after.json
          import hashlib, json
          import product.protocol as protocol
          from pathlib import Path
          path = Path(protocol.__file__)
          assert protocol.PUBLIC_PROTOCOL_VERSION == "1.0.0"
          print(json.dumps({
              "protocol_version": protocol.PUBLIC_PROTOCOL_VERSION,
              "protocol_file": str(path),
              "protocol_file_sha256": "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest(),
          }, sort_keys=True))
          PY
          python - <<'PY'
          import json
          before = json.load(open('evidence/installed-before.json'))
          after = json.load(open('evidence/installed-after.json'))
          assert before == after
          PY

      - name: Emit falsification summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          stable = next(Path('/tmp/stable-wheel').glob('nexus_core-*.whl'))
          corrupt = next(Path('/tmp/corrupt-wheel').glob('nexus_core-*.whl'))
          before = json.loads(Path('evidence/installed-before.json').read_text())
          after = json.loads(Path('evidence/installed-after.json').read_text())
          payload = {
              'schema': 'nexus.core.tg8-corrupt-wheel-falsification.v1',
              'stable_commit': os.environ['STABLE_SHA'],
              'stable_wheel': stable.name,
              'stable_wheel_sha256': 'sha256:' + hashlib.sha256(stable.read_bytes()).hexdigest(),
              'corrupt_wheel': corrupt.name,
              'corrupt_wheel_sha256': 'sha256:' + hashlib.sha256(corrupt.read_bytes()).hexdigest(),
              'corrupt_upgrade_exit_code': int(Path('evidence/corrupt-upgrade.exit-code').read_text().strip()),
              'installed_before': before,
              'installed_after': after,
              'result': 'FAIL_CLOSED_WITH_STABLE_INSTALLATION_PRESERVED',
              'claim_ceiling': 'TG8_FAILED_UPGRADE_FALSIFICATION_ONLY',
          }
          assert payload['corrupt_upgrade_exit_code'] != 0
          assert before == after
          Path('evidence/tg8-corrupt-wheel-summary.json').write_text(json.dumps(payload, sort_keys=True, indent=2) + '\n')
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Upload corrupt-wheel evidence
        uses: actions/upload-artifact@v4
        with:
          name: core-tg8-corrupt-wheel-${{ env.STABLE_SHA }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
