name: "📊 Nexus Benchmark CI"

on:
  schedule:
    - cron: "0 18 * * *"   # 每日 UTC 18:00 = 台灣時間 02:00
  workflow_dispatch:
    inputs:
      mode:
        description: "Benchmark mode: smoke (5 cases) | lite (100 cases)"
        required: false
        default: "smoke"

env:
  PYTHONPATH: ${{ github.workspace }}
  NEXUS_BENCHMARK: "1"

jobs:
  benchmark:
    name: "Run SWE-bench Subset"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python Environment ─────────────────────────────────
      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install uv"
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: "Install Nexus Dependencies"
        run: |
          uv sync --no-dev

      # ── 3. Docker Ready Check ─────────────────────────────────
      - name: "Check Docker Availability"
        run: |
          docker info && echo "DOCKER_AVAILABLE=true" >> $GITHUB_ENV || echo "DOCKER_AVAILABLE=false" >> $GITHUB_ENV

      # ── 4. Run Benchmark ──────────────────────────────────────
      - name: "Execute Benchmark Subset"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'smoke' }}"
          echo "🚀 Running benchmark mode: $MODE"
          uv run python scripts/ci/run_swebench_subset.py \
            --mode "$MODE" \
            --output ci_benchmark_results.jsonl

      # ── 5. Generate Report ─────────────────────────────────────
      - name: "Generate Report & Update Step Summary"
        run: |
          uv run python scripts/ci/generate_report.py \
            --input ci_benchmark_results.jsonl \
            --summary-output benchmark_summary.md
          cat benchmark_summary.md >> $GITHUB_STEP_SUMMARY

      # ── 6. Save Results ────────────────────────────────────────
      - name: "Commit Benchmark Results"
        run: |
          RESULT_DIR="benchmark_results/$(date +'%Y-%m-%d')"
          mkdir -p "$RESULT_DIR"
          cp ci_benchmark_results.jsonl "$RESULT_DIR/results.jsonl"
          cp benchmark_summary.md "$RESULT_DIR/report.md"

          git config --global user.name "nexus-benchmark[bot]"
          git config --global user.email "nexus-bot@muse-core.ai"
          git add benchmark_results/
          git diff --staged --quiet || git commit -m "📊 Benchmark CI: $(date +'%Y-%m-%d') [skip ci]"
          git push origin HEAD:main || echo "Push skipped (no changes)"

      # ── 7. Upload Artifacts ────────────────────────────────────
      - name: "Upload Artifacts"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "benchmark-results-${{ github.run_id }}"
          path: |
            ci_benchmark_results.jsonl
            benchmark_summary.md
          retention-days: 30
