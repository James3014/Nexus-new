name: Bindings preflight

# #2365: the merge queue's `coord ready` ran scripts/ops/pr_preflight.py --only
# bindings by hand before every GO. This workflow runs the same check on GitHub
# so it can be a required status and no session has to do it. It uses the
# default-branch copy of the script (pull_request_target), never PR code: the PR
# head is fetched as plain git objects so the script can read its commit
# messages, and the PR body/title come from the REST API. The result is
# published as the commit status "Bindings preflight (default branch)" on the
# PR head; a body edit (types: edited) re-runs it without a new push.
# The check fails when `Closes #N`, the NEXUS_ISSUE_INTENT_V1 block and the
# final merge fields (commit messages) disagree (#1247 option A), or when the
# PR cannot be read.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  bindings-preflight:
    name: Bindings preflight (default branch job)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout default branch (never PR code)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Mark the status pending before anything can fail
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTEXT: Bindings preflight (default branch)
        run: |
          set -euo pipefail
          # A re-run (e.g. a body edit) must never leave an earlier success standing
          # if a later step fails: the status goes pending first.
          gh api -X POST "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state=pending -f context="$CONTEXT" -f target_url="$RUN_URL" \
            -f description="bindings preflight running" > /dev/null

      - name: Fetch the PR head as git objects only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # No checkout of the PR tree: the script only needs the commits for
          # their messages. The token is passed per command, never stored.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # The runner masks the token, not its base64 form: mask that too, and pass
          # it through the environment instead of argv.
          echo "::add-mask::${auth}"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
            git fetch --no-tags origin "refs/pull/${PR}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"

      - name: Run the bindings preflight and publish the status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTEXT: Bindings preflight (default branch)
        run: |
          # The runner starts bash with -e; turn it off so a FAIL still publishes its status.
          set +e -uo pipefail
          out="$RUNNER_TEMP/bindings-preflight.txt"
          python3 -I scripts/ops/pr_preflight.py --repo . --pr "$PR" --head "$HEAD_SHA" \
            --only bindings --no-fetch > "$out" 2>&1
          rc=$?
          # Never let printed text act as a workflow command (#2368 review).
          stop="$(python3 -I -c 'import secrets; print(secrets.token_hex(16))' 2>/dev/null)" ||
            stop="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          [[ "$stop" =~ ^[0-9a-f]{32}$ ]] || { echo "no usable stop token" >&2; exit 1; }
          echo "::stop-commands::${stop}"
          cat "$out"
          echo "::${stop}::"
          # SKIP is not PASS: the check must report its own PASS line (#2368 review).
          if [ "$rc" -eq 0 ] && ! grep -q '^PASS  bindings' "$out"; then
            rc=1
            echo "bindings check did not report PASS (skipped or not run)" >> "$out"
          fi
          if [ "$rc" -eq 0 ]; then
            state=success; description="bindings agree at head ${HEAD_SHA:0:12}"
          else
            # One line, sanitized: the status text is rendered on the PR.
            first="$(grep -m1 -E '^FAIL|^PREFLIGHT|Error|error|did not report PASS' "$out" | tr -c 'A-Za-z0-9 _:#.,()/-' ' ' | cut -c1-120 || true)"
            state=failure; description="${first:-bindings preflight failed} (head ${HEAD_SHA:0:12})"
          fi
          gh api -X POST "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state="$state" -f context="$CONTEXT" -f target_url="$RUN_URL" \
            -f description="${description:0:140}" > /dev/null || exit 1
          exit "$rc"
