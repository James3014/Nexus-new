name: Nexus Scoped Typecheck (nexus/core blocking)

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  typecheck:
    name: Pyright Scan (nexus/core blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv sync --frozen --all-groups --all-extras
        env:
          UV_SYSTEM_PYTHON: 0

      - name: Run Pyright (nexus/core only)
        id: pyright
        run: |
          uv run pyright nexus/core; echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Report Result
        if: always()
        run: |
          echo "## Pyright Scan (nexus/core blocking)" >> $GITHUB_STEP_SUMMARY
          echo "Exit code: ${{ steps.pyright.outputs.exit_code }}" >> $GITHUB_STEP_SUMMARY
          echo "This scan blocks CI if type errors are detected in nexus/core." >> $GITHUB_STEP_SUMMARY
          echo "Note: pyrightconfig.json excludes optional integration adapters (eternal_memory.py, web_action_executor.py)." >> $GITHUB_STEP_SUMMARY
