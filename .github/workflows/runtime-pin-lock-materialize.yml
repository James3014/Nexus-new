name: Runtime pin lock materializer temporary

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install temporary gitlink metadata for checkout cleanup
        run: |
          set -euo pipefail
          while IFS= read -r -d '' index_entry; do
            mode="${index_entry%% *}"
            if [ "$mode" != "160000" ]; then
              continue
            fi
            gitlink_path="${index_entry#*$'\t'}"
            if ! git config --file .gitmodules --get "submodule.${gitlink_path}.path" >/dev/null 2>&1; then
              git config --file .gitmodules "submodule.${gitlink_path}.path" "$gitlink_path"
              git config --file .gitmodules "submodule.${gitlink_path}.url" .
            fi
          done < <(git ls-files --stage -z)
          git submodule foreach --recursive ':'

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.2"
          enable-cache: false

      - name: Materialize and commit exact dependency lock
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          uv lock
          NEW_RUNTIME_SHA=b48fbd7abe96041bffcea31fa31fa90e78582f02
          OLD_RUNTIME_SHA=d65e3ea7628a07bd73dee461750392bcdf85c3ac
          grep -Fq "$NEW_RUNTIME_SHA" pyproject.toml
          grep -Fq "$NEW_RUNTIME_SHA" requirements/canonical-runtime.txt
          grep -Fq "$NEW_RUNTIME_SHA" uv.lock
          if grep -Fq "$OLD_RUNTIME_SHA" uv.lock; then
            echo "stale runtime SHA remains in uv.lock" >&2
            exit 1
          fi
          git diff --check
          git add uv.lock
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "uv.lock already materialized"
            exit 0
          fi
          git config user.name "Nexus CI"
          git config user.email "nexus-ci@example.invalid"
          git commit -m "chore(runtime): materialize Wave 2 Runtime lock"
          git push origin "HEAD:${HEAD_REF}"
