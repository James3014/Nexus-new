name: Runtime pin lock materializer temporary

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  materialize-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.2"
          enable-cache: false

      - name: Materialize frozen dependency lock
        run: |
          set -euo pipefail
          uv lock
          NEW_RUNTIME_SHA=b48fbd7abe96041bffcea31fa31fa90e78582f02
          OLD_RUNTIME_SHA=d65e3ea7628a07bd73dee461750392bcdf85c3ac
          grep -Fq "$NEW_RUNTIME_SHA" pyproject.toml
          grep -Fq "$NEW_RUNTIME_SHA" requirements/canonical-runtime.txt
          grep -Fq "$NEW_RUNTIME_SHA" uv.lock
          if grep -Fq "$OLD_RUNTIME_SHA" uv.lock; then
            echo "stale runtime SHA remains in uv.lock" >&2
            exit 1
          fi
          git diff --check
          git diff -- uv.lock

      - name: Upload generated uv.lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-wave2-lock-${{ github.event.pull_request.head.sha }}
          path: uv.lock
          if-no-files-found: error
          retention-days: 1
