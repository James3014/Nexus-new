[project]
name = "nexus-singularity"
version = "28.3.0"
description = "Nexus Singularity OS: Hardened Governance & Swarm Engine"
authors = [{name = "Nexus Engineers", email = "eng@nexus-singularity.os"}]
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "lancedb>=0.4.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "urllib3<2.6",
    "charset-normalizer<3.5",
    "filelock>=3.0.0",
    "grpcio>=1.50.0",
    "grpcio-tools>=1.50.0",
    "protobuf>=4.21.0",
    "rich>=13.0.0",
    "web3>=6.0.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "networkx>=3.0",
    "anyio>=4.0.0",
    "aiohttp>=3.8.0",
    "httpx>=0.24.0",
    "typer>=0.9.0",
    "click>=8.1.0",
    "websockets>=11.0",
    "tqdm>=4.65.0",
    "sentence-transformers>=2.2.0",
    "huggingface-hub>=0.16.0",
    "safetensors>=0.3.0",
    "fsspec>=2023.6.0",
    "accelerate>=0.21.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "playwright>=1.58.0",
    "opentelemetry-api>=1.15.0",
    "opentelemetry-sdk>=1.15.0",
    "rank-bm25>=0.2.2",
]
requires-python = ">=3.10"

[tool.poetry]
name = "nexus-singularity"
version = "28.3.0"
description = "Nexus Singularity OS: Hardened Governance & Swarm Engine"
authors = ["Nexus Engineers <eng@nexus-singularity.os>"]
packages = [{include = "nexus"}]

[tool.poetry.dependencies]
python = "^3.10"
slack-sdk = { version = "^3.21.3", optional = true }
websocket-client = { version = "^1.5.1", optional = true }
langgraph = { version = "^0.0.10", optional = true }

[tool.poetry.extras]
slack = ["slack-sdk", "websocket-client"]
graph = ["langgraph"]

[tool.poetry.scripts]
nexus = "scripts.engine.nexus_cli:cli"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.4.0",
]

[tool.ruff]
# Target Python version
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Conservative baseline rules:
# E: Error, F: Pyflakes, I: Isort
select = ["E", "F", "I"]
ignore = []

# Allow fix for specific rules
fixable = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["nexus"]
