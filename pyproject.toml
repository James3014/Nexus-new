[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-nexus"
version = "9.0.0a1"
description = "Nexus v9: Modular Intelligence Orchestrator for Muse-Core"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "James Chen", email = "james@example.com"}
]
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0.0",
    "prompt_toolkit>=3.0.0",
    "gitpython>=3.1.0",
    "radon>=5.1.0",
    "dependency-injector>=4.41.0",
    "pydantic-settings>=2.0.0",
    "lancedb>=0.5.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "redis>=5.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyyaml>=6.0",
    "tiktoken>=0.6.0"
]

[project.scripts]
nexus = "scripts.nexus_cli:main"
nexus-pilot = "scripts.nexus_chat_cli:main"
nexus-pilot-friend = "scripts.nexus_pilot_friend:main"
nexus-pilot-proxy = "scripts.nexus_sentinel_proxy:run_proxy"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus*", "scripts*"]
