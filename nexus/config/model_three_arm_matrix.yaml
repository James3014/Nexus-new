schema: nexus.model_three_arm_matrix.v1
status: completed_initial_matrix
owner: James Chen
last_updated: '2026-07-29'
authority_document: docs/arch/MODEL_WORKFORCE_POLICY.md
result_authority: nexus/config/model_workforce.yaml
route_authority: CapabilityPlanner
latest_snapshot:
  date: '2026-07-29'
  attempted_model_count: 25
  semantically_scored_model_count: 21
  provider_blocked_model_count: 4
  all_enrolled_models_attempted: true
  stable_promotion_proven: false
  full_receipt_closure_proven: false
  summary_report: docs/reports/model_workforce_three_arm_calibration_20260729.md
  machine_summary: docs/reports/model_workforce_three_arm_calibration_20260729.json
public_claim_allowed: false

admission_contract:
  requires_real_invocation: true
  requires_nonempty_response: true
  requires_parseable_benchmark_envelope: true
  catalog_presence_is_not_availability: true
  duplicate_local_digest_is_one_model: true
  embedding_models_excluded: true
  provider_or_quota_failure_is_not_model_failure: true

arm_contract:
  arms: [bare, nexus_bounded, nexus_full]
  same_model_identity: true
  same_composite_task: true
  same_deterministic_verifier: true
  same_output_schema: true
  direct_workspace_mutation: false
  isolated_working_directory: /tmp/nexus-model-bench
  bare:
    nexus_context: none
    purpose: model_baseline
  nexus_bounded:
    nexus_context: diagnosis_assertions_schema
    purpose: measure_context_and_contract_uplift
  nexus_full:
    nexus_context: planner_evidence_verifier_learning_receipt
    purpose: measure_governed_lifecycle_fit

composite_task:
  task_id: u3a-composite-v1
  dimensions:
    - started_call_accounting
    - bounded_python_implementation
    - evidence_claim_boundary
  repetitions:
    universal_gate: 1
    promotion_gate: 2
  verifier_assertions: 11

role_grade_policy:
  current_roles_are_provisional_until_three_arm_complete: true
  no_final_role_from_bare_only: true
  nexus_bounded_required_for_role_assignment: true
  nexus_full_required_for_autonomy_promotion: true
  provider_failure_excluded_from_semantic_score: true
  exact_schema_and_external_verifier_required: true
  production_ready_never_model_self_assessed: true
  minimum_role_confidence:
    provisional: one_complete_three_arm
    stable: two_repetitions_and_role_specific_suite

