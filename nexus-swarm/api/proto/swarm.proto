syntax = "proto3";

package nexus.swarm.v1;

option go_package = "nexus-swarm/api/proto";

// SwarmManager 定義了 Nexus 聯邦的中心調度與心跳監控
service SwarmManager {
  // Heartbeat 用於追蹤節點存活與能力上報
  rpc Heartbeat(HeartbeatReq) returns (HeartbeatResp) {}

  // SensingStream 提供雙向串流能力的即時感知審計
  rpc SensingStream(stream SensingReq) returns (stream SensingResp) {}

  // Sensing (Unary) 保留用於單次快速感知請求
  rpc Sensing(SensingReq) returns (SensingResp) {}
}

message HeartbeatReq {
  string node_id = 1;
  repeated string capabilities = 2; // e.g., ["rust-reflex", "ast-audit", "gpu-eval"]
  string status = 3; // "ONLINE", "BUSY", "MAINTENANCE"
  int64 timestamp = 4;
}

message HeartbeatResp {
  bool accepted = 1;
  int64 sync_timestamp = 2;
  string next_action = 3; // e.g., "STANDBY", "FLUSH_CACHE"
}

message SensingReq {
  string task_id = 1;
  string repo_url = 2;
  string path = 3;
  string task_type = 4;
  string token = 5;
  string traceparent = 6; // W3C format
  bytes payload = 7; // Optional: Code snippet or metadata
}

message SensingResp {
  string node_id = 1;
  string status = 2; // "PASS", "FAIL", "REJECT"
  string summary = 3;
  Metrics metrics = 4;
  string error = 5;
  bytes results_patch = 6; // Optional: Suggested fix or patch
}

message Metrics {
  int64 selection_latency_us = 1;
  int64 network_latency_ms = 2;
  int64 execution_ms = 3;
  string region = 4;
  float confidence_score = 5;
}
