syntax = "proto3";

package nexus.swarm.v1;

option go_package = "./api/proto";

service SwarmManager {
  // 控制面 指令
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  
  // 任務面 指令
  rpc DispatchTask(DispatchTaskRequest) returns (DispatchTaskResponse);
  rpc ReportTask(ReportTaskRequest) returns (ReportTaskResponse);
  
  // 狀態面 指令
  rpc GetClusterStatus(GetClusterStatusRequest) returns (GetClusterStatusResponse);
}

message RegisterNodeRequest {
  string node_id = 1;
  string version = 2;
  repeated string capabilities = 3;
  string region = 4;
  int32 cpu_cores = 5;
  int64 memory_mb = 6;
  string advertise_addr = 7;
  
  // 🛡️ TraceContext (W3C Standard)
  string traceparent = 8;
  string tracestate = 9;
}

message RegisterNodeResponse {
  bool accepted = 1;
  string reason = 2;
  int32 heartbeat_interval_sec = 3;
  string manager_id = 4;
}

message HeartbeatRequest {
  string node_id = 1;
  double cpu_percent = 2;
  double memory_percent = 3;
  int32 active_tasks = 4;
  int64 timestamp_unix = 5;
  
  string traceparent = 6;
  string tracestate = 7;
}

message HeartbeatResponse {
  bool ok = 1;
  string status = 2; // HEALTHY / DEGRADED
}

message DispatchTaskRequest {
  string task_id = 1;
  string decision_id = 2;
  string phase = 3; // P-D-R-A-C
  string payload_json = 4;
  repeated string required_capabilities = 5;
  
  string traceparent = 6;
  string tracestate = 7;
}

message DispatchTaskResponse {
  bool accepted = 1;
  string assigned_node_id = 2;
  string status = 3;
}

message ReportTaskRequest {
  string task_id = 1;
  string decision_id = 2;
  string node_id = 3;
  string status = 4; // SUCCESS / FAILED / SECURITY_VIOLATION
  string summary = 5;
  double latency_ms = 6;
  
  string traceparent = 7;
  string tracestate = 8;
}

message ReportTaskResponse {
  bool ack = 1;
}

message GetClusterStatusRequest {}

message NodeStatus {
  string node_id = 1;
  string region = 2;
  double cpu_percent = 3;
  double memory_percent = 4;
  int32 active_tasks = 5;
  int64 last_seen_unix = 6;
  string health = 7; // HEALTHY / STALE / OFFLINE
  string advertise_addr = 8;
}

message GetClusterStatusResponse {
  string manager_id = 1;
  repeated NodeStatus nodes = 2;
  int32 total_nodes = 3;
  int32 healthy_nodes = 4;
}
