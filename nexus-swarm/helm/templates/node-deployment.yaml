{{- range .Values.regions }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus-swarm.fullname" $ }}-node-{{ .name }}
  labels:
    app.kubernetes.io/component: node
    region: {{ .name }}
spec:
  replicas: {{ .nodeReplicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: node
      region: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: node
        region: {{ .name }}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: [{{ .name }}]
      containers:
      - name: node
        image: "{{ $.Values.node.image }}"
        env:
        - name: MANAGER_ADDR
          value: "{{ include "nexus-swarm.fullname" $ }}-manager:9000"
        - name: REGION
          value: "{{ .name }}"
        volumeMounts:
        - name: certs
          mountPath: /app/certs
          readOnly: true
        resources:
          {{- toYaml $.Values.node.resources | nindent 10 }}
      volumes:
      - name: certs
        secret:
          secretName: nexus-swarm-node-tls
{{- end }}
