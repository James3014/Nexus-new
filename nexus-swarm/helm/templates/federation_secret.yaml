# 🛡️ Nexus Swarm Federation Secret (v22/v24)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexus-swarm.fullname" . }}-federation-token
  labels:
    {{- include "nexus-swarm.labels" . | nindent 4 }}
type: Opaque
data:
  # The shared token for multi-cluster federation identity
  token: {{ .Values.federation.token | b64enc | quote }}
