version: v0-longrun
defaults:
  ask_policy: no_ask
  max_retry: 2
  timeout_sec: 1800

tasks:
  - id: preflight.read_index
    depends_on: []
    run: "test -f docs/INDEX.md"
    done_when:
      type: command_rc_zero
    on_fail: escalate
    max_retry: 0
    ask_policy: no_ask

  - id: wp4.memory.schema
    depends_on: [preflight.read_index]
    run: "uv run python3 -c \"print('wp4.memory.schema')\""
    done_when:
      type: command_rc_zero
    on_fail: retry

  - id: wp4.memory.ingest
    depends_on: [wp4.memory.schema]
    run: "uv run python3 -c \"print('wp4.memory.ingest')\""
    done_when:
      type: command_rc_zero
    on_fail: retry

  - id: wp4.policy.learning
    depends_on: [wp4.memory.ingest]
    run: "uv run python3 -c \"print('wp4.policy.learning')\""
    done_when:
      type: command_rc_zero
    on_fail: retry

  - id: wp4.optimize.loop
    depends_on: [wp4.policy.learning]
    run: "uv run python3 -c \"print('wp4.optimize.loop')\""
    done_when:
      type: command_rc_zero
    on_fail: retry

  - id: gate.ci.r1
    depends_on: [wp4.optimize.loop]
    run: "uv run scripts/ops/ci_gate.py"
    done_when:
      type: command_rc_zero
    on_fail: retry
    evidence_paths:
      - ci_benchmark.csv
      - .nexus/task_status.json

  - id: bench.replay.r1
    depends_on: [gate.ci.r1]
    run: "uv run scripts/nexus_cli.py nexus:benchmark --tasks 10 --output ci_benchmark.csv"
    done_when:
      type: command_rc_zero
    on_fail: retry
    evidence_paths:
      - ci_benchmark.csv

  - id: docs.sync.r1
    depends_on: [bench.replay.r1]
    run: "uv run scripts/nexus_cli.py nexus:runner --task docs.index.sync"
    done_when:
      type: command_rc_zero
    on_fail: continue
    evidence_paths:
      - docs/INDEX.md
      - docs/EXEC_LIVE_STATUS.md

  - id: gate.ci.r2
    depends_on: [docs.sync.r1]
    run: "uv run scripts/ops/ci_gate.py"
    done_when:
      type: command_rc_zero
    on_fail: retry

  - id: bench.replay.r2
    depends_on: [gate.ci.r2]
    run: "uv run scripts/nexus_cli.py nexus:benchmark --tasks 10 --output ci_benchmark.csv"
    done_when:
      type: command_rc_zero
    on_fail: retry

  - id: docs.sync.r2
    depends_on: [bench.replay.r2]
    run: "uv run scripts/nexus_cli.py nexus:runner --task docs.index.sync"
    done_when:
      type: command_rc_zero
    on_fail: continue

  - id: gate.ci.r3
    depends_on: [docs.sync.r2]
    run: "uv run scripts/ops/ci_gate.py"
    done_when:
      type: command_rc_zero
    on_fail: retry

  - id: bench.replay.r3
    depends_on: [gate.ci.r3]
    run: "uv run scripts/nexus_cli.py nexus:benchmark --tasks 10 --output ci_benchmark.csv"
    done_when:
      type: command_rc_zero
    on_fail: retry

  - id: docs.sync.r3
    depends_on: [bench.replay.r3]
    run: "uv run scripts/nexus_cli.py nexus:runner --task docs.index.sync"
    done_when:
      type: command_rc_zero
    on_fail: continue

  - id: wp4.handoff.report
    depends_on: [docs.sync.r3]
    run: "uv run python3 -c \"print('wp4.handoff.report')\""
    done_when:
      type: command_rc_zero
    on_fail: continue
